<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dar Al-Kalimah - Jeu de relier : Les lettres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --bordeaux:#5D1828;
    --bordeaux-dark:#3a0f19;
    --gold:#C8A462;
    --gold-light:#dfc28b;
    --white:#FFFFFF;
    --radius-xl:28px;
    --radius-lg:22px;
    --radius-md:18px;
    --radius-sm:12px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    height:100dvh; height:100svh;
    background:#FFFFFF;
    font-family:'Montserrat', system-ui, sans-serif;
    color:var(--bordeaux);
    display:flex; justify-content:center;
    padding:12px 14px calc(10px + var(--safe-bottom));
    padding-top:calc(12px + var(--safe-top));
    overflow:hidden;
    position:relative;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:
      radial-gradient(circle at 12% 18%, rgba(200,164,98,0.13), transparent 26%),
      radial-gradient(circle at 88% 12%, rgba(93,24,40,0.08), transparent 28%),
      radial-gradient(circle at 50% 92%, rgba(200,164,98,0.10), transparent 34%);
  }
  .ar-text{
    font-family:'Amiri','Traditional Arabic',serif;
    direction:rtl; unicode-bidi:isolate;
    font-feature-settings:"liga" 1,"calt" 1,"mark" 1,"mkmk" 1;
  }

  #app{ width:100%; max-width:640px; height:100%; display:flex; flex-direction:column; min-height:0; }

  .top-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex:0 0 auto; }
  .lang-toggle{ display:flex; background:rgba(93,24,40,0.06); border:1px solid rgba(200,164,98,0.4); border-radius:999px; padding:3px; }
  .lang-toggle button{
    border:none; background:transparent; color:var(--bordeaux); font-family:'Montserrat',sans-serif;
    font-weight:700; font-size:0.82rem; padding:6px 14px; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .lang-toggle button.active{ background:var(--bordeaux); color:var(--gold); }
  .btn-house{
    width:42px; height:42px; border-radius:999px; border:1px solid rgba(200,164,98,0.5);
    background:rgba(93,24,40,0.06); color:var(--bordeaux); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1.1rem; transition:.2s;
  }
  .btn-house i{ color:var(--bordeaux); }
  .btn-house:hover{ background:var(--bordeaux); }
  .btn-house:hover i{ color:var(--gold); }

  .view{ display:none; flex:1; min-height:0; flex-direction:column; align-items:center; text-align:center; }
  .view.active{ display:flex; }
  #view-intro.active, #view-end.active{ overflow-y:auto; }

  .app-title{ font-family:'Cinzel',serif; color:var(--bordeaux); font-size:clamp(1.3rem,5vw,1.8rem); margin:0 0 8px; }
  .app-subtitle{ color:#6b4b53; font-size:0.96rem; margin:0 0 22px; line-height:1.5; }

  .intro-container{
    width:100%; background:#fff; border:1px solid rgba(200,164,98,0.3);
    border-radius:var(--radius-xl); padding:34px 26px; box-shadow:0 20px 50px rgba(93,24,40,0.08);
    position:relative;
  }
  .intro-container::before{
    content:""; position:absolute; inset:12px; border-radius:20px;
    border:1px solid rgba(200,164,98,0.18); pointer-events:none;
  }
  .intro-icon{
    width:74px; height:74px; margin:0 auto 18px; border-radius:999px;
    background:linear-gradient(145deg, var(--bordeaux), var(--bordeaux-dark));
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(93,24,40,0.25);
  }
  .intro-logo{ font-family:'Cinzel',serif; font-weight:700; font-size:1.3rem; letter-spacing:0.06em; color:var(--gold); }

  .rules-list{ list-style:none; padding:0; margin:0 0 26px; text-align:left; }
  .rules-list li{ display:flex; align-items:flex-start; gap:12px; font-size:0.92rem; color:#4a3338; margin-bottom:12px; line-height:1.5; }
  .step-num{
    display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; border-radius:999px;
    background:var(--bordeaux); color:#fff; font-size:0.7rem; font-weight:700; flex-shrink:0; margin-top:1px;
  }

  .btn-primary{
    background:linear-gradient(145deg, var(--bordeaux), var(--bordeaux-dark)); color:var(--gold);
    border:none; border-radius:999px; padding:15px 38px; font-family:'Montserrat',sans-serif; font-weight:700;
    font-size:1rem; letter-spacing:0.03em; cursor:pointer; box-shadow:0 10px 24px rgba(93,24,40,0.25);
    transition:transform .2s;
  }
  .btn-primary:active{ transform:scale(0.97); }
  .btn-secondary{
    background:#fff; color:var(--bordeaux); border:2px solid var(--gold); border-radius:999px;
    padding:13px 34px; font-family:'Montserrat',sans-serif; font-weight:700; font-size:0.96rem;
    cursor:pointer; margin-top:12px;
  }

  .stat-row{ display:flex; gap:10px; width:100%; margin-bottom:10px; flex:0 0 auto; }
  .stat-chip{
    flex:1; background:#fff; border:1px solid rgba(200,164,98,0.4); border-radius:999px;
    padding:9px 14px; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:0.85rem; color:var(--bordeaux);
  }
  .stat-chip i{ color:var(--gold); }

  .relier-area{ position:relative; flex:1; min-height:0; width:100%; display:flex; flex-direction:row; gap:16px; }
  .relier-svg{ position:absolute; top:0; left:0; pointer-events:none; z-index:1; }
  .relier-col{ position:relative; z-index:2; flex:1; min-width:0; height:100%; display:flex; flex-direction:column; gap:5px; }

  .relier-item{
    position:relative; flex:1; min-height:0; background:#fff; border:2px solid rgba(200,164,98,0.4);
    border-radius:var(--radius-sm); display:flex; align-items:center; cursor:pointer;
    padding:2px 14px; transition:border-color .15s, background .15s, transform .1s;
  }
  .relier-col-left .relier-item{ justify-content:flex-end; }
  .relier-col-right .relier-item{ justify-content:flex-start; }
  .relier-item.selected{ border-color:var(--bordeaux); background:rgba(93,24,40,0.07); }
  .relier-item.matched{ border-color:var(--gold); background:rgba(200,164,98,0.10); cursor:default; }
  .relier-item.error{ border-color:#b3261e; animation:shake .4s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

  .dot{
    position:absolute; top:50%; transform:translateY(-50%); width:11px; height:11px; border-radius:50%;
    background:var(--gold); border:2px solid #fff; box-shadow:0 0 0 1px rgba(200,164,98,0.55); z-index:3;
  }
  .relier-col-left .dot{ right:-6px; }
  .relier-col-right .dot{ left:-6px; }
  .relier-item.matched .dot{ background:var(--bordeaux); }

  .relier-check{
    position:absolute; top:3px; font-size:0.62rem; color:var(--gold); opacity:0; transition:opacity .2s;
  }
  .relier-col-left .relier-check{ left:5px; }
  .relier-col-right .relier-check{ right:5px; }
  .relier-item.matched .relier-check{ opacity:1; }

  .relier-letter{ font-size:clamp(0.85rem, 4.6vh, 1.7rem); color:var(--bordeaux); line-height:1; }
  .relier-phon{ font-family:'Montserrat',sans-serif; font-weight:700; font-size:clamp(0.6rem, 2.1vh, 0.85rem); color:var(--bordeaux); text-align:left; }

  .relier-line{ stroke:var(--gold); stroke-width:2.5; fill:none; stroke-linecap:round; }

  #view-end .intro-container{ padding:40px 26px; }
  .intro-icon.success{ background:linear-gradient(145deg, var(--gold), var(--gold-light)); }
  .intro-icon.success i{ color:var(--bordeaux); font-size:2rem; }
  .end-detail{ color:#6b4b53; font-size:0.98rem; margin-bottom:26px; }

  @media (max-width:480px){
    .intro-container{ padding:26px 18px; }
    .app-title{ font-size:1.3rem; }
    .relier-area{ gap:10px; }
  }
  @media (max-width:360px){
    .stat-chip{ font-size:0.76rem; padding:8px 10px; }
    .relier-item{ padding:2px 10px; }
  }
  @media print{ body{ display:none; } }
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div class="lang-toggle" id="lang-toggle">
      <button data-lang="fr" class="active">FR</button>
      <button data-lang="es">ES</button>
    </div>
    <button class="btn-house" onclick="goHome()" aria-label="Retour à l'accueil"><i class="fa-solid fa-house"></i></button>
  </div>

  <section id="view-intro" class="view active">
    <div class="intro-container">
      <div class="intro-icon"><span class="intro-logo">DAK</span></div>
      <h1 class="app-title" id="intro-title"></h1>
      <p class="app-subtitle" id="intro-subtitle"></p>
      <ul class="rules-list">
        <li><span class="step-num">1</span><span id="step1-text"></span></li>
        <li><span class="step-num">2</span><span id="step2-text"></span></li>
        <li><span class="step-num">3</span><span id="step3-text"></span></li>
      </ul>
      <button id="btn-start" class="btn-primary"></button>
    </div>
  </section>

  <section id="view-game" class="view">
    <div class="stat-row">
      <div class="stat-chip"><i class="fa-solid fa-link"></i><span id="pairs-label"></span></div>
      <div class="stat-chip"><i class="fa-solid fa-arrows-rotate"></i><span id="moves-label"></span></div>
    </div>
    <div class="relier-area" id="relier-area">
      <svg class="relier-svg" id="relier-svg"></svg>
      <div class="relier-col relier-col-left" id="col-left"></div>
      <div class="relier-col relier-col-right" id="col-right"></div>
    </div>
  </section>

  <section id="view-end" class="view">
    <div class="intro-container">
      <div class="intro-icon success"><i class="fa-solid fa-star"></i></div>
      <h1 class="app-title" id="end-title"></h1>
      <p class="end-detail" id="end-detail"></p>
      <button id="btn-restart" class="btn-primary"></button>
      <br>
      <button id="btn-home2" class="btn-secondary" onclick="goHome()"></button>
    </div>
  </section>
</div>

<script>
const HOME_HREF = "index.html";
const SUCCESS_AUDIO = "mabruk.mp3";
const SILENT_UNLOCK = "data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTAAAAA=";

const LETTERS = [
  {id:1, letter:"أ", fr:"Alif hamza", es:"Alif hamza", audio:"audio/01-alif.mp3"},
  {id:2, letter:"ب", fr:"Baa",        es:"Baa",        audio:"audio/02-baa.mp3"},
  {id:3, letter:"ت", fr:"Taa",        es:"Taa",        audio:"audio/03-taa.mp3"},
  {id:4, letter:"ث", fr:"Thaa",       es:"Zaa",        audio:"audio/04-thaa.mp3"},
  {id:5, letter:"ج", fr:"Jim",        es:"Yim",        audio:"audio/05-jim.mp3"},
  {id:6, letter:"ح", fr:"Haa",        es:"Ha",         audio:"audio/06-haa.mp3"},
  {id:7, letter:"خ", fr:"Khaa",       es:"Ja",         audio:"audio/07-khaa.mp3"},
  {id:8, letter:"د", fr:"Daal",       es:"Daal",       audio:"audio/08-dal.mp3"},
  {id:9, letter:"ذ", fr:"Dhaal",      es:"Dhal",       audio:"audio/09-dhal.mp3"},
  {id:10,letter:"ر", fr:"Raa",        es:"Raa",        audio:"audio/10-raa.mp3"},
  {id:11,letter:"ز", fr:"Zaay",       es:"Zaay",       audio:"audio/11-zay.mp3"},
  {id:12,letter:"س", fr:"Siin",       es:"Siin",       audio:"audio/12-siin.mp3"},
  {id:13,letter:"ش", fr:"Shiin",      es:"Shiin",      audio:"audio/13-shiin.mp3"},
  {id:14,letter:"ص", fr:"Saad",       es:"Sad",        audio:"audio/14-saad.mp3"}
];

const UI_TEXT = {
  fr:{
    introTitle:"Jeu de relier — Les lettres",
    introSubtitle:"Relie chaque lettre arabe à sa prononciation.",
    step1:"Touche une lettre à gauche, puis sa prononciation à droite.",
    step2:"Une bonne paire se relie par un trait doré et reste fixée.",
    step3:"Relie les 14 paires avec le moins de coups possible !",
    start:"Commencer",
    pairsLabel:(f,t)=>`Paires : ${f} / ${t}`,
    movesLabel:(m)=>`Coups : ${m}`,
    endTitle:"Bravo, ma chérie !",
    endDetail:(m)=>`Toutes les paires reliées en ${m} coups.`,
    restart:"Rejouer",
    home:"Accueil"
  },
  es:{
    introTitle:"Juego de unir — Las letras",
    introSubtitle:"Une cada letra árabe con su pronunciación.",
    step1:"Toca una letra a la izquierda, luego su pronunciación a la derecha.",
    step2:"Una pareja correcta se une con una línea dorada y queda fija.",
    step3:"¡Une las 14 parejas con el menor número de intentos!",
    start:"Empezar",
    pairsLabel:(f,t)=>`Parejas: ${f} / ${t}`,
    movesLabel:(m)=>`Intentos: ${m}`,
    endTitle:"¡Muy bien!",
    endDetail:(m)=>`Todas las parejas unidas en ${m} intentos.`,
    restart:"Jugar de nuevo",
    home:"Inicio"
  }
};

const AudioController = {
  player:new Audio(), effectPlayer:new Audio(), isUnlocked:false,
  init(){
    this.player.preload="none"; this.effectPlayer.preload="none";
    this.player.playsInline=true; this.effectPlayer.playsInline=true;
    this.player.volume=1; this.effectPlayer.volume=1;
  },
  async unlock(){
    if(this.isUnlocked) return true;
    try{
      const s = SILENT_UNLOCK;
      this.player.pause(); this.effectPlayer.pause();
      this.player.currentTime=0; this.effectPlayer.currentTime=0;
      this.player.src=s; this.effectPlayer.src=s;
      this.player.muted=true; this.effectPlayer.muted=true;
      await Promise.race([this.player.play().catch(() => {}), new Promise(r => setTimeout(r, 1200))]);
      this.player.pause(); this.player.currentTime=0;
      await Promise.race([this.effectPlayer.play().catch(() => {}), new Promise(r => setTimeout(r, 1200))]);
      this.effectPlayer.pause(); this.effectPlayer.currentTime=0;
      this.player.muted=false; this.effectPlayer.muted=false;
      this.player.removeAttribute("src"); this.effectPlayer.removeAttribute("src");
      this.player.load(); this.effectPlayer.load();
      this.isUnlocked=true; return true;
    }catch(_){ this.player.muted=false; this.effectPlayer.muted=false; return false; }
  },
  async playEffect(src){
    if(!src) return;
    try{ this.effectPlayer.pause(); this.effectPlayer.currentTime=0; this.effectPlayer.src=src; this.effectPlayer.load(); await this.effectPlayer.play(); }catch(_){}
  },
  stopAll(){
    this.player.pause(); this.effectPlayer.pause();
    this.player.currentTime=0; this.effectPlayer.currentTime=0;
  }
};
AudioController.init();

const state = {
  lang:'fr',
  leftOrder:[],
  rightOrder:[],
  matchedIds:new Set(),
  selected:null,
  lines:[],
  moves:0,
  lock:false,
  isStarting:false,
  hasFinished:false,
  hasPlayedSuccess:false
};

const DOM = {
  intro: document.getElementById('view-intro'),
  game: document.getElementById('view-game'),
  end: document.getElementById('view-end'),
  area: document.getElementById('relier-area'),
  svg: document.getElementById('relier-svg'),
  colLeft: document.getElementById('col-left'),
  colRight: document.getElementById('col-right'),
  pairsLabel: document.getElementById('pairs-label'),
  movesLabel: document.getElementById('moves-label')
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function switchView(name){
  [DOM.intro, DOM.game, DOM.end].forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
}

function setLang(lang){
  state.lang = lang;
  document.querySelectorAll('#lang-toggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  refreshUITexts();
  refreshPhonTexts();
}

function refreshUITexts(){
  const t = UI_TEXT[state.lang];
  document.getElementById('intro-title').textContent = t.introTitle;
  document.getElementById('intro-subtitle').textContent = t.introSubtitle;
  document.getElementById('step1-text').textContent = t.step1;
  document.getElementById('step2-text').textContent = t.step2;
  document.getElementById('step3-text').textContent = t.step3;
  document.getElementById('btn-start').textContent = t.start;
  document.getElementById('btn-restart').textContent = t.restart;
  document.getElementById('btn-home2').textContent = t.home;
  document.getElementById('end-title').textContent = t.endTitle;
  DOM.pairsLabel.textContent = t.pairsLabel(state.matchedIds.size, LETTERS.length);
  DOM.movesLabel.textContent = t.movesLabel(state.moves);
  if(state.hasFinished){
    document.getElementById('end-detail').textContent = t.endDetail(state.moves);
  }
}

function refreshPhonTexts(){
  document.querySelectorAll('#col-right .relier-item').forEach((el)=>{
    const idx = parseInt(el.dataset.idx,10);
    const item = state.rightOrder[idx];
    const span = el.querySelector('.relier-phon');
    if(span) span.textContent = state.lang === 'es' ? item.es : item.fr;
  });
}

function itemEl(side, idx){
  return (side==='left'?DOM.colLeft:DOM.colRight).querySelector('.relier-item[data-idx="'+idx+'"]');
}

function renderColumns(){
  DOM.colLeft.innerHTML = '';
  DOM.colRight.innerHTML = '';

  state.leftOrder.forEach((item, idx)=>{
    const el = document.createElement('div');
    el.className = 'relier-item';
    el.dataset.idx = idx;
    el.dataset.side = 'left';
    const dot = document.createElement('span'); dot.className = 'dot';
    const check = document.createElement('i'); check.className = 'fa-solid fa-circle-check relier-check';
    const span = document.createElement('span'); span.className = 'ar-text relier-letter'; span.textContent = item.letter;
    el.appendChild(check); el.appendChild(span); el.appendChild(dot);
    el.addEventListener('click', ()=>onItemClick('left', idx));
    DOM.colLeft.appendChild(el);
  });

  state.rightOrder.forEach((item, idx)=>{
    const el = document.createElement('div');
    el.className = 'relier-item';
    el.dataset.idx = idx;
    el.dataset.side = 'right';
    const dot = document.createElement('span'); dot.className = 'dot';
    const check = document.createElement('i'); check.className = 'fa-solid fa-circle-check relier-check';
    const span = document.createElement('span'); span.className = 'relier-phon'; span.textContent = state.lang === 'es' ? item.es : item.fr;
    el.appendChild(dot); el.appendChild(span); el.appendChild(check);
    el.addEventListener('click', ()=>onItemClick('right', idx));
    DOM.colRight.appendChild(el);
  });
}

function resizeSvg(){
  const a = DOM.area.getBoundingClientRect();
  DOM.svg.setAttribute('width', a.width);
  DOM.svg.setAttribute('height', a.height);
  DOM.svg.setAttribute('viewBox', '0 0 '+a.width+' '+a.height);
}

function dotCenter(side, idx){
  const el = itemEl(side, idx);
  const dot = el.querySelector('.dot');
  const r = dot.getBoundingClientRect();
  const a = DOM.area.getBoundingClientRect();
  return { x: r.left + r.width/2 - a.left, y: r.top + r.height/2 - a.top };
}

function redrawAllLines(){
  resizeSvg();
  DOM.svg.innerHTML = '';
  state.lines.forEach(l=>{
    drawLineSvg(l.leftIdx, l.rightIdx);
  });
}

function drawLineSvg(leftIdx, rightIdx){
  const p1 = dotCenter('left', leftIdx);
  const p2 = dotCenter('right', rightIdx);
  const midX = (p1.x + p2.x)/2;
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('class','relier-line');
  path.setAttribute('d', `M ${p1.x} ${p1.y} C ${midX} ${p1.y}, ${midX} ${p2.y}, ${p2.x} ${p2.y}`);
  DOM.svg.appendChild(path);
}

function clearSelectionHighlight(){
  if(!state.selected) return;
  const el = itemEl(state.selected.side, state.selected.idx);
  if(el) el.classList.remove('selected');
}

function onItemClick(side, idx){
  if(state.lock) return;
  const item = (side==='left'?state.leftOrder:state.rightOrder)[idx];
  if(state.matchedIds.has(item.id)) return;

  AudioController.playEffect(item.audio);

  if(state.selected && state.selected.side === side && state.selected.idx === idx){
    clearSelectionHighlight();
    state.selected = null;
    return;
  }

  if(!state.selected){
    state.selected = {side, idx, id:item.id};
    itemEl(side, idx).classList.add('selected');
    return;
  }

  if(state.selected.side === side){
    clearSelectionHighlight();
    state.selected = {side, idx, id:item.id};
    itemEl(side, idx).classList.add('selected');
    return;
  }

  const other = state.selected;
  const isMatch = other.id === item.id;
  const leftSel = other.side === 'left' ? other : {side, idx, id:item.id};
  const rightSel = other.side === 'left' ? {side, idx, id:item.id} : other;

  state.moves++;
  refreshUITexts();

  if(isMatch){
    state.lock = true;
    clearSelectionHighlight();
    state.selected = null;
    state.matchedIds.add(item.id);
    state.lines.push({leftIdx:leftSel.idx, rightIdx:rightSel.idx});
    itemEl('left', leftSel.idx).classList.add('matched');
    itemEl('right', rightSel.idx).classList.add('matched');
    drawLineSvg(leftSel.idx, rightSel.idx);
    refreshUITexts();
    setTimeout(()=>{ state.lock = false; checkEnd(); }, 250);
  }else{
    state.lock = true;
    const elA = itemEl(other.side, other.idx);
    const elB = itemEl(side, idx);
    elA.classList.add('error'); elB.classList.add('error');
    setTimeout(()=>{
      elA.classList.remove('error','selected'); elB.classList.remove('error');
      state.selected = null;
      state.lock = false;
    }, 650);
  }
}

function checkEnd(){
  if(state.matchedIds.size === LETTERS.length){
    endGame();
  }
}

function endGame(){
  if(state.hasFinished) return;
  state.hasFinished = true;
  AudioController.stopAll();

  switchView('end');
  document.getElementById('end-detail').textContent = UI_TEXT[state.lang].endDetail(state.moves);

  const end = Date.now() + 2600;
  (function frame(){
    if(typeof confetti === 'function'){
      confetti({ particleCount:5, angle:60,  spread:55, origin:{x:0}, colors:['#C8A462','#5D1828','#dfc28b'] });
      confetti({ particleCount:5, angle:120, spread:55, origin:{x:1}, colors:['#C8A462','#5D1828','#dfc28b'] });
    }
    if(Date.now() < end) requestAnimationFrame(frame);
  })();

  if(state.hasPlayedSuccess) return;
  state.hasPlayedSuccess = true;
  AudioController.playEffect(SUCCESS_AUDIO);
}

function startGame(){
  state.leftOrder = shuffle(LETTERS);
  state.rightOrder = shuffle(LETTERS);
  state.matchedIds = new Set();
  state.selected = null;
  state.lines = [];
  state.moves = 0;
  state.lock = false;
  state.hasFinished = false;
  state.hasPlayedSuccess = false;
  renderColumns();
  refreshUITexts();
  switchView('game');
  requestAnimationFrame(()=>{ resizeSvg(); });
}

function goHome(){
  window.location.href = HOME_HREF;
}

let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    if(document.getElementById('view-game').classList.contains('active')) redrawAllLines();
  }, 120);
});

document.getElementById('btn-start').addEventListener('click', async ()=>{
  if(state.isStarting) return;
  state.isStarting = true;
  await AudioController.unlock();
  startGame();
  state.isStarting = false;
});
document.getElementById('btn-restart').addEventListener('click', startGame);
document.querySelectorAll('#lang-toggle button').forEach(b=>{
  b.addEventListener('click', ()=> setLang(b.dataset.lang));
});

refreshUITexts();
</script>
</body>
</html>
