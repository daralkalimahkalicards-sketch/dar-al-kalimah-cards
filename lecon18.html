        console.error('Verification statut prof impossible (on continue avec la logique eleve) :', eProf);
      }
      try {
        const snap = await getDoc(doc(_db, 'eleves', user.uid));
        const autorise = snap.exists() && snap.data().partie2Debloquee === true;
        if (!autorise) { window.location.href = 'modules.html'; return; }
        document.body.style.visibility = 'visible';
      } catch (e) {
        console.error('Verification acces Partie 2 impossible :', e);
        window.location.href = 'modules.html';
      }
    });
  </script>
