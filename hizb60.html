<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#5D1828">
<title>Hizb 60 — Dar Al-Kalimah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
/* ============ VARIABLES & BASE ============ */
:root{
  --burgundy:#5D1828; --burgundy-dark:#3f0f1b; --gold:#C8A462; --gold-dark:#98703b;
  --white:#FFFFFF; --bg:#FAF6F0; --ink:#2a1016;
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--white); color:var(--ink); font-family:'Montserrat',sans-serif;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
h1,h2,h3,.title-font{font-family:'Cinzel',serif;}
.ar{font-family:'Amiri Quran','Amiri',serif;}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
.screen{display:none; min-height:100vh; padding-bottom:40px;}
.screen.active{display:block;}
[dir="rtl"] .flip-row{flex-direction:row-reverse;}

/* ============ HEADER ============ */
.app-header{
  position:sticky; top:0; z-index:50; background:linear-gradient(135deg, var(--burgundy), var(--burgundy-dark));
  box-shadow:0 4px 16px rgba(93,24,40,.25);
  display:flex; align-items:center; justify-content:flex-end;
  min-height:64px; padding:10px 16px;
}
/* دار الكلمة (arabe) + Dar Al-Kalimah (latin, en dessous) toujours centrés au milieu
   de l'en-tête, en position absolue : leur place ne bouge jamais, quel que soit
   l'écran (bouton retour visible ou non) ni la largeur du sélecteur de langue. */
.app-header .brand{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:1px;
  pointer-events:none; white-space:nowrap;
}
.app-header .brand .brand-ar{font-family:'Amiri Quran',serif; color:var(--gold); font-size:1.05rem; letter-spacing:.5px; line-height:1.2;}
.app-header .brand .brand-en{font-family:'Cinzel',serif; color:rgba(200,164,98,.75); font-size:.45rem; letter-spacing:1.5px; line-height:1;}
/* Bouton retour fixé à gauche, toujours à la même place (même masqué). */
.back-btn{position:absolute; left:16px; top:50%; transform:translateY(-50%); border:none; background:transparent; color:var(--gold); font-size:1.3rem; width:34px;}
.lang-switch{display:flex; gap:2px; background:rgba(255,255,255,.12); border-radius:50px; padding:3px;}
.lang-switch button{
  border:none; background:transparent; padding:5px 7px; border-radius:50px; font-size:.68rem;
  font-weight:700; color:rgba(255,255,255,.75); letter-spacing:.3px; min-width:30px;
}
.lang-switch button.active{background:var(--gold); color:var(--burgundy);}

/* ============ GENERIC ============ */
.wrap{max-width:720px; margin:0 auto; padding:24px 20px;}
.center{text-align:center;}
.btn-gold{
  background:var(--gold); color:var(--burgundy); border:none; padding:14px 34px; border-radius:50px;
  font-weight:700; font-size:.95rem; letter-spacing:.5px; box-shadow:0 6px 18px rgba(200,164,98,.35);
  min-height:44px;
}
.btn-outline{
  background:transparent; border:1.5px solid var(--gold); color:var(--burgundy); padding:12px 28px;
  border-radius:50px; font-weight:600; font-size:.88rem; min-height:44px;
}
.btn-burgundy{background:var(--burgundy); color:var(--white); border:none; padding:12px 26px; border-radius:50px; font-weight:700; min-height:44px;}
.btn-sm{padding:8px 16px; font-size:.78rem; border-radius:50px;}
.ref-note{font-size:.72rem; color:#8a7a6b; margin-top:6px; font-style:italic;}
.card-panel{background:var(--white); border:1px solid rgba(200,164,98,.3); border-radius:var(--radius); padding:18px; box-shadow:0 4px 20px rgba(93,24,40,.05);}

/* ============ SCREEN 1 : HADITH ============ */
#screen-hadith .wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:22px;}
.hadith-ar{font-family:'Amiri Quran',serif; font-size:1.7rem; line-height:2.5; color:var(--burgundy); text-align:center; max-width:640px;}
.hadith-tr{font-size:1rem; color:#555; text-align:center; max-width:560px; line-height:1.7;}
.hadith-ref{font-size:.8rem; color:var(--gold-dark); font-weight:600;}

/* ============ SCREEN 2 : POURQUOI ============ */
.why-text{font-size:1.05rem; line-height:1.9; color:var(--ink); margin-bottom:26px;}
.why-icons{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:24px 0;}
.why-icon{width:94px; text-align:center; font-size:.78rem; color:var(--burgundy);}
.why-icon .ic{width:54px; height:54px; margin:0 auto 8px; border-radius:50%; background:rgba(200,164,98,.15); display:flex; align-items:center; justify-content:center; font-size:1.4rem;}
.hadith-block-sm{margin-top:30px; padding-top:22px; border-top:1px dashed rgba(200,164,98,.4);}
.hadith-block-sm .hadith-ar{font-size:1.25rem; line-height:2.1;}

/* ============ SCREEN 3 : EVENTAIL ============ */
.fan-top{display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center; padding:10px 0 20px;}
.boy-img{width:120px; filter:drop-shadow(0 8px 14px rgba(93,24,40,.18));}
.fan-title h1{color:var(--burgundy); font-size:1.5rem; margin:0 0 4px;}
.fan-title p{color:#8a7a6b; font-size:.85rem; margin:0;}
.controls-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:26px;}
.riwaya-toggle{display:flex; background:rgba(93,24,40,.06); border-radius:50px; padding:4px;}
.riwaya-toggle button{border:none; background:transparent; padding:9px 18px; border-radius:50px; font-weight:700; font-size:.82rem; color:var(--burgundy); min-height:40px;}
.riwaya-toggle button.active{background:var(--burgundy); color:var(--white);}
.reciter-select{border:1.5px solid rgba(200,164,98,.5); border-radius:50px; padding:9px 16px; font-size:.82rem; color:var(--burgundy); background:var(--white); min-height:40px;}
.reciter-select option:disabled{color:#bbb;}

.fan-zone{position:relative; height:280px; margin:0 auto 10px; max-width:420px;}
.fan-blade{
  position:absolute; left:50%; bottom:0; width:120px; height:230px; margin-left:-60px;
  transform-origin:bottom center; background:linear-gradient(180deg,#fffdf7,#fbf2e2);
  border:2px solid var(--gold); border-radius:60px 60px 10px 10px;
  display:flex; flex-direction:column; align-items:center; padding-top:16px; gap:8px;
  box-shadow:0 10px 22px rgba(93,24,40,.14); transition:transform .25s;
  min-width:44px; min-height:44px;
}
.fan-blade:active{transform-origin:bottom center; filter:brightness(.96);}
.fan-blade .blade-icon{font-size:1.6rem;}
.fan-blade .blade-name{font-family:'Amiri',serif; font-size:1rem; color:var(--burgundy); text-align:center; padding:0 6px;}
.fan-blade .blade-star{position:absolute; top:8px; right:10px; color:var(--gold); font-size:1rem;}
.fan-pivot{position:absolute; left:50%; bottom:-14px; width:30px; height:30px; margin-left:-15px; background:var(--gold); border:3px solid var(--gold-dark); border-radius:50%;}

/* ============ SCREEN 4 : CARTE SOURATE ============ */
.sourate-head{text-align:center; padding:10px 0 18px;}
.sourate-head .nameAr{font-family:'Amiri Quran',serif; font-size:2rem; color:var(--burgundy);}
.sourate-head .nameTr{font-size:.85rem; color:#8a7a6b;}
.deck-zone{perspective:1400px; max-width:440px; margin:0 auto; padding:0 14px;}
.vcard{
  position:relative; width:100%; aspect-ratio:3/4; transform-style:preserve-3d; transition:transform .5s;
  touch-action:pan-y;
}
.vcard.flipped{transform:rotateY(180deg);}
.vcard-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius);
  border:1.5px solid rgba(200,164,98,.5); background:var(--white); overflow:hidden;
  box-shadow:0 10px 28px rgba(93,24,40,.14); display:flex; flex-direction:column;
}
.vcard-front .vimg{width:100%; height:46%; background-color:#f4ede1; transition:opacity .2s;}
.vcard-front .vimg.img-loading{opacity:.35;}
.vcard-front .vtext{flex:1; display:flex; align-items:center; justify-content:center; padding:16px; text-align:center;}
.vcard-front .vtext .ar{font-size:1.65rem; line-height:2.3; color:var(--burgundy);}
.vcard-front .vnum{position:absolute; top:10px; left:10px; background:var(--gold); color:var(--burgundy); font-weight:700; font-size:.8rem; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
[dir="rtl"] .vcard-front .vnum{left:auto; right:10px;}
.vcard-back{transform:rotateY(180deg); padding:16px; justify-content:flex-start; overflow-y:auto;}
.audio-row{display:flex; align-items:center; gap:10px; background:rgba(200,164,98,.1); border-radius:14px; padding:10px 12px; margin-bottom:12px;}
.audio-row button{width:40px; height:40px; border-radius:50%; border:none; background:var(--gold); color:var(--burgundy); font-size:1rem;}
.audio-row button:disabled{background:#e3ddd2; color:#aaa;}
.audio-label{font-size:.72rem; color:#8a7a6b; flex:1;}
.vcard-back .ar-small{font-family:'Amiri',serif; font-size:1.2rem; line-height:2; color:var(--burgundy); text-align:center; margin-bottom:10px;}
.hl{background:rgba(200,164,98,.35); border-radius:4px; padding:0 2px;}
.context-toggle{font-size:.78rem; color:var(--gold-dark); text-decoration:underline; background:none; border:none; padding:0; margin-top:4px;}
.context-box{font-size:.82rem; line-height:1.6; color:#555; margin-top:8px; display:none;}
.context-box.open{display:block;}
.deck-nav{display:flex; justify-content:space-between; align-items:center; max-width:440px; margin:14px auto 0; padding:0 4px;}
.nav-arrow{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--gold); background:var(--white); color:var(--burgundy); font-size:1.1rem;}
.deck-dots{font-size:.78rem; color:#8a7a6b;}
.flip-hint{text-align:center; font-size:.76rem; color:#aaa; margin-top:10px;}
.action-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:26px;}

/* ============ QUIZ ============ */
.quiz-progress{font-size:.78rem; color:#8a7a6b; text-align:center; margin-bottom:10px;}
.quiz-q{font-size:1.05rem; color:var(--burgundy); line-height:1.6; margin-bottom:16px; text-align:center;}
.quiz-q .ar{font-size:1.4rem;}
.quiz-opts{display:flex; flex-direction:column; gap:10px;}
.quiz-opt{
  border:1.5px solid rgba(200,164,98,.5); background:var(--white); border-radius:14px; padding:13px 16px;
  text-align:center; font-size:.92rem; color:var(--ink); min-height:44px;
}
.quiz-opt.correct{border-color:#2e7d46; background:rgba(46,125,70,.08); color:#2e7d46; font-weight:700;}
.quiz-opt.wrong{border-color:var(--burgundy); background:rgba(93,24,40,.06); color:var(--burgundy);}
.quiz-explain{font-size:.82rem; color:#555; background:rgba(200,164,98,.08); border-radius:12px; padding:12px; margin-top:14px; display:none;}
.quiz-explain.show{display:block;}
.quiz-score{text-align:center; padding:40px 0;}
.quiz-score .big{font-family:'Cinzel',serif; font-size:2.4rem; color:var(--burgundy);}
.star-big{font-size:2.6rem; color:var(--gold);}

/* ============ PRINT ============ */
@media print{
  .app-header,.lang-switch,.controls-row,.action-row,.deck-nav,.flip-hint,.no-print{display:none !important;}
  body{background:#fff;}
  .print-sheet{display:block !important; page-break-after:always;}
  .print-sheet .ar{color:#000 !important;}
  .print-img{filter:grayscale(1); max-width:100%;}
}
.print-sheet{display:none;}

@media (max-width:420px){
  .fan-blade{width:100px; height:200px; margin-left:-50px;}
  .hadith-ar{font-size:1.4rem;}
}
</style>
</head>
<body>

<header class="app-header">
  <button class="back-btn" id="btnBack" style="visibility:hidden">←</button>
  <div class="brand"><span class="brand-ar">دار الكلمة</span><span class="brand-en">DAR AL-KALIMAH</span></div>
  <div class="lang-switch" id="langSwitch">
    <button data-lang="fr" class="active">FR</button>
    <button data-lang="ar">AR</button>
    <button data-lang="es">ES</button>
  </div>
</header>

<!-- ======= SCREEN 1 : HADITH D'OUVERTURE ======= -->
<section class="screen active" id="screen-hadith">
  <div class="wrap">
    <div class="hadith-ar">خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ</div>
    <div class="hadith-tr" data-i18n="hadith1_tr"></div>
    <div class="hadith-ref" data-i18n="hadith1_ref"></div>
    <button class="btn-gold" id="btnStart" data-i18n="btn_commencer"></button>
  </div>
</section>

<!-- ======= SCREEN 2 : POURQUOI ======= -->
<section class="screen" id="screen-why">
  <div class="wrap">
    <h2 class="center" data-i18n="why_title"></h2>
    <p class="why-text" data-i18n="why_text"></p>
    <div class="why-icons">
      <div class="why-icon"><div class="ic">🎧</div><span data-i18n="why_ic1"></span></div>
      <div class="why-icon"><div class="ic">📖</div><span data-i18n="why_ic2"></span></div>
      <div class="why-icon"><div class="ic">⭐</div><span data-i18n="why_ic3"></span></div>
    </div>
    <div class="hadith-block-sm">
      <div class="hadith-ar">الْمَاهِرُ بِالْقُرْآنِ مَعَ السَّفَرَةِ الْكِرَامِ الْبَرَرَةِ، وَالَّذِي يَقْرَأُ الْقُرْآنَ وَيَتَتَعْتَعُ فِيهِ، وَهُوَ عَلَيْهِ شَاقٌّ، لَهُ أَجْرَانِ</div>
      <p class="hadith-tr" data-i18n="hadith2_tr"></p>
      <p class="hadith-ref" data-i18n="hadith2_ref"></p>
    </div>
    <div class="center" style="margin-top:24px;">
      <button class="btn-gold" id="btnWhyNext" data-i18n="btn_continuer"></button>
    </div>
  </div>
</section>

<!-- ======= SCREEN 3 : EVENTAIL ======= -->
<section class="screen" id="screen-fan">
  <div class="wrap">
    <div class="fan-top">
      <img class="boy-img" src="assets/hizb60/chatgpt/elements-accueil/garcon-accueil.png" alt="">
      <div class="fan-title">

    <div class="controls-row">
      <div class="riwaya-toggle" id="riwayaToggle">
        <button data-riwaya="warsh" class="active">Warsh</button>
        <button data-riwaya="hafs">Ḥafṣ</button>
      </div>
      <select class="reciter-select" id="reciterSelect" disabled>
        <option data-i18n-opt="reciter_soon1"></option>
        <option data-i18n-opt="reciter_soon2"></option>
      </select>
    </div>
    <p class="center ref-note" data-i18n="reciter_note"></p>

    <div class="fan-zone" id="fanZone"></div>

    <div class="center" style="margin-top:18px;">
      <button class="btn-outline btn-sm" id="btnPrintAll" data-i18n="btn_print_cahier"></button>
    </div>
  </div>
</section>

<!-- ======= SCREEN 4 : CARTE SOURATE ======= -->
<section class="screen" id="screen-card">
  <div class="wrap">
    <div class="sourate-head">
      <div class="nameAr" id="cardNameAr"></div>
      <div class="nameTr" id="cardNameTr"></div>
    </div>

    <div class="deck-zone">
      <div class="vcard" id="vcard">
        <div class="vcard-face vcard-front" id="vcardFront">
          <div class="vnum" id="vNum"></div>
          <div class="vimg" id="vImg"></div>
          <div class="vtext"><div class="ar" id="vArText"></div></div>
        </div>
        <div class="vcard-face vcard-back" id="vcardBack">
          <div class="audio-row">
            <button id="btnPlayVerse" title="écouter" disabled>▶</button>
            <span class="audio-label" data-i18n="audio_soon"></span>
          </div>
          <div class="ar-small" id="vArBack"></div>
          <button class="context-toggle" id="btnContext" data-i18n="btn_context"></button>
          <div class="context-box" id="contextBox"></div>
        </div>
      </div>
    </div>

    <div class="deck-nav">
      <button class="nav-arrow" id="btnPrev">‹</button>
      <span class="deck-dots" id="deckPos"></span>
      <button class="nav-arrow" id="btnNext">›</button>
    </div>
    <p class="flip-hint" data-i18n="flip_hint"></p>

    <div class="action-row">
      <button class="btn-outline btn-sm" id="btnPrintSourate" data-i18n="btn_print"></button>
      <button class="btn-outline btn-sm" id="btnPrintColor" data-i18n="btn_print_coloriages"></button>
      <button class="btn-burgundy btn-sm" id="btnGoQuiz" data-i18n="btn_quiz"></button>
    </div>
  </div>
</section>

<!-- ======= ECRAN QUIZ ======= -->
<section class="screen" id="screen-quiz">
  <div class="wrap">
    <h2 class="center" id="quizTitle"></h2>
    <div id="quizBody"></div>
  </div>
</section>

<!-- Printable area injected dynamically -->
<div id="printArea"></div>

let currentLang = lsGet('hizb60_lang','fr');

function applyI18n(){
  const dict = I18N[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(dict[k]!==undefined) el.textContent = dict[k];
  });
  document.querySelectorAll('[data-i18n-opt]').forEach(el=>{
    const k = el.getAttribute('data-i18n-opt');
    if(dict[k]!==undefined) el.textContent = dict[k];
  });
  document.getElementById('htmlRoot').lang = currentLang;
  document.getElementById('htmlRoot').dir = (currentLang==='ar') ? 'rtl' : 'ltr';
  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===currentLang);
  });
  renderFan(); renderQuizIfVisible();
}
document.getElementById('langSwitch').addEventListener('click', e=>{
  const b = e.target.closest('button[data-lang]'); if(!b) return;
  currentLang = b.dataset.lang; lsSet('hizb60_lang', currentLang); applyI18n();
});

function cropVars(s, caseIdx){
  const col = (caseIdx===null||caseIdx===undefined) ? 0 : caseIdx % s.cols;
  const row = (caseIdx===null||caseIdx===undefined) ? 0 : Math.floor(caseIdx / s.cols);
  const bx = s.cols>1 ? (col/(s.cols-1))*100 : 0;
  const by = s.rows>1 ? (row/(s.rows-1))*100 : 0;
  return {size:`${s.cols*100}% ${s.rows*100}%`, pos:`${bx}% ${by}%`};
}
/* Les petits serveurs locaux utilisés pour tester (téléphone/LAN) ne traitent souvent
   qu'une requête à la fois : plusieurs images demandées en même temps peuvent échouer
   ponctuellement (connexion refusée). On réessaie donc le chargement avant d'abandonner. */
function loadImageWithRetry(url, onReady, attempt){
  attempt = attempt||0;
  const probe = new Image();
  probe.onload = ()=> onReady(true);
  probe.onerror = ()=>{
    if(attempt < 6) setTimeout(()=> loadImageWithRetry(url, onReady, attempt+1), 250*(attempt+1));
    else onReady(false);
  };
  probe.src = url;
}
function imgCropStyle(s, caseIdx){
  const {size,pos} = cropVars(s, caseIdx);
  return `background-size:${size}; background-position:${pos};`;
}
function setVerseImage(el, s, caseIdx){
  const {size,pos} = cropVars(s, caseIdx);
  el.style.backgroundImage = 'none';
  el.classList.add('img-loading');
  loadImageWithRetry(s.img, (ok)=>{
    el.classList.remove('img-loading');
    if(ok){ el.style.backgroundImage = `url('${s.img}')`; el.style.backgroundSize = size; el.style.backgroundPosition = pos; }
  });
}

let quizState = null;
function wrapArabic(str){
  return str.replace(/[؀-ۿ][؀-ۿ\s]*[؀-ۿ]|[؀-ۿ]/g, m=>`<span class="ar">${m}</span>`);
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function openQuiz(slug){
  const s = SOURATES[slug];
  quizState = { slug, order: shuffle(s.quiz.map((_,i)=>i)), idx:0, score:0, answered:false };
  document.getElementById('quizTitle').textContent = s.nameTr;
  renderQuiz();
  showScreen('screen-quiz');
}
function renderQuizIfVisible(){
  if(document.getElementById('screen-quiz').classList.contains('active') && quizState) renderQuiz();
}
function renderQuiz(){
  const s = SOURATES[quizState.slug];
  const body = document.getElementById('quizBody');
  if(quizState.idx >= quizState.order.length){
    const pct = Math.round(100*quizState.score/quizState.order.length);
    const passed = pct>=50;
    if(passed) lsSet('hizb60_star_'+quizState.slug, true);
    body.innerHTML = `
      <div class="quiz-score">
        <div class="star-big">${passed?'★':'☆'}</div>
        <div class="big">${quizState.score} / ${quizState.order.length}</div>
        <p>${pct}%</p>
        <div class="action-row">
          <button class="btn-outline btn-sm" id="qRestart">${I18N[currentLang].quiz_restart}</button>
          <button class="btn-burgundy btn-sm" id="qBack">${I18N[currentLang].quiz_back}</button>
        </div>
      </div>`;
    document.getElementById('qRestart').addEventListener('click', ()=> openQuiz(quizState.slug));
    document.getElementById('qBack').addEventListener('click', ()=>{ renderFan(); showScreen('screen-fan'); });
    return;
  }
  const q = s.quiz[quizState.order[quizState.idx]];
  quizState.answered = false;
  body.innerHTML = `
    <p class="quiz-progress">${quizState.idx+1} / ${quizState.order.length}</p>
    <p class="quiz-q">${wrapArabic(q.q)}</p>
    <div class="quiz-opts">${q.opts.map((o,i)=>`<button class="quiz-opt" data-i="${i}">${o}</button>`).join('')}</div>
    <div class="quiz-explain" id="quizExplain"></div>
  `;
  body.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(quizState.answered) return;
      quizState.answered = true;
      const i = parseInt(btn.dataset.i);
      body.querySelectorAll('.quiz-opt').forEach((b2,i2)=>{
        if(i2===q.a) b2.classList.add('correct');
        else if(i2===i) b2.classList.add('wrong');
      });
      if(i===q.a) quizState.score++;
      const ex = document.getElementById('quizExplain');
      ex.textContent = (i===q.a ? I18N[currentLang].quiz_correct+' ' : I18N[currentLang].quiz_wrong+' ') + q.ex;
      ex.classList.add('show');
      setTimeout(()=>{ quizState.idx++; renderQuiz(); }, 1600);
    });
  });
}

function printSourate(slug, coloringOnly){
  const s = SOURATES[slug];
  const area = document.getElementById('printArea');
  const versesHafs = s.verses.hafs;
  let html = '';
  if(!coloringOnly){
    html += `<div class="print-sheet"><div class="wrap">
      <h2 class="ar" style="text-align:center;font-size:1.8rem;">${s.nameAr}</h2>
      <p style="text-align:center;">${s.nameTr}</p>
      ${versesHafs.map(v=>`<p class="ar" style="font-size:1.3rem;text-align:center;line-height:2.2;">${v.ar} <span style="font-size:.9rem;">﴿${v.n}﴾</span></p>`).join('')}
      <hr>
      <h3>${I18N['fr'].btn_context}</h3>
      <p style="font-size:.85rem;">${s.contextFr}</p>
      <p style="font-size:.7rem;color:#999;">— À propos de l'auteure : Houda, professeure d'arabe, fondatrice de Dar Al-Kalimah. (texte à compléter par Houda)</p>
    </div></div>`;
  }
  html += versesHafs.map(v=>{
    if(v.case===null||v.case===undefined) return '';
    const col = v.case % s.cols, row = Math.floor(v.case/s.cols);
    const bx = s.cols>1?(col/(s.cols-1))*100:0, by = s.rows>1?(row/(s.rows-1))*100:0;
    return `<div class="print-sheet"><div class="wrap">
      <p style="text-align:center;font-size:.8rem;">${s.nameTr} — verset ${v.n}</p>
      <div class="print-img" style="width:100%;aspect-ratio:1/1;background-image:url('${s.imgColor}');background-size:${s.cols*100}% ${s.rows*100}%;background-position:${bx}% ${by}%;border:1px solid #ccc;"></div>
    </div></div>`;
  }).join('');
  area.innerHTML = html;
  setTimeout(()=> window.print(), 100);
}
function printCahier(){
  const area = document.getElementById('printArea');
  let html = `<div class="print-sheet"><div class="wrap" style="text-align:center;padding-top:30vh;">
    <h1 class="ar" style="color:var(--gold);font-size:2rem;">دار الكلمة</h1>
    <h1 style="font-family:'Cinzel',serif;">Hizb 60 — Juz' ʿAmma</h1>
    <p>Cahier de coloriage et de lecture</p>
  </div></div>`;
  html += `<div class="print-sheet"><div class="wrap">
    <div class="hadith-ar ar">${'الْمَاهِرُ بِالْقُرْآنِ مَعَ السَّفَرَةِ الْكِرَامِ الْبَرَرَةِ، وَالَّذِي يَقْرَأُ الْقُرْآنَ وَيَتَتَعْتَعُ فِيهِ، وَهُوَ عَلَيْهِ شَاقٌّ، لَهُ أَجْرَانِ'}</div>
    <p style="text-align:center;">Ṣaḥīḥ Muslim, n° 798</p>
  </div></div>`;
  area.innerHTML = html;
  // fiches de chaque sourate du squelette
  FAN_ORDER.forEach(slug=>{
    printSourateInto(area, slug);
  });
  html += `<div class="print-sheet"><div class="wrap" style="padding-top:30vh;text-align:center;">
    <h3>À propos de l'auteure</h3>
    <p style="font-size:.85rem;color:#777;">(texte fourni par Houda — emplacement réservé)</p>
  </div></div>`;
  setTimeout(()=> window.print(), 150);
}
function printSourateInto(area, slug){
  const s = SOURATES[slug];
  const versesHafs = s.verses.hafs;
  const div = document.createElement('div');
  div.innerHTML = `<div class="print-sheet"><div class="wrap">
      <h2 class="ar" style="text-align:center;font-size:1.8rem;">${s.nameAr}</h2>
      ${versesHafs.map(v=>`<p class="ar" style="font-size:1.2rem;text-align:center;line-height:2.1;">${v.ar} <span style="font-size:.85rem;">﴿${v.n}﴾</span></p>`).join('')}
    </div></div>`;
  area.appendChild(div.firstElementChild);
}
