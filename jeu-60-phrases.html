<style>
:root{
  --bordeaux:#5D1828;
  --bordeaux-dark:#3a0f19;
  --gold:#C8A462;
  --gold-light:#dfc28b;
  --white:#FFFFFF;
  --ink:#2b1c1f;
  --radius-xl:28px;
  --radius-lg:22px;
  --radius-md:18px;
  --radius-sm:12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box;}

html,body{
  margin:0; padding:0; min-height:100%;
  background:#FFFFFF;
  font-family:'Montserrat', sans-serif;
  color:var(--ink);
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:-1;
  background:
    radial-gradient(circle at 12% 18%, rgba(200,164,98,0.13), transparent 26%),
    radial-gradient(circle at 88% 12%, rgba(93,24,40,0.08), transparent 28%),
    radial-gradient(circle at 50% 92%, rgba(200,164,98,0.10), transparent 34%);
}

.ar-text{
  font-family:'Amiri', serif;
  direction:rtl;
  unicode-bidi:isolate;
  font-feature-settings:"liga" 1, "calt" 1, "mark" 1, "mkmk" 1;
}

#app{
  max-width:640px;
  margin:0 auto;
  padding: calc(16px + var(--safe-top)) 20px calc(28px + var(--safe-bottom));
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:stretch;
}

.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.lang-toggle{
  display:inline-flex;
  border-radius:999px;
  background:rgba(93,24,40,0.06);
  border:1px solid rgba(200,164,98,0.32);
  overflow:hidden;
}
.lang-toggle button{
  border:none; background:transparent; cursor:pointer;
  padding:8px 14px;
  font-family:'Montserrat', sans-serif;
  font-weight:700;
  font-size:0.78rem;
  color:var(--bordeaux);
  transition:background .15s ease, color .15s ease;
}
.lang-toggle button.active{
  background:linear-gradient(135deg, var(--bordeaux), var(--bordeaux-dark));
  color:#fff;
}

.btn-house{
  width:44px; height:44px;
  border-radius:999px;
  background:rgba(93,24,40,0.06);
  border:1px solid rgba(200,164,98,0.32);
  backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center;
  color:var(--bordeaux);
  cursor:pointer;
  transition:transform .15s ease;
}
.btn-house:active{ transform:scale(0.92); }
.btn-house i{ font-size:1.05rem; color:var(--gold); }

.badge-type{
  display:none;
  align-items:center; gap:6px;
  background:rgba(200,164,98,0.14);
  border:1px solid rgba(200,164,98,0.4);
  color:var(--bordeaux);
  font-size:0.72rem;
  font-weight:700;
  padding:6px 14px;
  border-radius:999px;
  white-space:nowrap;
}
.badge-type.visible{ display:inline-flex; }
.badge-type i{ color:var(--gold); }

.view{ display:none; flex:1; flex-direction:column; align-items:center; text-align:center; }
.view.active{ display:flex; }

.app-title{
  font-family:'Cinzel', serif;
  color:var(--bordeaux);
  font-size:clamp(1.4rem, 5vw, 2rem);
  margin:0 0 8px;
}
.app-subtitle{
  color:#6b4b53;
  font-size:0.98rem;
  margin:0 0 24px;
  line-height:1.5;
}

.intro-container{
  width:100%;
  background:var(--white);
  border-radius:var(--radius-xl);
  padding:36px 26px;
  box-shadow:0 12px 40px rgba(93,24,40,0.10);
  border:1px solid rgba(200,164,98,0.20);
  position:relative;
}
.intro-container::before{
  content:""; position:absolute; inset:12px; border-radius:20px;
  border:1px solid rgba(200,164,98,0.18); pointer-events:none;
}

.intro-icon{
  width:78px; height:78px; margin:0 auto 18px;
  border-radius:999px;
  background:linear-gradient(145deg, var(--bordeaux), var(--bordeaux-dark));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 20px rgba(93,24,40,0.25);
}
.intro-icon i{ font-size:2rem; color:var(--gold); }
.intro-icon.success{ background:linear-gradient(145deg, var(--gold), var(--gold-light)); }
.intro-icon.success i{ color:var(--bordeaux); }
.intro-logo{
  font-family:'Cinzel', serif;
  font-weight:700;
  font-size:1.35rem;
  letter-spacing:0.06em;
  color:var(--gold);
}

.rules-list{
  list-style:none; padding:0; margin:0 0 26px;
}
.rules-list li{
  display:flex; align-items:flex-start; gap:12px;
  font-size:0.94rem; color:#4a3338;
  margin-bottom:12px; line-height:1.5;
  text-align:left;
}
.rules-list i{ color:var(--gold); margin-top:3px; min-width:18px; }
.rules-list .step-num{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:20px; height:20px; border-radius:999px;
  background:var(--bordeaux); color:#fff; font-size:0.72rem; font-weight:700;
  margin-top:1px; flex-shrink:0;
}

.btn-primary{
  border:none; cursor:pointer;
  border-radius:999px;
  background:linear-gradient(135deg, var(--bordeaux), var(--bordeaux-dark));
  color:#fff;
  font-family:'Montserrat', sans-serif;
  font-weight:700;
  font-size:1rem;
  padding:14px 30px;
  display:inline-flex; align-items:center; gap:10px;
  box-shadow:0 8px 20px rgba(93,24,40,0.25);
  transition:transform .15s ease, opacity .15s ease;
}
.btn-primary:active{ transform:scale(0.96); }
.btn-primary:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; }
.btn-primary i{ color:var(--gold-light); }

.progress-wrap{
  width:100%;
  display:flex; align-items:center; gap:10px;
  margin-bottom:18px;
}
.progress-bar{
  flex:1; height:10px; border-radius:999px;
  background:rgba(93,24,40,0.08);
  overflow:hidden;
}
.progress-bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--gold-light), var(--gold));
  border-radius:999px;
  transition:width .35s ease;
}
#progress-label{
  font-size:0.8rem; font-weight:700; color:var(--bordeaux); white-space:nowrap;
}

.quiz-container{
  width:100%;
  background:var(--white);
  border-radius:var(--radius-xl);
  padding:28px 22px;
  box-shadow:0 12px 40px rgba(93,24,40,0.10);
  border:1px solid rgba(200,164,98,0.20);
  position:relative;
}
.quiz-container::before{
  content:""; position:absolute; inset:14px; border-radius:20px;
  border:1px solid rgba(200,164,98,0.16); pointer-events:none;
}

.instruction-line{
  font-size:0.92rem; color:#6b4b53; margin:0 0 18px;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.instruction-line i{ color:var(--gold); }

.sentence-slots{
  direction:rtl;
  display:flex; flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  min-height:78px;
  padding:14px;
  margin-bottom:18px;
  border-radius:var(--radius-md);
  background:rgba(93,24,40,0.035);
  border:1px dashed rgba(200,164,98,0.5);
}

.slot{
  min-width:64px; height:58px;
  border-radius:var(--radius-sm);
  border:2px dashed rgba(93,24,40,0.22);
  background:rgba(255,255,255,0.6);
  display:flex; align-items:center; justify-content:center;
  transition:border-color .2s ease, background .2s ease, transform .12s ease;
}
.slot.filled{
  border-style:solid;
  border-color:rgba(200,164,98,0.55);
  background:#ffffff;
}
.slot.correct{
  border-color:#2e7d4f;
  background:rgba(46,125,79,0.08);
}
.slot.wrong{
  border-color:#b3352c;
  background:rgba(179,53,44,0.08);
  animation:shake .35s ease;
}
.slot.drag-over{
  border-color:var(--gold);
  background:rgba(200,164,98,0.12);
  transform:scale(1.05);
}

@keyframes shake{
  0%,100%{ transform:translateX(0); }
  25%{ transform:translateX(-4px); }
  75%{ transform:translateX(4px); }
}

.word-tile{
  font-size:clamp(1.15rem, 4.6vw, 1.55rem);
  font-family:'Amiri', serif;
  color:var(--bordeaux);
  background:#ffffff;
  border:2px solid var(--gold);
  border-radius:var(--radius-sm);
  padding:8px 16px;
  cursor:grab;
  user-select:none;
  touch-action:none;
  box-shadow:0 4px 10px rgba(93,24,40,0.10);
  transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  white-space:nowrap;
}
.word-tile:active{ cursor:grabbing; }
.word-tile.dragging{ opacity:0.35; }
.word-tile.floating{
  position:fixed;
  z-index:50;
  pointer-events:none;
  box-shadow:0 14px 30px rgba(93,24,40,0.30);
  transform:scale(1.08) rotate(-2deg);
}

.word-bank{
  direction:rtl;
  display:flex; flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  min-height:64px;
  padding:10px 4px 4px;
}

.feedback-msg{
  min-height:26px;
  font-weight:700;
  font-size:0.95rem;
  margin:14px 0 4px;
}
.feedback-msg.ok{ color:#2e7d4f; }
.feedback-msg.ko{ color:#b3352c; }

.choice-prompt{
  font-weight:700; color:var(--bordeaux); margin:0 0 14px; font-size:0.95rem;
}
.sentence-recap{
  font-size:clamp(1.3rem, 5.6vw, 1.8rem);
  color:var(--ink);
  margin:0 0 22px;
  line-height:2;
}
.blank-slot{
  display:inline-block;
  min-width:60px;
  height:1.1em;
  border-bottom:3px solid var(--gold);
  margin:0 6px;
  vertical-align:middle;
}

.choice-options{ display:flex; flex-direction:column; gap:12px; margin-bottom:8px; }
.option-card{
  background:#ffffff;
  border:2px solid rgba(93,24,40,0.15);
  border-radius:var(--radius-md);
  padding:14px 18px;
  font-size:0.98rem;
  text-align:left;
  cursor:pointer;
  transition:border-color .15s ease, background .15s ease, transform .12s ease;
}
.option-card.ar-text{ font-size:clamp(1.1rem, 4.6vw, 1.4rem); text-align:center; }
.option-card:active{ transform:scale(0.98); }
.option-card.correct{
  border-color:#2e7d4f; background:rgba(46,125,79,0.08); color:#1f5c3a; font-weight:700;
}
.option-card.wrong{
  border-color:#b3352c; background:rgba(179,53,44,0.08); animation:shake .35s ease;
}
.option-card.disabled{ pointer-events:none; opacity:0.55; }

/* Reveal panel (translations) */
.reveal-status{
  font-weight:700; color:#2e7d4f; font-size:1rem; margin:0 0 18px;
}
.reveal-subtitle{
  font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
  color:var(--gold); margin:0 0 10px; text-align:left;
}
.reveal-words{
  direction:rtl;
  display:flex; flex-wrap:wrap; gap:10px;
  justify-content:center;
  margin-bottom:22px;
}
.reveal-word-chip{
  background:#fffaf0;
  border:1px solid rgba(200,164,98,0.4);
  border-radius:var(--radius-sm);
  padding:8px 12px;
  min-width:64px;
}
.reveal-word-chip .ar{
  font-family:'Amiri', serif;
  font-size:1.15rem;
  color:var(--bordeaux);
  direction:rtl;
  display:block;
}
.reveal-word-chip .gloss{
  font-family:'Montserrat', sans-serif;
  font-size:0.68rem;
  color:#8a6a70;
  display:block;
  margin-top:3px;
  direction:ltr;
}
.reveal-sentence-box{
  background:rgba(200,164,98,0.08);
  border-left:3px solid var(--gold);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  margin-bottom:24px;
  text-align:left;
}
.reveal-sentence-box p{
  margin:0; font-size:1.02rem; color:var(--ink); font-style:italic;
}
.reveal-alt-box{
  background:rgba(93,24,40,0.04);
  border:1px dashed rgba(200,164,98,0.5);
  border-radius:var(--radius-sm);
  padding:12px 16px;
  margin:-10px 0 24px;
  text-align:center;
}
.reveal-alt-title{
  margin:0 0 6px; font-size:0.76rem; color:#6b4b53; font-weight:700;
}
.reveal-alt-sentence{
  margin:0; font-size:1.2rem; color:var(--bordeaux);
}

.end-score{
  font-size:1.15rem; color:var(--bordeaux); font-weight:700; margin:0 0 8px;
}
.end-detail{
  font-size:0.9rem; color:#6b4b53; margin:0 0 26px;
}

@media (max-width:768px){
  #app{ padding-left:16px; padding-right:16px; }
  .quiz-container, .intro-container{ padding:24px 16px; }
}
@media (max-width:480px){
  .slot{ min-width:52px; height:50px; }
  .word-tile{ padding:7px 12px; }
  .rules-list li{ font-size:0.88rem; }
  .badge-type span{ display:none; }
  .lang-toggle button{ padding:7px 10px; font-size:0.72rem; }
}
@media (max-width:360px){
  .app-title{ font-size:1.25rem; }
  .sentence-recap{ font-size:1.25rem; }
}
@media print{
  .btn-house, .btn-primary, .badge-type, .lang-toggle{ display:none !important; }
}
</style>

    <div class="intro-container">
      <div class="intro-icon"><span class="intro-logo">DAK</span></div>

    </div>

<script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const LEXIQUE = DATA.lexique;

const UI_TEXT = {
  fr: {

  },

    introTitle: "El gran juego de las frases",

    step2: "20 preguntas — Elige el verbo correcto: completa la frase con la palabra adecuada.",

    start: "Empezar",
    instructionOrdre: "Ordena las palabras correctamente:",

    choicePromptSens: "¿Qué significa esta frase?",
    choiceOk: "مُمْتَاز! ¡Exacto!",
    choiceKo: "No exactamente, inténtalo de nuevo.",
    revealWordTitle: "Palabra por palabra",
    revealSentenceTitle: "Traducción de la frase",
    continueBtn: "Continuar",
    endTitle: "مُمْتَاز! ¡Bravo!",
    endDetail: "¡Vuelve a jugar para un orden diferente dentro de cada etapa!",
    restart: "Jugar de nuevo (nueva partida)",
    home: "Volver al inicio",
    altOrderNote: "Otro orden posible, mismo significado (frase verbal o frase nominal):",
    scoreText: (x,n) => "Puntuación: " + x + " / " + n + " logradas a la primera",
    progressText: (i,n) => "Pregunta " + i + " / " + n,
    badge: { ordre:"Ordena las palabras", verbe:"Buen verbo", sens:"Adivina el significado" }
  }
};

function goHome(){ window.location.href = DATA.meta.homeHref; }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function glossOf(word){
  const g = LEXIQUE[word];
  if(!g) return word;
  return g[state.lang] || g.fr || word;
}

const AudioController = {
  player: new Audio(),
  init(){ this.player.preload = "none"; this.player.playsInline = true; this.player.volume = 1; },
  async playMain(src){
    if(!src) return;
    try{ this.player.pause(); this.player.currentTime = 0; this.player.src = src; this.player.load(); await this.player.play(); }catch(_){}
  }
};
AudioController.init();

function newGameQuestions(){
  const ordreBlock = shuffle(DATA.ordre).map(q => ({ type:'ordre', data:q }));
  const verbeBlock = shuffle(DATA.verbe).map(q => ({ type:'verbe', data:q }));
  const sensBlock  = shuffle(DATA.sens).map(q => ({ type:'sens', data:q }));
  return [...ordreBlock, ...verbeBlock, ...sensBlock];
}

const state = {
  lang: 'fr',
  questions: [],
  currentIndex: 0,
  perfectCount: 0,
  currentAttempted: false,
  isStarting: false,
  isChecking: false,
  hasFinished: false,
  choiceLocked: false,
  slots: [],
  bank: [],
  currentOptionPairs: null, // for 'sens' re-render on lang toggle
  currentReveal: null // { words, fr, es }
};

const views = {
  intro: document.getElementById('view-intro'),
  game: document.getElementById('view-game'),
  choice: document.getElementById('view-choice'),
  reveal: document.getElementById('view-reveal'),
  end: document.getElementById('view-end')
};

function switchView(name){
  Object.values(views).forEach(v=>v.classList.remove('active'));
  views[name].classList.add('active');
}

/* ---------- LANGUE FR/ES ---------- */

document.getElementById('lang-btn-fr').addEventListener('click', ()=>setLang('fr'));
document.getElementById('lang-btn-es').addEventListener('click', ()=>setLang('es'));

function setLang(lang){
  state.lang = lang;
  document.getElementById('lang-btn-fr').classList.toggle('active', lang==='fr');
  document.getElementById('lang-btn-es').classList.toggle('active', lang==='es');
  refreshUITexts();
}

function refreshUITexts(){
  const t = UI_TEXT[state.lang];

  document.getElementById('intro-title').textContent = t.introTitle;
  document.getElementById('intro-subtitle').textContent = t.introSubtitle;
  document.getElementById('step1-text').innerHTML = t.step1;
  document.getElementById('step2-text').innerHTML = t.step2;
  document.getElementById('step3-text').innerHTML = t.step3;
  document.getElementById('shuffle-text').textContent = t.shuffleNote;
  document.getElementById('btn-start').innerHTML = t.start + ' <i class="fa-solid fa-arrow-left"></i>';
  document.getElementById('btn-check').innerHTML = t.verify + ' <i class="fa-solid fa-check"></i>';
  document.getElementById('btn-continue').innerHTML = t.continueBtn + ' <i class="fa-solid fa-arrow-left"></i>';
  document.getElementById('btn-restart').innerHTML = t.restart + ' <i class="fa-solid fa-rotate-left"></i>';
  document.getElementById('btn-home').setAttribute('aria-label', t.home);
  document.getElementById('instruction-ordre-text').textContent = t.instructionOrdre;
  document.getElementById('reveal-word-title').textContent = t.revealWordTitle;
  document.getElementById('reveal-sentence-title').textContent = t.revealSentenceTitle;
  document.getElementById('end-title').textContent = t.endTitle;
  document.getElementById('end-detail').textContent = t.endDetail;

  if(state.questions.length && state.currentIndex < state.questions.length){
    const q = state.questions[state.currentIndex];
    updateBadge(q.type);
    updateProgress();
    if(q.type === 'verbe') document.getElementById('choice-prompt').textContent = t.choicePromptVerbe;
    if(q.type === 'sens'){
      document.getElementById('choice-prompt').textContent = t.choicePromptSens;
      if(state.currentOptionPairs && !state.choiceLocked){
        drawSensOptions(state.currentOptionPairs);
      }
    }
  }

  if(state.currentReveal){
    renderRevealTexts();
  }

  if(state.hasFinished){
    document.getElementById('end-score').textContent = t.scoreText(state.perfectCount, state.questions.length);
  }
}

/* ---------- DEMARRAGE ---------- */

document.getElementById('btn-start').addEventListener('click', ()=>{
  if(state.isStarting) return;
  state.isStarting = true;
  startNewGame();
});

document.getElementById('btn-restart').addEventListener('click', startNewGame);

function startNewGame(){
  state.questions = newGameQuestions();
  state.currentIndex = 0;
  state.perfectCount = 0;
  state.hasFinished = false;
  renderCurrentQuestion();
}

function updateProgress(){
  const total = state.questions.length;
  const pct = (state.currentIndex/total*100) + '%';
  const label = UI_TEXT[state.lang].progressText(state.currentIndex+1, total);
  document.getElementById('progress-fill').style.width = pct;
  document.getElementById('progress-label').textContent = label;
  document.getElementById('progress-fill-2').style.width = pct;
  document.getElementById('progress-label-2').textContent = label;
}

function updateBadge(type){
  const info = { ordre:'fa-arrow-right-arrow-left', verbe:'fa-pen', sens:'fa-lightbulb' }[type];
  const label = UI_TEXT[state.lang].badge[type];
  [['badge-type','badge-type-label'], ['badge-type-2','badge-type-label-2']].forEach(([boxId,labelId])=>{
    const box = document.getElementById(boxId);
    box.classList.add('visible');
    box.querySelector('i').className = 'fa-solid ' + info;
    document.getElementById(labelId).textContent = label;
  });
}

function renderCurrentQuestion(){
  if(state.currentIndex >= state.questions.length){
    endGame();
    return;
  }
  state.currentAttempted = false;
  state.currentReveal = null;
  state.currentOptionPairs = null;
  const q = state.questions[state.currentIndex];
  updateProgress();
  updateBadge(q.type);

  if(q.type === 'ordre'){
    switchView('game');
    renderOrder(q.data);
  }else if(q.type === 'verbe'){
    switchView('choice');
    renderVerbe(q.data);
  }else if(q.type === 'sens'){
    switchView('choice');
    renderSens(q.data);
  }
}

document.getElementById('btn-continue').addEventListener('click', ()=>{
  state.currentIndex += 1;
  renderCurrentQuestion();
});

/* ---------- TYPE: ORDRE ---------- */

const slotsEl = document.getElementById('sentence-slots');
const bankEl = document.getElementById('word-bank');
const checkBtn = document.getElementById('btn-check');
const orderFeedback = document.getElementById('order-feedback');

function renderOrder(sentence){
  orderFeedback.textContent = '';
  orderFeedback.className = 'feedback-msg';
  checkBtn.disabled = true;
  state.isChecking = false;

  state.slots = sentence.words.map(()=>null);
  state.bank = shuffle(sentence.words.map((w,i)=>({ id:'w'+i, text:w })));

  drawSlots();
  drawBank();
}

function drawSlots(){
  slotsEl.innerHTML = '';
  state.slots.forEach((word, i)=>{
    const slot = document.createElement('div');
    slot.className = 'slot' + (word ? ' filled' : '');
    slot.dataset.index = i;
    if(word) slot.appendChild(makeTile(word, 'slot', i));
    slotsEl.appendChild(slot);
  });
}

function drawBank(){
  bankEl.innerHTML = '';
  state.bank.forEach(item => bankEl.appendChild(makeTile(item, 'bank', null)));
}

function makeTile(item, origin, slotIndex){
  const tile = document.createElement('div');
  tile.className = 'word-tile ar-text';
  tile.textContent = item.text;
  tile.dataset.id = item.id;
  tile.dataset.origin = origin;
  if(slotIndex !== null) tile.dataset.slotIndex = slotIndex;
  attachDragHandlers(tile, item);
  return tile;
}

function firstEmptySlot(){ return state.slots.findIndex(s=>s===null); }

function placeInSlot(item, index){
  state.slots[index] = item;
  state.bank = state.bank.filter(b=>b.id !== item.id);
  drawSlots(); drawBank();
  checkBtn.disabled = firstEmptySlot() !== -1;
}

function returnToBank(item, fromIndex){
  state.slots[fromIndex] = null;
  state.bank.push(item);
  drawSlots(); drawBank();
  checkBtn.disabled = true;
}

function attachDragHandlers(tile, item){
  let startX, startY, moved, floating, pointerId;

  tile.addEventListener('pointerdown', (e)=>{
    if(state.isChecking) return;
    pointerId = e.pointerId;
    startX = e.clientX; startY = e.clientY;
    moved = false;
    tile.setPointerCapture(pointerId);
  });

  tile.addEventListener('pointermove', (e)=>{
    if(pointerId === undefined || e.pointerId !== pointerId) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(!moved && Math.hypot(dx,dy) > 8){
      moved = true;
      tile.classList.add('dragging');
      floating = tile.cloneNode(true);
      floating.classList.add('floating');
      floating.style.width = tile.offsetWidth + 'px';
      document.body.appendChild(floating);
    }
    if(moved && floating){
      floating.style.left = (e.clientX - floating.offsetWidth/2) + 'px';
      floating.style.top = (e.clientY - floating.offsetHeight/2) + 'px';
      document.querySelectorAll('.slot.drag-over').forEach(s=>s.classList.remove('drag-over'));
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const slotUnder = under ? under.closest('.slot') : null;
      if(slotUnder) slotUnder.classList.add('drag-over');
    }
  });

  tile.addEventListener('pointerup', (e)=>{
    if(pointerId === undefined || e.pointerId !== pointerId) return;
    document.querySelectorAll('.slot.drag-over').forEach(s=>s.classList.remove('drag-over'));
    tile.classList.remove('dragging');
    if(floating){ floating.remove(); floating = null; }

    const origin = tile.dataset.origin;
    const slotIndexAttr = tile.dataset.slotIndex;

    if(!moved){
      if(origin === 'bank'){
        const idx = firstEmptySlot();
        if(idx !== -1) placeInSlot(item, idx);
      }else{
        returnToBank(item, parseInt(slotIndexAttr,10));
      }
    }else{
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const slotUnder = under ? under.closest('.slot') : null;
      const bankUnder = under ? under.closest('#word-bank') : null;

      if(slotUnder){
        const targetIndex = parseInt(slotUnder.dataset.index,10);
        if(origin === 'bank'){
          if(state.slots[targetIndex] === null){
            placeInSlot(item, targetIndex);
          }else{
            const idx = firstEmptySlot();
            if(idx !== -1) placeInSlot(item, idx);
          }
        }else{
          const fromIndex = parseInt(slotIndexAttr,10);
          if(targetIndex !== fromIndex){
            const swapped = state.slots[targetIndex];
            state.slots[targetIndex] = item;
            state.slots[fromIndex] = swapped;
            drawSlots(); drawBank();
            checkBtn.disabled = firstEmptySlot() !== -1;
          }
        }
      }else if(bankUnder && origin === 'slot'){
        returnToBank(item, parseInt(slotIndexAttr,10));
      }
    }
    pointerId = undefined;
  });
}

function arraysEqual(a, b){
  return a.length === b.length && a.every((w,i)=>w===b[i]);
}

checkBtn.addEventListener('click', ()=>{
  if(state.isChecking) return;
  const t = UI_TEXT[state.lang];
  const sentence = state.questions[state.currentIndex].data;
  const currentOrder = state.slots.map(s=>s.text);
  const validOrders = [sentence.words];
  if(sentence.words2) validOrders.push(sentence.words2);

  const matchedOrder = validOrders.find(order => arraysEqual(order, currentOrder));
  const allCorrect = !!matchedOrder;

  // Pour le surlignage, on compare a l'ordre valide le plus proche (le plus de cases correctes)
  let bestOrder = validOrders[0], bestScore = -1;
  validOrders.forEach(order=>{
    let score = 0;
    order.forEach((w,i)=>{ if(currentOrder[i]===w) score++; });
    if(score > bestScore){ bestScore = score; bestOrder = order; }
  });
  const referenceOrder = matchedOrder || bestOrder;

  document.querySelectorAll('.slot').forEach((slotEl, i)=>{
    slotEl.classList.remove('correct','wrong');
    if(currentOrder[i] === referenceOrder[i]){
      slotEl.classList.add('correct');
    }else{
      slotEl.classList.add('wrong');
    }
  });

  if(allCorrect){
    orderFeedback.textContent = t.orderOk;
    orderFeedback.classList.add('ok');
    state.isChecking = true;
    checkBtn.disabled = true;
    if(!state.currentAttempted) state.perfectCount += 1;
    const altOrder = sentence.words2
      ? (arraysEqual(matchedOrder, sentence.words) ? sentence.words2 : sentence.words)
      : null;
    setTimeout(()=> showReveal(sentence.words, sentence.fr, sentence.es, altOrder), 700);
  }else{
    state.currentAttempted = true;
    orderFeedback.textContent = t.orderKo;
    orderFeedback.classList.add('ko');
  }
});

/* ---------- TYPE: VERBE / SENS (choix multiple) ---------- */

const choicePrompt = document.getElementById('choice-prompt');
const choiceRecap = document.getElementById('choice-recap');
const choiceOptionsEl = document.getElementById('choice-options');
const choiceFeedback = document.getElementById('choice-feedback');

function renderVerbe(item){
  const t = UI_TEXT[state.lang];
  choicePrompt.textContent = t.choicePromptVerbe;
  choiceRecap.innerHTML = '';
  if(item.before.length){
    choiceRecap.appendChild(document.createTextNode(item.before.join(' ') + ' '));
  }
  const blank = document.createElement('span');
  blank.className = 'blank-slot';
  choiceRecap.appendChild(blank);
  choiceRecap.appendChild(document.createTextNode(' ' + item.after.join(' ') + '.'));

  choiceFeedback.textContent = '';
  choiceFeedback.className = 'feedback-msg';
  state.choiceLocked = false;

  const options = shuffle([item.correct, ...item.wrongs]);
  choiceOptionsEl.innerHTML = '';
  options.forEach(text=>{
    const card = document.createElement('div');
    card.className = 'option-card ar-text';
    card.textContent = text;
    card.addEventListener('click', ()=>{
      if(state.choiceLocked) return;
      if(text === item.correct){
        state.choiceLocked = true;
        card.classList.add('correct');
        choiceFeedback.textContent = UI_TEXT[state.lang].choiceOk;
        choiceFeedback.classList.add('ok');
        document.querySelectorAll('#choice-options .option-card').forEach(c=>c.classList.add('disabled'));
        if(!state.currentAttempted) state.perfectCount += 1;
        const fullWords = [...item.before, item.correct, ...item.after];
        setTimeout(()=> showReveal(fullWords, item.fr, item.es, null), 700);
      }else{
        state.currentAttempted = true;
        card.classList.add('wrong');
        choiceFeedback.textContent = UI_TEXT[state.lang].choiceKo;
        choiceFeedback.classList.add('ko');
        setTimeout(()=>card.classList.remove('wrong'), 500);
      }
    });
    choiceOptionsEl.appendChild(card);
  });
}

function tokenizeAr(ar){
  return ar.replace(/[.]+$/,'').trim().split(' ').filter(Boolean);
}

function renderSens(item){
  const t = UI_TEXT[state.lang];
  choicePrompt.textContent = t.choicePromptSens;
  choiceRecap.textContent = item.ar;

  choiceFeedback.textContent = '';
  choiceFeedback.className = 'feedback-msg';
  state.choiceLocked = false;

  const pairs = shuffle([
    { fr:item.correct, es:item.correctEs, correct:true },
    { fr:item.wrongs[0], es:item.wrongsEs[0], correct:false },
    { fr:item.wrongs[1], es:item.wrongsEs[1], correct:false }
  ]);
  state.currentOptionPairs = pairs;
  drawSensOptions(pairs, item);
}

function drawSensOptions(pairs, item){
  const currentItem = item || state.questions[state.currentIndex].data;
  choiceOptionsEl.innerHTML = '';
  pairs.forEach(pair=>{
    const card = document.createElement('div');
    card.className = 'option-card';
    card.textContent = pair[state.lang];
    card.addEventListener('click', ()=>{
      if(state.choiceLocked) return;
      if(pair.correct){
        state.choiceLocked = true;
        card.classList.add('correct');
        choiceFeedback.textContent = UI_TEXT[state.lang].choiceOk;
        choiceFeedback.classList.add('ok');
        document.querySelectorAll('#choice-options .option-card').forEach(c=>c.classList.add('disabled'));
        if(!state.currentAttempted) state.perfectCount += 1;
        const fullWords = tokenizeAr(currentItem.ar);
        setTimeout(()=> showReveal(fullWords, currentItem.correct, currentItem.correctEs, null), 700);
      }else{
        state.currentAttempted = true;
        card.classList.add('wrong');
        choiceFeedback.textContent = UI_TEXT[state.lang].choiceKo;
        choiceFeedback.classList.add('ko');
        setTimeout(()=>card.classList.remove('wrong'), 500);
      }
    });
    choiceOptionsEl.appendChild(card);
  });
}

/* ---------- REVEAL (traduction mot a mot + phrase) ---------- */

function showReveal(words, fr, es, altOrder){
  state.currentReveal = { words, fr, es, altOrder };
  switchView('reveal');
  renderRevealTexts();
}

function renderRevealTexts(){
  const t = UI_TEXT[state.lang];
  document.getElementById('reveal-status').textContent = t.choiceOk;
  document.getElementById('reveal-word-title').textContent = t.revealWordTitle;
  document.getElementById('reveal-sentence-title').textContent = t.revealSentenceTitle;
  document.getElementById('btn-continue').innerHTML = t.continueBtn + ' <i class="fa-solid fa-arrow-left"></i>';

  const wordsEl = document.getElementById('reveal-words');
  wordsEl.innerHTML = '';
  state.currentReveal.words.forEach(w=>{
    const chip = document.createElement('div');
    chip.className = 'reveal-word-chip';
    const ar = document.createElement('span');
    ar.className = 'ar';
    ar.textContent = w;
    const gloss = document.createElement('span');
    gloss.className = 'gloss';
    gloss.textContent = glossOf(w);
    chip.appendChild(ar);
    chip.appendChild(gloss);
    wordsEl.appendChild(chip);
  });

  document.getElementById('reveal-sentence').textContent =
    state.lang === 'es' ? state.currentReveal.es : state.currentReveal.fr;

  const altBox = document.getElementById('reveal-alt-box');
  if(state.currentReveal.altOrder){
    altBox.style.display = 'block';
    document.getElementById('reveal-alt-title').textContent = t.altOrderNote;
    document.getElementById('reveal-alt-sentence').textContent = state.currentReveal.altOrder.join(' ');
  }else{
    altBox.style.display = 'none';
  }
}

/* ---------- FIN DE PARTIE ---------- */

function endGame(){
  if(state.hasFinished) return;
  state.hasFinished = true;
  switchView('end');
  const t = UI_TEXT[state.lang];
  const total = state.questions.length;
  document.getElementById('end-score').textContent = t.scoreText(state.perfectCount, total);
  document.getElementById('end-detail').textContent = t.endDetail;

  const end = Date.now() + 2500;
  (function frame(){
    if(typeof confetti === 'function'){
      confetti({ particleCount:5, angle:60, spread:55, origin:{x:0}, colors:['#C8A462','#5D1828','#dfc28b'] });
      confetti({ particleCount:5, angle:120, spread:55, origin:{x:1}, colors:['#C8A462','#5D1828','#dfc28b'] });
    }
    if(Date.now() < end) requestAnimationFrame(frame);
  })();

  AudioController.playMain(DATA.meta.successAudio);
}

/* ---------- INIT ---------- */
setLang('fr');
</script>
