    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Variables, en-tête et cartes de module : mêmes que la page des modules de DAK Arabe (modules.html) */
        :root {
            --burgundy: #5D1828;
            --burgundy-dark: #3a0f19;
            --gold: #C8A462;
            --gold-light: #dfc28b;
            --white: #FFFFFF;
            --bg-beige: #FAF6F0;
            --text-dark: #2C3E50;
            --text-muted: #888888;
            --shadow-card: 0 4px 15px rgba(93, 24, 40, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-beige);
            font-family: 'Montserrat', sans-serif;
            padding: 40px 20px; color: var(--text-dark);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            visibility: hidden;
        }

        .ar-text { font-family: "Amiri", serif; direction: rtl; }
        .serif-text { font-family: "Cinzel", "Georgia", serif; text-align: center; }

        /* =========================================
           EN-TÊTE
           ========================================= */
        .header-container {
            background: var(--burgundy);
            padding: 40px 30px; border-radius: 12px;
            box-shadow: 0 8px 25px rgba(93, 24, 40, 0.25);
            width: 100%; max-width: 900px; margin-bottom: 50px; text-align: center;
            position: relative;
        }
        .brand-ar { font-size: 3.5rem; font-weight: 700; color: var(--gold); margin-bottom: 5px; line-height: 1.1; }
        .app-title { font-size: 1.4rem; color: #d09470; letter-spacing: 5px; text-transform: uppercase; font-weight: 600; }
        .divider { width: 60px; height: 2px; background-color: var(--gold); margin: 20px auto; border-radius: 2px; opacity: 0.5; }
        .subtitle { font-size: 1.1rem; color: var(--white); font-weight: 500; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle-es { font-size: 0.95rem; color: var(--gold-light); opacity: 0.9; letter-spacing: 1px; }

        .btn-back-home {
            position: absolute; top: 20px; right: 20px;
            color: var(--gold); text-decoration: none; font-size: 1.5rem;
            transition: all 0.3s;
        }
        .btn-back-home:hover { color: var(--gold); transform: scale(1.1); }

        /* Bouton FR / ES (visible sur toutes les pages du parcours) */
        .lang-switch { position: absolute; top: 20px; left: 20px; display: inline-flex; gap: 6px; }
        .lang-switch button {
            font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px;
            padding: 7px 16px; border-radius: 999px; border: 1.5px solid var(--gold);
            background: transparent; color: var(--gold); cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .lang-switch button.on { background: var(--gold); color: var(--burgundy); }
        .lang-switch button:hover { background: var(--gold); color: var(--burgundy); }
        .lang-switch button:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 2px; }

        /* =========================================
           LES TROIS PARTIES
           ========================================= */
        .parcours { width: 100%; max-width: 800px; }

        .partie { margin-bottom: 50px; }
        .partie-head { text-align: center; margin-bottom: 22px; }
        .partie-kicker { font-family: "Cinzel", "Georgia", serif; font-size: 0.85rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
        .partie-title { font-family: "Cinzel", "Georgia", serif; font-size: 1.7rem; font-weight: 700; color: var(--burgundy); line-height: 1.25; margin-bottom: 6px; }
        .partie-range { font-size: 0.9rem; color: var(--text-muted); font-style: italic; }
        .partie-head .divider { margin: 16px auto 0; }

        /* =========================================
           LISTE DES MODULES (cartes : même style que modules.html, non cliquables pour l'instant)
           ========================================= */
        .modules-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; }

        .modules-grid { gap: 12px; }

        /* Carte horizontale compacte : grande image à gauche (≈ 38 %), textes à droite */
        .module-card {
            background: var(--white);
            border: 1px solid rgba(200, 164, 98, 0.3); border-radius: 14px; overflow: hidden;
            display: flex; align-items: stretch; min-height: 140px;
            box-shadow: var(--shadow-card);
        }
        a.module-card { text-decoration: none; color: inherit; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; }
        a.module-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(93, 24, 40, 0.12); border-color: var(--gold); }

        .mod-media {
            position: relative; flex: 0 0 38%; background: linear-gradient(135deg, #f7ecd8, #e6cf9f); overflow: hidden;
        }
        .mod-media img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: var(--pos, center);
            /* aucune retouche CSS : la lumière naturelle est réglée dans les fichiers image eux-mêmes */
            transition: transform 0.5s ease;
        }
        a.module-card:hover .mod-media img { transform: scale(1.05); }
        /* Module sans photo pour l'instant : emplacement doré, même taille */
        .mod-media.vide { display: flex; align-items: center; justify-content: center; }
        .mod-media.vide span { font-family: "Cinzel", "Georgia", serif; font-size: 2.6rem; font-weight: 700; color: rgba(93, 24, 40, 0.28); }

        .module-info { flex: 1; min-width: 0; padding: 16px 22px; display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .mod-number { font-size: 0.78rem; color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .mod-title { font-size: 1.08rem; font-weight: 700; color: var(--burgundy); margin-bottom: 4px; line-height: 1.35; overflow-wrap: break-word; }
        .mod-sub { font-size: 0.86rem; color: var(--text-muted); line-height: 1.5; overflow-wrap: break-word; }

        .mod-status {
            align-self: flex-end; margin-top: 10px; font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
            color: var(--gold); border: 1.5px dashed rgba(200, 164, 98, 0.55); border-radius: 999px; padding: 5px 13px; white-space: nowrap;
        }

        .page-footer { width: 100%; text-align: center; margin-top: 10px; }
        .page-footer a {
            color: var(--text-muted); font-size: 0.78rem; text-decoration: none;
            border-bottom: 1px dotted rgba(93,24,40,0.25); padding-bottom: 2px;
        }
        .page-footer a:hover { color: var(--burgundy); }

        @media (max-width: 768px) {
            .header-container { padding: 70px 20px 30px; margin-bottom: 30px; }
            .brand-ar { font-size: 3rem; }
            .partie { margin-bottom: 40px; }
            .partie-title { font-size: 1.4rem; }
            /* Mobile et tablette : l'image reste à gauche et bien visible, les textes à droite */
            .module-card { min-height: 130px; }
            .mod-media { flex-basis: 37%; }
            .module-info { padding: 12px 14px; }
            .mod-title { font-size: 1rem; }
            .mod-sub { font-size: 0.8rem; }
            .mod-number { font-size: 0.72rem; }
            .mod-status { font-size: 0.64rem; padding: 4px 10px; margin-top: 8px; }
        }
        @media (max-width: 400px) {
            .mod-media { flex-basis: 35%; }
            .module-info { padding: 10px 12px; }
            .mod-title { font-size: 0.95rem; }
            .mod-sub { font-size: 0.78rem; }
        }
    </style>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('app-data').textContent);
  // Même clé de langue pour toutes les pages du parcours DAK Darija : la préférence est mémorisée.
  var LS_LANG = 'dak_darija_lang';
  var lang = 'fr';
  try { var saved = localStorage.getItem(LS_LANG); if (saved === 'fr' || saved === 'es') lang = saved; } catch (_) {}

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render(){
    document.documentElement.lang = lang;
    document.title = DATA.ui.pageTitle[lang];
    document.getElementById('tagline').textContent = DATA.tagline[lang];
    var priv = document.getElementById('privacy-link');
    priv.textContent = DATA.ui.privacy[lang];
    document.querySelectorAll('.lang-switch button').forEach(function(b){
      b.classList.toggle('on', b.dataset.lang === lang);
    });

    var root = document.getElementById('parcours');
    root.innerHTML = '';
    DATA.parties.forEach(function(p){
      var sec = el('section', 'partie');
      var head = el('div', 'partie-head');
      head.appendChild(el('div', 'partie-kicker', DATA.ui.partie[lang] + ' ' + p.id));
      head.appendChild(el('h2', 'partie-title', p.title[lang]));
      head.appendChild(el('div', 'partie-range', p.range[lang]));
      head.appendChild(el('div', 'divider'));
      sec.appendChild(head);

      var grid = el('div', 'modules-grid');
      p.modules.forEach(function(m){
        // Carte cliquable (<a>) seulement quand le module est accessible ; pour l'instant aucun ne l'est.
        var card = el(m.href ? 'a' : 'div', 'module-card');
        if (m.href) card.href = m.href;

        // Image à gauche (~38 %) : une image par module, jamais partagée
        var media = el('div', 'mod-media');
        var im = DATA.images && DATA.images[m.n];
        if (im) {
          var img = document.createElement('img');
          img.src = im.src; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
          if (im.pos) media.style.setProperty('--pos', im.pos);
          media.appendChild(img);
        } else {
          media.classList.add('vide');
          media.appendChild(el('span', null, String(m.n)));
        }
        card.appendChild(media);

        var info = el('div', 'module-info');
        info.appendChild(el('div', 'mod-number', DATA.ui.module[lang] + ' ' + m.n));
        info.appendChild(el('div', 'mod-title', m.title[lang]));
        info.appendChild(el('div', 'mod-sub', m.sub[lang]));
        if (!m.href) info.appendChild(el('div', 'mod-status', DATA.ui.bientot[lang]));
        card.appendChild(info);
        grid.appendChild(card);
      });
      sec.appendChild(grid);
      root.appendChild(sec);
    });
  }

  document.querySelectorAll('.lang-switch button').forEach(function(b){
    b.addEventListener('click', function(){
      lang = b.dataset.lang;
      try { localStorage.setItem(LS_LANG, lang); } catch (_) {}
      render();
    });
  });
  render();
})();
</script>

  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch((err) => console.error('SW registration failed:', err));
  let dakSwRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (dakSwRefreshing) return;
    dakSwRefreshing = true;
    window.location.reload();
  });
}
</script>
