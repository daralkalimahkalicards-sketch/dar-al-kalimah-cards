    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Variables, en-tête et cartes de module : mêmes que la page des modules de DAK Arabe (modules.html) */
        :root {
            --burgundy: #5D1828;
            --burgundy-dark: #3a0f19;
            --gold: #C8A462;
            --gold-light: #dfc28b;
            --white: #FFFFFF;
            --bg-beige: #FAF6F0;
            --text-dark: #2C3E50;
            --text-muted: #888888;
            --shadow-card: 0 4px 15px rgba(93, 24, 40, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-beige);
            font-family: 'Montserrat', sans-serif;
            padding: 40px 20px; color: var(--text-dark);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            visibility: hidden;
        }

        .ar-text { font-family: "Amiri", serif; direction: rtl; }
        .serif-text { font-family: "Cinzel", "Georgia", serif; text-align: center; }

        /* =========================================
           EN-TÊTE
           ========================================= */
        .header-container {
            background: var(--burgundy);
            padding: 40px 30px; border-radius: 12px;
            box-shadow: 0 8px 25px rgba(93, 24, 40, 0.25);
            width: 100%; max-width: 900px; margin-bottom: 50px; text-align: center;
            position: relative;
        }
        .brand-ar { font-size: 3.5rem; font-weight: 700; color: var(--gold); margin-bottom: 5px; line-height: 1.1; }
        .app-title { font-size: 1.4rem; color: #d09470; letter-spacing: 5px; text-transform: uppercase; font-weight: 600; }
        .divider { width: 60px; height: 2px; background-color: var(--gold); margin: 20px auto; border-radius: 2px; opacity: 0.5; }
        .subtitle { font-size: 1.1rem; color: var(--white); font-weight: 500; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle-es { font-size: 0.95rem; color: var(--gold-light); opacity: 0.9; letter-spacing: 1px; }

        .btn-back-home {
            position: absolute; top: 20px; right: 20px;
            color: var(--gold); text-decoration: none; font-size: 1.5rem;
            transition: all 0.3s;
        }
        .btn-back-home:hover { color: var(--gold); transform: scale(1.1); }

        /* Bouton FR / ES (visible sur toutes les pages du parcours) */
        .lang-switch { position: absolute; top: 20px; left: 20px; display: inline-flex; gap: 6px; }
        .lang-switch button {
            font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px;
            padding: 7px 16px; border-radius: 999px; border: 1.5px solid var(--gold);
            background: transparent; color: var(--gold); cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .lang-switch button.on { background: var(--gold); color: var(--burgundy); }
        .lang-switch button:hover { background: var(--gold); color: var(--burgundy); }
        .lang-switch button:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 2px; }

        /* =========================================
           LES TROIS PARTIES
           ========================================= */
        .parcours { width: 100%; max-width: 800px; }

        .partie { margin-bottom: 50px; }
        .partie-head { text-align: center; margin-bottom: 22px; }
        .partie-kicker { font-family: "Cinzel", "Georgia", serif; font-size: 0.85rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
        .partie-title { font-family: "Cinzel", "Georgia", serif; font-size: 1.7rem; font-weight: 700; color: var(--burgundy); line-height: 1.25; margin-bottom: 6px; }
        .partie-range { font-size: 0.9rem; color: var(--text-muted); font-style: italic; }
        .partie-head .divider { margin: 16px auto 0; }

        /* =========================================
           LISTE DES MODULES (cartes : même style que modules.html, non cliquables pour l'instant)
           ========================================= */
        .modules-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; }

        .modules-grid { gap: 12px; }

        /* Carte horizontale compacte : grande image à gauche (≈ 38 %), textes à droite */
        .module-card {
            background: var(--white);
            border: 1px solid rgba(200, 164, 98, 0.3); border-radius: 14px; overflow: hidden;
            display: flex; align-items: stretch; min-height: 140px;
            box-shadow: var(--shadow-card);
        }
        a.module-card { text-decoration: none; color: inherit; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; }
        a.module-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(93, 24, 40, 0.12); border-color: var(--gold); }

        .mod-media {
            position: relative; flex: 0 0 38%; background: linear-gradient(135deg, #f7ecd8, #e6cf9f); overflow: hidden;
        }
        .mod-media img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: var(--pos, center);
            /* aucune retouche CSS : la lumière naturelle est réglée dans les fichiers image eux-mêmes */
            transition: transform 0.5s ease;
        }
        a.module-card:hover .mod-media img { transform: scale(1.05); }
        /* Module sans photo pour l'instant : emplacement doré, même taille */
        .mod-media.vide { display: flex; align-items: center; justify-content: center; }
        .mod-media.vide span { font-family: "Cinzel", "Georgia", serif; font-size: 2.6rem; font-weight: 700; color: rgba(93, 24, 40, 0.28); }

        .module-info { flex: 1; min-width: 0; padding: 16px 22px; display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .mod-number { font-size: 0.78rem; color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .mod-title { font-size: 1.08rem; font-weight: 700; color: var(--burgundy); margin-bottom: 4px; line-height: 1.35; overflow-wrap: break-word; }
        .mod-sub { font-size: 0.86rem; color: var(--text-muted); line-height: 1.5; overflow-wrap: break-word; }

        .mod-status {
            align-self: flex-end; margin-top: 10px; font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
            color: var(--gold); border: 1.5px dashed rgba(200, 164, 98, 0.55); border-radius: 999px; padding: 5px 13px; white-space: nowrap;
        }

        /* Etats des cartes : en cours, termine, verrouille */
        .mod-status.etat { border-style: solid; display: inline-flex; align-items: center; gap: 7px; white-space: normal; text-align: right; line-height: 1.35; }
        .mod-status.etat i { color: var(--gold); }
        .mod-status.fait { background: var(--burgundy); color: var(--gold); border-color: var(--burgundy); }
        .module-card.locked { box-shadow: none; background: #FBF8F3; }
        .module-card.locked .mod-media img { filter: grayscale(1); opacity: 0.45; }
        .module-card.locked .mod-title, .module-card.locked .mod-sub, .module-card.locked .mod-number { opacity: 0.55; }
        .partie-note { font-size: 0.85rem; color: var(--burgundy); margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; }
        .partie-note i { color: var(--gold); }

        /* Carte d'examen de fin de partie */
        .exam-card { border: 1.5px solid var(--gold); border-radius: 14px; background: var(--burgundy); color: var(--white); padding: 22px; text-align: center; margin-top: 4px; }
        .exam-card.locked { background: #FBF8F3; color: var(--burgundy); border-style: dashed; }
        .exam-kicker { font-family: "Cinzel", "Georgia", serif; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); display: inline-flex; align-items: center; gap: 9px; }
        .exam-title { font-family: "Cinzel", "Georgia", serif; font-size: 1.15rem; font-weight: 700; margin: 8px 0 6px; }
        .exam-sub { font-size: 0.86rem; line-height: 1.5; }
        .exam-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
        .exam-btn { display: inline-block; text-decoration: none; font-family: 'Montserrat', sans-serif; font-size: 0.78rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border-radius: 50px; padding: 11px 20px; background: var(--gold); color: var(--burgundy); border: 1px solid var(--gold); }
        .exam-btn.ghost { background: transparent; color: var(--gold); }
        .exam-btn:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }

        /* Liens de l'eleve (progression) et de la prof (suivi) sous l'en-tete */
        .space-links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; margin: -26px 0 34px; }
        .space-links a { text-decoration: none; font-size: 0.78rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--burgundy); border: 1px solid var(--gold); border-radius: 50px; padding: 10px 18px; background: var(--white); display: inline-flex; align-items: center; gap: 8px; }
        .space-links a i { color: var(--gold); }
        .space-links a:hover { background: var(--bg-beige); }

        .page-footer { width: 100%; text-align: center; margin-top: 10px; }
        .page-footer a {
            color: var(--text-muted); font-size: 0.78rem; text-decoration: none;
            border-bottom: 1px dotted rgba(93,24,40,0.25); padding-bottom: 2px;
        }
        .page-footer a:hover { color: var(--burgundy); }

        @media (max-width: 768px) {
            .header-container { padding: 70px 20px 30px; margin-bottom: 30px; }
            .brand-ar { font-size: 3rem; }
            .partie { margin-bottom: 40px; }
            .partie-title { font-size: 1.4rem; }
            /* Mobile et tablette : l'image reste à gauche et bien visible, les textes à droite */
            .module-card { min-height: 130px; }
            .mod-media { flex-basis: 37%; }
            .module-info { padding: 12px 14px; }
            .mod-title { font-size: 1rem; }
            .mod-sub { font-size: 0.8rem; }
            .mod-number { font-size: 0.72rem; }
            .mod-status { font-size: 0.64rem; padding: 4px 10px; margin-top: 8px; }
        }
        @media (max-width: 400px) {
            .mod-media { flex-basis: 35%; }
            .module-info { padding: 10px 12px; }
            .mod-title { font-size: 0.95rem; }
            .mod-sub { font-size: 0.78rem; }
        }
    </style>

        { "n": 23, "title": { "fr": "Imprévus, problèmes et conversations spontanées", "es": "Imprevistos, problemas y conversaciones espontáneas" }, "sub": { "fr": "Savoir réagir quand tout ne se passe pas comme prévu.", "es": "Saber reaccionar cuando nada sale como estaba previsto." } },

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('app-data').textContent);
  // Même clé de langue pour toutes les pages du parcours DAK Darija : la préférence est mémorisée.
  var LS_LANG = 'dak_darija_lang';
  var lang = 'fr';
  try { var saved = localStorage.getItem('dak-lang') || localStorage.getItem(LS_LANG); if (saved === 'fr' || saved === 'es') lang = saved; } catch (_) {}

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render(){
    document.documentElement.lang = lang;
    document.title = DATA.ui.pageTitle[lang];
    document.getElementById('tagline').textContent = DATA.tagline[lang];
    var priv = document.getElementById('privacy-link');
    priv.textContent = DATA.ui.privacy[lang];
    document.querySelectorAll('.lang-switch button').forEach(function(b){
      b.classList.toggle('on', b.dataset.lang === lang);
    });

    var liens = document.getElementById('space-links');
    liens.innerHTML = '';
    if (window.DAK_STATUT) {
      var mk = function(href, icone, texte){
        var a = document.createElement('a'); a.href = href;
        var ic = document.createElement('i'); ic.className = 'fa-solid ' + icone; ic.setAttribute('aria-hidden', 'true');
        a.appendChild(ic); a.appendChild(document.createTextNode(texte)); liens.appendChild(a);
      };
      mk('darija-progression.html', 'fa-chart-line', DATA.ui.progression[lang]);
      if (window.DAK_STATUT.prof) mk('darija-suivi.html', 'fa-users', DATA.ui.suivi[lang]);
    }

    var root = document.getElementById('parcours');
    root.innerHTML = '';
    DATA.parties.forEach(function(p){
      var sec = el('section', 'partie');
      var head = el('div', 'partie-head');
      head.appendChild(el('div', 'partie-kicker', DATA.ui.partie[lang] + ' ' + p.id));
      head.appendChild(el('h2', 'partie-title', p.title[lang]));
      head.appendChild(el('div', 'partie-range', p.range[lang]));
      head.appendChild(el('div', 'divider'));
      sec.appendChild(head);

      var ST = window.DAK_STATUT || null;
      var T = function(k, o){ var t = DATA.ui[k][lang]; if (o) Object.keys(o).forEach(function(x){ t = t.replace('{' + x + '}', o[x]); }); return t; };
      var etat = function(icone, texte, cls){
        var d = el('div', 'mod-status etat' + (cls ? ' ' + cls : ''));
        var ic = document.createElement('i'); ic.className = 'fa-solid ' + icone; ic.setAttribute('aria-hidden', 'true');
        d.appendChild(ic); d.appendChild(el('span', null, texte)); return d;
      };
      if (ST && !ST.prof && !ST.blocsOuverts[p.id]) {
        var note = el('div', 'partie-note');
        var ni = document.createElement('i'); ni.className = 'fa-solid fa-lock'; ni.setAttribute('aria-hidden', 'true');
        note.appendChild(ni); note.appendChild(el('span', null, T('noteFerme')));
        head.insertBefore(note, head.lastChild);
      }

      var grid = el('div', 'modules-grid');
      p.modules.forEach(function(m){
        // Carte cliquable (<a>) seulement quand le module est ouvert pour cette eleve.
        var ouvert = !!(ST && ST.accessible[m.n]);
        var card = el(ouvert ? 'a' : 'div', 'module-card' + (ouvert ? '' : ' locked'));
        if (ouvert) card.href = 'darija-m' + m.n + '.html';

        // Image à gauche (~38 %) : une image par module, jamais partagée
        var media = el('div', 'mod-media');
        var im = DATA.images && DATA.images[m.n];
        if (im) {
          var img = document.createElement('img');
          img.src = im.src; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
          if (im.pos) media.style.setProperty('--pos', im.pos);
          media.appendChild(img);
        } else {
          media.classList.add('vide');
          media.appendChild(el('span', null, String(m.n)));
        }
        card.appendChild(media);

        var info = el('div', 'module-info');
        info.appendChild(el('div', 'mod-number', DATA.ui.module[lang] + ' ' + m.n));
        info.appendChild(el('div', 'mod-title', m.title[lang]));
        info.appendChild(el('div', 'mod-sub', m.sub[lang]));
        if (ST) {
          if (ST.termines[m.n]) info.appendChild(etat('fa-circle-check', T('termine'), 'fait'));
          else if (ouvert && ST.commence[m.n]) info.appendChild(etat('fa-hourglass-half', T('enCours')));
          else if (!ouvert) {
            if (!ST.blocsOuverts[p.id]) info.appendChild(etat('fa-lock', T('ferme')));
            else {
              var manque = window.DAK_MANQUE ? window.DAK_MANQUE(m.n - 1, lang) : '';
              info.appendChild(etat('fa-lock', T('avant', { n: m.n - 1 }) + (manque ? ' — ' + T('reste', { x: manque }) : '')));
            }
          }
        }
        card.appendChild(info);
        grid.appendChild(card);
      });

      // Examen de fin de partie
      if (ST) {
        var ex = ST.examens[p.id];
        var box = el('div', 'exam-card' + (ex.ouvert ? '' : ' locked'));
        var kick = el('div', 'exam-kicker');
        var ki = document.createElement('i'); ki.className = 'fa-solid ' + (ex.ouvert ? 'fa-graduation-cap' : 'fa-lock'); ki.setAttribute('aria-hidden', 'true');
        kick.appendChild(ki); kick.appendChild(el('span', null, T('examen')));
        box.appendChild(kick);
        box.appendChild(el('div', 'exam-title', T('examenTitre', { b: p.id })));
        var sub = T('examenInfo');
        if (!ex.ouvert) sub = T('examenVerrou');
        else if (ex.reussi) sub = T('examenReussi', { p: ex.meilleur });
        else if (ex.meilleur !== null) sub = T('examenRate', { p: ex.meilleur });
        box.appendChild(el('div', 'exam-sub', sub));
        if (ex.ouvert) {
          var act = el('div', 'exam-actions');
          var lien = function(href, texte, ghost){ var a = el('a', 'exam-btn' + (ghost ? ' ghost' : ''), texte); a.href = href; return a; };
          if (ex.reussi) {
            act.appendChild(lien('darija-certificat.html?bloc=' + p.id, T('certIvoire')));
            act.appendChild(lien('darija-certificat-bordeaux.html?bloc=' + p.id, T('certBordeaux')));
            act.appendChild(lien('darija-examen.html?bloc=' + p.id, T('examenRepasser'), true));
          } else {
            act.appendChild(lien('darija-examen.html?bloc=' + p.id, ex.meilleur !== null ? T('examenRepasser') : T('examenPasser')));
          }
          box.appendChild(act);
        }
        grid.appendChild(box);
      }
      sec.appendChild(grid);
      root.appendChild(sec);
    });
  }

  document.querySelectorAll('.lang-switch button').forEach(function(b){
    b.addEventListener('click', function(){
      lang = b.dataset.lang;
      try { localStorage.setItem(LS_LANG, lang); localStorage.setItem('dak-lang', lang); localStorage.setItem('dak_lang', lang); } catch (_) {}
      render();
    });
  });
  window.DAK_RENDER = render;
  render();
})();
</script>

<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { auth, db, getStatutDarija, manquePour } from "./darija-core.js";
  // Acces Darija : liste independante de l'espace Arabe. La page reste cachee tant que l'acces
  // n'est pas confirme ; les cartes sont ensuite dessinees selon ce qui est ouvert pour l'eleve.
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('auth-darija.html'); return; }
    let statut;
    try { statut = await getStatutDarija(user); } catch (e) { console.error('darija — statut impossible :', e); statut = { acces: false }; }
    if (!statut.acces) { window.location.replace('auth-darija.html'); return; }
    window.DAK_STATUT = statut;
    window.DAK_MANQUE = (n, l) => manquePour(statut, n, l);
    window.DAK_RENDER();
    document.body.style.visibility = 'visible';
    setDoc(doc(db, 'eleves', user.uid), { dernierAccesDarija: serverTimestamp(), pageDarija: 'darija' }, { merge: true }).catch(() => {});
  });
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch((err) => console.error('SW registration failed:', err));
  let dakSwRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (dakSwRefreshing) return;
    dakSwRefreshing = true;
    window.location.reload();
  });
}
</script>
