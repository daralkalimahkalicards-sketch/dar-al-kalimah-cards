
<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dar Al-Kalimah Darija - Module 1 - Leçon</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --burgundy: #5D1828;
      --burgundy-dark: #3a0f19;
      --gold: #C8A462;
      --gold-light: #dfc28b;
      --white: #FFFFFF;
      --bg-beige: #FAF6F0;
      --shadow: 0 20px 50px rgba(93, 24, 40, 0.08);
      --shadow-deep: 0 8px 25px rgba(93, 24, 40, 0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-beige);
      background-image: linear-gradient(135deg, var(--white) 0%, var(--bg-beige) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      overflow-x: hidden;
      color: var(--burgundy);
    }

    .ar-text {
      font-family: "Amiri", "Traditional Arabic", "Sakkal Majalla", "Arabic Typesetting", serif;
      line-height: 1.2;
      direction: rtl;
      unicode-bidi: isolate;
    }

    .serif-text {
      font-family: "Georgia", "Times New Roman", serif;
    }

    .gold { color: var(--gold); }
    .burgundy { color: var(--burgundy); }

    .view {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================
       HOME (ACCUEIL LEÇON - STYLE PREMIUM)
       ========================================= */
    .home-container {
      text-align: center;
      background: var(--burgundy);
      padding: 60px 40px;
      border-radius: 24px;
      box-shadow: var(--shadow-deep);
      max-width: 620px;
      width: 100%;
      color: var(--white);
      position: relative;
    }
    .btn-house{position:absolute;top:18px;right:18px;color:var(--gold);font-size:1.6rem;text-decoration:none;transition:transform 0.3s ease,color 0.3s ease;z-index:10;padding:5px;}
    .btn-house:hover{transform:scale(1.1);color:var(--gold-light);}

    .btn-house-inline{color:var(--gold);font-size:1.3rem;text-decoration:none;transition:transform 0.3s ease,color 0.3s ease;padding:5px;display:flex;align-items:center;}
    .btn-house-inline:hover{transform:scale(1.1);color:var(--gold-light);}

    .home-brand-ar {
      font-size: 3.5rem;
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 5px;
    }

    .home-brand-la {
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #d09470;
    }

    .home-divider {
      width: 60px;
      height: 2px;
      background-color: var(--gold);
      margin: 30px auto;
      opacity: 0.5;
    }

    .app-title {
      font-size: 2.2rem;
      font-family: "Georgia", serif;
      font-style: italic;
      color: var(--gold);
      margin-bottom: 25px;
    }

    .home-subtitle {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 10px;
      font-weight: 500;
      color: var(--white);
    }

    .home-subtitle.es {
      color: var(--gold-light);
      opacity: 0.9;
      font-size: 1rem;
      margin-bottom: 40px;
      font-style: italic;
    }

    .btn-start {
      background-color: transparent;
      color: var(--gold);
      border: 2px solid var(--gold);
      padding: 15px 40px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-start:hover {
      background-color: rgba(200, 164, 98, 0.1);
      transform: translateY(-2px);
    }

    /* =========================================
       CARD HEADER
       ========================================= */
    .card-view-header {
      width: 100%;
      max-width: 950px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .btn-nav {
      background: none;
      border: none;
      color: var(--gold);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 300;
      padding: 6px 8px;
      transition: color 0.3s ease;
    }

    .btn-nav:hover {
      color: var(--gold);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .letter-counter {
      font-size: 0.95rem;
      color: var(--burgundy);
      opacity: 0.8;
      min-width: 95px;
      text-align: center;
    }

    .btn-nav:disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    #card-view {
      position: relative;
    }

    /* FLASHCARD */
    .scene {
      width: 100%;
      max-width: 950px;
      height: auto;
      perspective: 2000px;
      cursor: pointer;
    }

    .card-container {
      width: 100%;
      display: grid;
      position: relative;
      transition: transform 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
      transform-style: preserve-3d;
    }

    .card-container.flipped {
      transform: rotateY(180deg);
    }

    .face {
      grid-area: 1 / 1;
      align-self: start;
      width: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      background-color: var(--white);
      border-radius: 24px;
      border: 1px solid var(--gold);
      box-shadow: inset 0 0 0 5px var(--white), inset 0 0 0 6px var(--gold), var(--shadow);
      display: flex;
      flex-direction: column;
      padding: 15px 50px;
      overflow: hidden;
    }

    .face.back {
      transform: rotateY(180deg);
    }

    .header {
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-ar {
      font-size: 2.4rem;
      color: var(--burgundy);
      font-weight: bold;
      margin-bottom: 2px;
    }

    .header-la {
      font-size: 1.05rem;
      color: var(--burgundy);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .divider-main {
      width: 50px;
      height: 1px;
      background-color: var(--gold);
      margin: 18px 0;
      opacity: 0.8;
    }

        .toast {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--burgundy);
      color: var(--white);
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 0.95rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: bottom 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 1000;
      text-align: center;
      border: 1px solid var(--gold);
    }

    .toast.show {
      bottom: 40px;
    }


    .reading-instruction { text-align:center; font-size:1.05rem; color:var(--burgundy); font-weight:500; letter-spacing:.5px; display:flex; flex-direction:column; align-items:center; margin-bottom:16px; }
    .card-container.flipped .front, .card-container:not(.flipped) .back { pointer-events: none; }
    .face { padding: 22px 34px 26px; }
    .card-title { text-align:center; margin-bottom: 14px; }
    .card-title-ar { font-size: 2.3rem; color: var(--gold); font-weight: bold; }
    .card-title-la { font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; color: var(--burgundy); font-weight: 600; margin-top: 4px; }
    .card-title-es { font-size: .9rem; font-style: italic; color: var(--burgundy); opacity: .75; margin-top: 2px; }
    .scene-info { text-align:center; font-size: .95rem; line-height: 1.5; margin-bottom: 6px; }
    .scene-info.es { font-style: italic; opacity: .8; font-size: .88rem; margin-bottom: 16px; }
    .tools { display:flex; gap: 10px; justify-content:center; flex-wrap: wrap; margin-bottom: 18px; }
    .btn-pill { background: var(--bg-beige); border: 1px solid var(--gold); color: var(--burgundy); border-radius: 50px; padding: 10px 18px; font-size: .9rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-pill.on { background: var(--burgundy); color: var(--gold-light); border-color: var(--burgundy); }
    .line { display:flex; margin-bottom: 14px; }
    .line.right { justify-content: flex-end; }
    .line.left { justify-content: flex-start; }
    .bubble { max-width: 86%; padding: 10px 16px 12px; border: 1px solid var(--gold); position: relative; box-shadow: 0 4px 14px rgba(93,24,40,.06); }
    .line.right .bubble { background: var(--bg-beige); border-radius: 22px 22px 6px 22px; text-align: right; }
    .line.left .bubble { background: var(--white); border-radius: 22px 22px 22px 6px; text-align: left; }
    .line.right .bubble .line-ar { text-align: right; }
    .line.left .bubble .line-ar { text-align: left; }
    .who { font-size: .78rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); font-weight: 700; display:flex; align-items:center; gap: 10px; }
    .line.right .who { justify-content: flex-end; }
    .line.left .who { justify-content: flex-start; flex-direction: row-reverse; }
    .bubble .mic { width: 32px; height: 32px; font-size: .9rem; }
    .mic { background: var(--bg-beige); border: 1px solid var(--gold); color: var(--burgundy); width: 38px; height: 38px; border-radius: 50%; font-size: 1.05rem; cursor: pointer; box-shadow: 0 4px 15px rgba(200,164,98,.2); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
    .mic.playing { background: var(--gold); }
    .line-ar { font-size: 1.95rem; color: var(--burgundy); font-weight: bold; margin: 6px 0 4px; line-height: 1.5; }
    .phon { font-size: .95rem; margin-bottom: 4px; }
    .phon .lang-label, .tr .lang-label { color: var(--gold); font-weight: 700; margin-right: 5px; }
    .tr { font-size: .9rem; line-height: 1.45; }
    .hide-text .line-ar, .hide-text .phon, .hide-text .tr { filter: blur(7px); user-select: none; }
    .hint { text-align:center; font-size: .85rem; opacity: .65; margin-top: 16px; }
    .item { padding: 14px 0; border-bottom: 1px solid rgba(200,164,98,.35); text-align:center; }
    .item:last-child { border-bottom: 0; }
    .item-ar { font-size: 2.1rem; color: var(--burgundy); font-weight: bold; line-height: 1.5; }
    .item-head { display:flex; justify-content:center; align-items:center; gap: 12px; }
    .reply { margin: 10px auto 0; max-width: 420px; border: 1px solid var(--gold-light); background: var(--bg-beige); border-radius: 16px; padding: 8px 12px; }
    .reply-label { font-size: .72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); font-weight: 700; }
    .reply .item-ar { font-size: 1.7rem; }
    .key { padding: 12px 0; border-bottom: 1px solid rgba(200,164,98,.35); text-align: center; }
    .key:last-child { border-bottom: 0; }
    .key-ar { font-size: 1.8rem; color: var(--burgundy); font-weight: bold; line-height: 1.5; }
    .key .reply-line { font-size: .88rem; margin-top: 4px; opacity: .85; }
    .tip { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--gold); border-radius: 16px; background: var(--bg-beige); font-size: .92rem; line-height: 1.5; text-align: center; }
    .tip .es { font-style: italic; opacity: .8; margin-top: 4px; }
    .song { margin-top: 18px; background: var(--burgundy); color: var(--white); border-radius: 20px; padding: 20px 16px; text-align: center; }
    .song-title { font-size: 1.6rem; color: var(--gold); font-weight: bold; }
    .song-sub { font-size: .9rem; color: var(--gold-light); font-style: italic; margin: 4px 0 10px; }
    .song .sl { padding: 8px 0; border-bottom: 1px solid rgba(200,164,98,.3); }
    .song .sl:last-of-type { border-bottom: 0; }
    .song .sl-ar { font-size: 1.7rem; color: var(--white); font-weight: bold; line-height: 1.5; }
    .song .sl-ph { color: var(--gold-light); font-weight: 600; font-size: .95rem; }
    .song .sl-tr { font-size: .85rem; opacity: .85; }
    .song .btn-pill { margin-top: 12px; background: transparent; color: var(--gold); border-color: var(--gold); }
    .n3 { color: var(--gold); font-weight: 700; }
    @media (max-width: 480px) {
      .face { padding: 20px 16px 22px; }
      .line-ar { font-size: 1.7rem; }
      .item-ar { font-size: 1.85rem; }
      .card-title-ar { font-size: 2rem; }
      .header-ar, .home-brand-ar { font-size: 2.2rem; }
      .home-container { padding: 40px 20px; }
      .app-title { font-size: 1.8rem; }
      .card-view-header { justify-content: center; }
    }

    .lang-toggle { display:inline-flex; border:1px solid var(--gold, #C8A462); border-radius:999px; overflow:hidden; z-index:11; }
    .lang-toggle button { background:transparent; border:0; color:var(--gold, #C8A462); font:700 .8rem 'Montserrat', sans-serif; padding:7px 13px; cursor:pointer; letter-spacing:1px; }
    .lang-toggle button.on { background:var(--gold, #C8A462); color:var(--burgundy, #5D1828); }
    .lang-abs { position:absolute; top:22px; left:22px; }
    .lang-light button { color:var(--burgundy, #5D1828); }
    .lang-light button.on { color:#fff; background:var(--burgundy, #5D1828); }
    .lang-light { border-color:var(--burgundy, #5D1828); }
.flag-ma{width:1.7em;height:1.7em;vertical-align:-0.5em;margin-right:.5em;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))} .header-la .flag-ma{width:1.6em;height:1.6em;vertical-align:-0.45em}  </style>
<script src="dak-home.js"></script>
</head>

let currentIndex = 0, toastTimeout = null, hidden = false, playToken = 0;
const player = new Audio(); player.preload = 'none'; player.playsInline = true;
const homeView = document.getElementById('home-view');
const cardView = document.getElementById('card-view');
const flashcard = document.getElementById('flashcard');
const toast = document.getElementById('toast');

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ph(s){ return esc(s).replace(/([379])/g, '<span class="n3">$1</span>'); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
const UI = {
  fr: { ph:'Phonétique :', all:'🎙️ Écouter tout', hide:'Cacher le texte', show:'Afficher le texte', hintF:'Touche la carte : les mots clés', hintT:'Touche la carte : la traduction', hintB:'Touche la carte pour revenir', keys:'Mots clés', tr:'Traduction', reply:'On te répond', song:'La comptine du matin', songPlay:'🎙️ Écouter la comptine' },
  es: { ph:'Fonética :', all:'🎙️ Escuchar todo', hide:'Ocultar el texto', show:'Mostrar el texto', hintF:'Toca la carta: las palabras clave', hintT:'Toca la carta: la traducción', hintB:'Toca la carta para volver', keys:'Palabras clave', tr:'Traducción', reply:'Te responden', song:'La canción de la mañana', songPlay:'🎙️ Escuchar la canción' } };
function U(k){ return UI[LANG][k]; }
function L(o, fr, es){ return LANG === 'fr' ? o[fr] : o[es]; }
function title(c){ return '<div class="card-title"><div class="card-title-ar ar-text" dir="rtl">' + esc(c.tar) + '</div><div class="card-title-la serif-text">' + esc(L(c,'tfr','tes')) + '</div></div>'; }
window.onLang = function(){ if (!cardView.classList.contains('hidden')) renderCard(); };

function frontHTML(c){
  let h = HEADER + title(c);
  if (c.type === 'dialog') {
    const strip = s => s.replace(/<[^>]+>/g, '');
    h += '<div class="scene-info" style="margin-bottom:16px">' + L(c,'ifr','ies') + '</div>';
    h += '<div class="tools"><button class="btn-pill" data-act="all">' + U('all') + '</button><button class="btn-pill' + (hidden ? ' on' : '') + '" data-act="hide">' + (hidden ? U('show') : U('hide')) + '</button></div>';
    h += '<div id="lines" class="' + (hidden ? 'hide-text' : '') + '">';
    c.lines.forEach((l, i) => {
      h += '<div class="line ' + (l[0] === c.lines[0][0] ? 'right' : 'left') + '"><div class="bubble"><div class="who"><button class="mic" data-line="' + i + '" title="Écouter / Escuchar">🎙️</button>' + esc(l[0]) + '</div>' +
           '<div class="line-ar ar-text" dir="rtl">' + esc(l[1]) + '</div>' +
           '<div class="phon"><span class="lang-label">' + U('ph') + '</span>' + ph(l[2]) + '</div>' +
           '<div class="tr"><em>' + esc(LANG === 'fr' ? l[3] : l[4]) + '</em></div></div></div>';
    });
    h += '</div><div class="hint">' + U('hintF') + '</div>';
  } else {
    c.items.forEach((x, i) => {
      h += '<div class="item"><div class="item-head"><div class="item-ar ar-text" dir="rtl">' + esc(x.ar) + '</div><button class="mic" data-item="' + i + '" title="Écouter / Escuchar">🎙️</button></div>' +
           '<div class="phon"><span class="lang-label">' + U('ph') + '</span>' + ph(x.lt) + '</div>';
      if (x.rar) h += '<div class="reply"><div class="reply-label">' + U('reply') + '</div><div class="item-ar ar-text" dir="rtl">' + esc(x.rar) + '</div><div class="phon">' + ph(x.rlt) + '</div></div>';
      h += '</div>';
    });
    h += '<div class="hint">' + U('hintT') + '</div>';
  }
  return h;
}

function backHTML(c){
  const list = c.type === 'dialog' ? c.keys : c.items;
  let h = HEADER + '<div class="reading-instruction">' + (c.type === 'dialog' ? U('keys') : U('tr')) + '<div class="divider-main" style="margin: 15px 0 0 0;"></div></div>' + title(c);
  list.forEach(x => {
    h += '<div class="key"><div class="key-ar ar-text" dir="rtl">' + esc(x.ar) + '</div>' +
         '<div class="phon"><span class="lang-label">' + U('ph') + '</span>' + ph(x.lt) + '</div>' +
         '<div class="tr" style="font-weight:600">' + esc(L(x,'fr','es')) + '</div>';
    if (x.rar) h += '<div class="reply-line">↳ <span class="ar-text" dir="rtl">' + esc(x.rar) + '</span> — ' + esc(L(x,'rfr','res')) + '</div>';
    h += '</div>';
  });
  if (c.tfr2) h += '<div class="tip">' + esc(L(c,'tfr2','tes2')) + '</div>';
  if (c.song) {
    h += '<div class="song"><div class="song-title ar-text" dir="rtl">صباح الخير يا لمير</div><div class="song-sub">' + U('song') + '</div>';
    c.song.ar.forEach(s => { h += '<div class="sl"><div class="sl-ar ar-text" dir="rtl">' + esc(s[0]) + '</div><div class="sl-ph">' + ph(s[1]) + '</div><div class="sl-tr">' + esc(LANG === 'fr' ? s[2] : s[3]) + '</div></div>'; });
    h += '<button class="btn-pill" data-act="song">' + U('songPlay') + '</button></div>';
  }
  return h + '<div class="hint">' + U('hintB') + '</div>';
}

function sizeCard(){
  const f = document.getElementById('face-front'), b = document.getElementById('face-back');
  const fl = flashcard.classList.contains('flipped');
  const a = fl ? b : f, o = fl ? f : b;
  a.style.maxHeight = 'none'; o.style.maxHeight = a.offsetHeight + 'px';
}

function renderCard(){
  const c = CARDS[currentIndex];
  stopAudio();
  flashcard.classList.remove('flipped');
  document.getElementById('face-front').innerHTML = frontHTML(c);
  document.getElementById('face-back').innerHTML = backHTML(c);
  document.getElementById('letter-counter').textContent = (currentIndex + 1) + ' / ' + CARDS.length;
  document.getElementById('btn-prev').disabled = currentIndex === 0;
  document.getElementById('btn-next').disabled = currentIndex === CARDS.length - 1;
  if (currentIndex === CARDS.length - 1) { try { localStorage.setItem('dak-darija-m1-lecon1', '1'); } catch (e) {} }
  sizeCard();
}

function showFlashcard(){ homeView.classList.add('hidden'); cardView.classList.remove('hidden'); renderCard(); }
function stopAudio(){ playToken++; player.pause(); document.querySelectorAll('.mic.playing').forEach(m => m.classList.remove('playing')); }
function showToast(){ clearTimeout(toastTimeout); toast.classList.add('show'); toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500); }
function play(src){
  return new Promise(res => {
    let done = false; const end = ok => { if (done) return; done = true; player.onended = null; player.onerror = null; res(ok); };
    player.pause(); player.src = src; player.load();
    player.onended = () => end(true); player.onerror = () => end(false);
    player.play().catch(() => end(false));
  });
}
function nextCard(e){ e.stopPropagation(); if (currentIndex < CARDS.length - 1) { currentIndex++; renderCard(); } }
function prevCard(e){ e.stopPropagation(); if (currentIndex > 0) { currentIndex--; renderCard(); } }

flashcard.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) { flashcard.classList.toggle('flipped'); sizeCard(); return; }
  e.stopPropagation();
  const act = b.getAttribute('data-act');
  if (act === 'hide') { hidden = !hidden; renderCard(); return; }
  if (act === 'song') { stopAudio(); play(AUDIO_DIR + 'comptine-sbah-lkhir-ya-lmir.mp3').then(ok => { if (!ok) showToast(); }); return; }
  if (act === 'all') {
    stopAudio(); const my = playToken, mics = [...document.querySelectorAll('#lines .mic')]; let i = 0;
    (function step(){
      if (my !== playToken || i >= mics.length) { mics.forEach(m => m.classList.remove('playing')); return; }
      mics.forEach((m, k) => m.classList.toggle('playing', k === i));
      play(AUDIO_DIR + 'd' + (currentIndex + 1) + '-' + pad(i + 1) + '.mp3').then(ok => { if (!ok) { mics.forEach(m => m.classList.remove('playing')); showToast(); return; } i++; setTimeout(step, 450); });
    })();
    return;
  }
  if (b.hasAttribute('data-line')) { stopAudio(); b.classList.add('playing'); play(AUDIO_DIR + 'd' + (currentIndex + 1) + '-' + pad(+b.getAttribute('data-line') + 1) + '.mp3').then(ok => { b.classList.remove('playing'); if (!ok) showToast(); }); return; }
  if (b.hasAttribute('data-item')) { stopAudio(); b.classList.add('playing'); play(AUDIO_DIR + 'carte-' + pad(currentIndex + 1) + '-' + pad(+b.getAttribute('data-item') + 1) + '.mp3').then(ok => { b.classList.remove('playing'); if (!ok) showToast(); }); return; }
});
window.addEventListener('resize', sizeCard);

  </script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch((err) => console.error('SW registration failed:', err));
  let dakSwRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (dakSwRefreshing) return;
    dakSwRefreshing = true;
    window.location.reload();
  });
}
