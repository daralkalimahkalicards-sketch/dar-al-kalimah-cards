<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#5D1828">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banque des mots — DAK Darija</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="slate-tools.css">
    <script src="slate-tools.js"></script>

    <style>
        :root {
            --burgundy: #5D1828;
            --burgundy-dark: #3a0f19;
            --gold: #C8A462;
            --gold-light: #dfc28b;
            --gold-faded: rgba(200, 164, 98, 0.15);
            --white: #FFFFFF;
            --bg-beige: #FAF6F0;
            --text-dark: #2C3E50;
            --text-muted: #7F8C8D;
            --border-soft: #E5E7EB;
            --shadow-elegant: 0 4px 15px rgba(93, 24, 40, 0.05);
            --shadow-deep: 0 8px 25px rgba(93, 24, 40, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-beige);
            background-image: linear-gradient(135deg, var(--white) 0%, var(--bg-beige) 100%);
            font-family: 'Montserrat', sans-serif;
            padding: 30px 15px; color: var(--text-dark);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            visibility: hidden;
        }
        .hidden { display: none !important; }
        .ar-text { font-family: "Amiri", serif; direction: rtl; }
        .serif-text { font-family: "Cinzel", "Georgia", serif; }

        .header-container {
            background: var(--burgundy); padding: 40px 30px; border-radius: 12px;
            box-shadow: 0 8px 25px rgba(93, 24, 40, 0.25); width: 100%; max-width: 900px; margin-bottom: 30px;
            position: relative; text-align: center;
        }
        .btn-back-home {
            position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: var(--gold);
            cursor: pointer; text-decoration: none; display: flex; align-items: center; transition: all 0.3s ease;
        }
        .btn-back-home:hover { transform: scale(1.1); }
        .brand-ar { font-size: 3.2rem; font-weight: 700; color: var(--gold); margin-bottom: 5px; line-height: 1.2; }
        .app-title { font-size: 1.1rem; color: #d09470; letter-spacing: 4px; text-transform: uppercase; font-weight: 600;}
        .divider { width: 50px; height: 1px; background-color: var(--gold); margin: 25px auto; opacity: 0.5; }
        .header-desc { font-size: 0.95rem; color: var(--gold-light); font-weight: 500; margin-bottom: 25px; line-height: 1.6; opacity: 0.9; }

        .filters { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .search-bar { position: relative; }
        .search-bar input {
            width: 100%; padding: 18px 50px 18px 25px; font-size: 1rem; font-family: 'Montserrat', sans-serif;
            border: 1px solid var(--gold-light); border-radius: 50px; background: var(--bg-beige);
            color: var(--burgundy); outline: none; transition: all 0.3s ease; font-weight: 500;
        }
        .search-bar input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(200, 164, 98, 0.3); background: var(--white); }
        .search-bar i { position: absolute; right: 25px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 1.1rem; }
        .module-select {
            width: 100%; padding: 14px 20px; font-size: 0.9rem; font-family: 'Montserrat', sans-serif;
            border: 1px solid var(--gold-light); border-radius: 50px; background: var(--bg-beige);
            color: var(--burgundy); outline: none; font-weight: 500;
        }
        .result-count { font-size: 0.78rem; color: var(--gold-light); text-align: center; margin-top: 8px; }

        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
        .word-card { background: var(--white); border: 1px solid var(--gold-light); border-radius: 12px; padding: 22px 18px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; box-shadow: var(--shadow-elegant); cursor: pointer; transition: all 0.3s ease; }
        .word-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-deep); border-color: var(--gold); }
        .word-ar-small { font-size: 1.5rem; font-weight: 700; color: var(--burgundy); line-height: 1.5; margin-bottom: 6px; text-align: center; }
        .word-lt { font-size: 0.82rem; color: var(--gold-light); font-style: italic; margin-bottom: 14px; text-align: center; }
        .card-bottom { width: 100%; border-top: 1px solid var(--border-soft); padding-top: 12px; text-align: center; }
        .lang-fr { color: var(--text-dark); font-weight: 500; font-size: 0.88rem; margin-bottom: 4px; }
        .module-badge { display: inline-block; font-size: 0.68rem; color: var(--gold-light); background: var(--gold-faded); border-radius: 50px; padding: 2px 10px; margin-top: 8px; }

        .study-container { background: var(--white); border: 1px solid var(--gold); border-radius: 12px; width: 100%; max-width: 650px; margin: 0 auto; box-shadow: var(--shadow-deep); display: flex; flex-direction: column; overflow: hidden; }
        .study-header { background: var(--burgundy); border-bottom: 2px solid var(--gold); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .study-header-title { font-size: 0.85rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
        .btn-close-study { background: transparent; border: none; color: var(--gold); font-size: 1.2rem; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-close-study:hover { opacity: 0.7; transform: scale(1.1); }
        .study-body { padding: 40px 30px; display: flex; flex-direction: column; align-items: center; }
        .giant-word-ar { font-family: "Amiri", serif; font-size: 3.2rem; font-weight: 700; color: var(--burgundy); line-height: 1.5; text-align: center; direction: rtl; margin-bottom: 8px; }
        .giant-word-lt { font-size: 1.1rem; color: var(--gold-light); font-style: italic; text-align: center; margin-bottom: 25px; }
        .translations-box { text-align: center; margin-bottom: 35px; }
        .translations-box .fr-text { font-size: 1.1rem; font-weight: 500; color: var(--text-dark); margin-bottom: 5px; }
        .translations-box .es-text { font-size: 0.9rem; color: var(--text-muted); font-style: italic; }
        .slate-wrapper { width: 100%; }
        .writing-section-title { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .slate-container { width: 100%; height: 180px; border: 1px solid var(--gold-light); border-radius: 8px; background-color: var(--white); position: relative; overflow: hidden; }
        canvas.slate-canvas { width: 100%; height: 100%; cursor: crosshair; touch-action: none; background-image: repeating-linear-gradient(transparent, transparent 48px, var(--bg-beige) 49px, var(--bg-beige) 50px); }
        .study-footer { border-top: 1px solid var(--gold-light); padding: 20px 30px; background: var(--bg-beige); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .btn-footer { background: var(--white); border: 1px solid var(--gold); color: var(--burgundy); padding: 12px 25px; border-radius: 6px; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.3s; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-footer:hover { background: var(--gold-faded); }
        .btn-next { background: var(--burgundy); color: var(--white); border-color: var(--burgundy); }
        .btn-next:hover { background: var(--burgundy-dark); }

        @media (max-width: 600px) { .header-container { padding: 30px 20px; } .btn-back-home { position: static; margin-bottom: 20px; display: inline-flex; justify-content: center; } .study-body { padding: 30px 20px; } .giant-word-ar { font-size: 2.4rem; } .study-footer { flex-direction: column; } .btn-footer { width: 100%; } }
    </style>
</head>
<body>

    <div id="lexique-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="header-container">
            <a href="darija-accueil.html" class="btn-back-home" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 2.6 2 11h3v10h5.5v-6.5h3V21H19V11h3L12 2.6Z"/></svg></a>
            <div class="brand-ar ar-text">بنك الكلمات</div>
            <div class="app-title serif-text">Banque des mots · Darija</div>
            <div class="divider"></div>
            <p class="header-desc">
                Tous les mots et expressions vus dans les 24 modules.<br>
                <span style="font-size: 0.85rem; opacity: 0.8;">Todas las palabras y expresiones de los 24 módulos.</span>
            </p>
            <div class="filters">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Rechercher / Buscar..." onkeyup="filterWords()" />
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <select class="module-select" id="moduleSelect" onchange="filterWords()">
                    <option value="">Tous les modules / Todos los módulos</option>
                </select>
            </div>
            <p class="result-count" id="resultCount"></p>
        </div>
        <div class="vocab-grid" id="vocab-grid"></div>
    </div>

    <div id="dictation-view" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <button class="btn-footer" onclick="backToLexique()" style="margin-bottom: 20px; align-self: center;"><i class="fa-solid fa-arrow-left"></i> Retour / Volver</button>
        <div class="study-container">
            <div class="study-header">
                <span class="study-header-title serif-text" id="study-module"></span>
                <button class="btn-close-study" onclick="backToLexique()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="study-body">
                <div id="quiz-word" class="giant-word-ar"></div>
                <div id="quiz-word-lt" class="giant-word-lt"></div>
                <div class="translations-box">
                    <div class="fr-text" id="word-fr"></div>
                    <div class="es-text" id="word-es"></div>
                </div>
                <div class="slate-wrapper">
                    <div class="writing-section-title">
                        <span>Je recopie / Copio</span>
                    </div>
                    <div id="pen-toolbar-mount"></div>
                    <div class="slate-container">
                        <canvas id="slate-canvas" class="slate-canvas"></canvas>
                    </div>
                </div>
            </div>
            <div class="study-footer">
                <button class="btn-footer" onclick="clearSlate()"><i class="fa-solid fa-eraser"></i> Effacer / Borrar</button>
                <button class="btn-footer btn-next" onclick="nextWord()">Suivant / Siguiente <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

<script src="darija-database.js"></script>
<script>
        let currentWordIndex = 0;
        let currentList = darijaWordsDatabase;
        const lexiqueView = document.getElementById("lexique-view");
        const dictationView = document.getElementById("dictation-view");
        const grid = document.getElementById("vocab-grid");
        const giantWordText = document.getElementById("quiz-word");
        const giantWordLt = document.getElementById("quiz-word-lt");
        const wordFrText = document.getElementById("word-fr");
        const wordEsText = document.getElementById("word-es");
        const studyModule = document.getElementById("study-module");

        function populateModuleSelect() {
            const sel = document.getElementById("moduleSelect");
            for (let m = 1; m <= 24; m++) {
                const opt = document.createElement("option");
                opt.value = String(m);
                opt.textContent = "Module " + m;
                sel.appendChild(opt);
            }
        }

        function renderWords(words) {
            grid.innerHTML = "";
            document.getElementById("resultCount").textContent = words.length + " mot(s) / palabra(s)";
            words.forEach(word => {
                const card = document.createElement("div");
                card.className = "word-card";
                card.innerHTML = `<div style="width:100%;"><div class="word-ar-small ar-text">${word.ar}</div><div class="word-lt">${word.lt || ''}</div></div><div class="card-bottom"><div class="lang-fr">${word.fr}</div><span class="module-badge">Module ${word.module}</span></div>`;
                card.onclick = () => openDictation(word);
                grid.appendChild(card);
            });
        }

        function filterWords() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const mod = document.getElementById("moduleSelect").value;
            currentList = darijaWordsDatabase.filter(w => {
                const matchQuery = !query || w.fr.toLowerCase().includes(query) || (w.es || '').toLowerCase().includes(query) || w.ar.includes(query) || (w.lt || '').toLowerCase().includes(query);
                const matchMod = !mod || String(w.module) === mod;
                return matchQuery && matchMod;
            });
            renderWords(currentList);
        }

        function openDictation(word) {
            currentWordIndex = currentList.findIndex(w => w.id === word.id);
            lexiqueView.classList.add("hidden"); dictationView.classList.remove("hidden");
            loadWord(); setTimeout(resizeCanvas, 100);
        }

        function backToLexique() {
            dictationView.classList.add("hidden"); lexiqueView.classList.remove("hidden");
        }

        function loadWord() {
            const word = currentList[currentWordIndex];
            giantWordText.textContent = word.ar;
            giantWordLt.textContent = word.lt || '';
            wordFrText.textContent = word.fr;
            wordEsText.textContent = word.es || '';
            studyModule.textContent = "Module " + word.module;
            clearSlate();
        }

        function nextWord() { currentWordIndex = (currentWordIndex + 1) % currentList.length; loadWord(); }

        const canvas = document.getElementById("slate-canvas"); const ctx = canvas.getContext("2d");
        let isDrawing = false; let lastX = 0; let lastY = 0;
        const slateTools = SlateTools.createController({ penWidth: 6, eraserWidth: 22 });
        function resizeCanvas() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; slateTools.applyStyle(ctx); }
        function getPos(e) { const rect = canvas.getBoundingClientRect(); const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY; return { x: clientX - rect.left, y: clientY - rect.top }; }
        function startPosition(e) { isDrawing = true; const pos = getPos(e); lastX = pos.x; lastY = pos.y; }
        function endPosition() { isDrawing = false; ctx.beginPath(); }
        function draw(e) { if (!isDrawing) return; e.preventDefault(); const pos = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke(); lastX = pos.x; lastY = pos.y; }
        function clearSlate() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        canvas.addEventListener("mousedown", startPosition); canvas.addEventListener("mouseup", endPosition); canvas.addEventListener("mousemove", draw); canvas.addEventListener("mouseout", endPosition);
        canvas.addEventListener("touchstart", startPosition, { passive: false }); canvas.addEventListener("touchend", endPosition); canvas.addEventListener("touchmove", draw, { passive: false });
        window.addEventListener("resize", resizeCanvas);
        slateTools.mount(document.getElementById("pen-toolbar-mount"), ctx, clearSlate);

        document.addEventListener("DOMContentLoaded", () => {
            populateModuleSelect();
            renderWords(darijaWordsDatabase);
        });
</script>
<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { auth, getStatutDarija } from "./darija-core.js";
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('auth-darija.html'); return; }
    let statut;
    try { statut = await getStatutDarija(user); } catch (e) { console.error('darija-bank :', e); statut = { acces: false }; }
    if (!statut.acces) { window.location.replace('auth-darija.html'); return; }
    document.body.style.visibility = 'visible';
  });
  setTimeout(() => { document.body.style.visibility = 'visible'; }, 4000);
</script>
</body>
</html>
