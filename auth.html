<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#5D1828">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dar Al-Kalimah — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --burgundy: #5D1828; --gold: #C8A462; --white: #FFFFFF; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    background-color: #5D1828;
  }
  body {
    min-height: 100vh;
    width: 100%;
    background-color: #5D1828;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
    padding: 20px;
  }
  .auth-card {
    background: linear-gradient(145deg, var(--burgundy), #3d0f1a);
    border: 1px solid rgba(200,164,98,0.4);
    border-radius: 20px;
    padding: 50px 40px;
    width: 100%;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(93,24,40,0.3);
    position: relative;
    overflow: hidden;
  }
  .auth-card::before {
    content: '';
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(200,164,98,0.2);
    border-radius: 12px;
    pointer-events: none;
  }
  .brand-ar { font-family: 'Amiri', serif; font-size: 2.5rem; color: var(--gold); margin-bottom: 5px; }
  .brand-en { font-family: 'Cinzel', serif; font-size: 0.85rem; color: rgba(200,164,98,0.7); letter-spacing: 3px; margin-bottom: 30px; }
  .divider { width: 60px; height: 1px; background: var(--gold); margin: 0 auto 30px; opacity: 0.6; }
  .tabs { display: flex; gap: 10px; margin-bottom: 30px; background: rgba(255,255,255,0.05); border-radius: 50px; padding: 4px; }
  .tab { flex: 1; padding: 10px; border: none; border-radius: 50px; background: transparent; color: rgba(255,255,255,0.5); font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.3s; }
  .tab.active { background: var(--gold); color: var(--burgundy); font-weight: 700; }
  .form-group { margin-bottom: 16px; text-align: left; }
  .form-group label { display: block; color: rgba(200,164,98,0.8); font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 14px 18px; border: 1.5px solid rgba(200,164,98,0.3); border-radius: 50px; background: rgba(255,255,255,0.08); color: var(--white); font-family: 'Montserrat', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
  .form-group input:focus { border-color: var(--gold); }
  .form-group input::placeholder { color: rgba(255,255,255,0.3); }
  .btn-main { width: 100%; padding: 16px; background: var(--gold); color: var(--burgundy); border: none; border-radius: 50px; font-family: 'Montserrat', sans-serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
  .btn-main:hover { opacity: 0.9; transform: translateY(-1px); }
  .msg { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 0.85rem; display: none; }
  .msg.error { background: rgba(255,80,80,0.2); color: #ff9999; display: block; }
  .msg.success { background: rgba(80,200,80,0.2); color: #90ee90; display: block; }
  .form-panel { display: none; }
  .form-panel.active { display: block; }
  .user-info { display: none; text-align: center; }
  .user-name { color: var(--gold); font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
  .user-email { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 24px; }
  .btn-secondary { width: 100%; padding: 14px; background: transparent; color: rgba(200,164,98,0.7); border: 1px solid rgba(200,164,98,0.3); border-radius: 50px; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; cursor: pointer; margin-top: 10px; transition: all 0.3s; }
  .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

  /* Bouton cloche "Activer mes rappels" -- meme identite que .btn-secondary (contour or,
     transparent) puisqu'il ne doit pas rivaliser visuellement avec le bouton dore plein
     "Continuer l'apprentissage". Classe separee (pas une simple reutilisation de
     .btn-secondary) pour permettre l'icone + le layout flex sans toucher au bouton
     "Se deconnecter" existant. */
  .btn-notif { width: 100%; padding: 14px; background: transparent; color: var(--gold); border: 1px solid rgba(200,164,98,0.5); border-radius: 999px; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 9px; }
  .btn-notif:hover:not(:disabled) { background: rgba(200,164,98,0.08); border-color: var(--gold); }
  .btn-notif:disabled { cursor: default; }
  .btn-notif.is-active { color: rgba(200,164,98,0.55); border-color: rgba(200,164,98,0.22); background: rgba(200,164,98,0.05); }
  .btn-notif .btn-es { display: block; font-size: 0.72em; font-weight: 500; opacity: 0.85; margin-top: 1px; text-transform: none; letter-spacing: 0.3px; }
  .link-forgot { display: block; text-align: center; margin-top: 14px; color: rgba(200,164,98,0.75); font-size: 0.8rem; text-decoration: none; cursor: pointer; background: none; border: none; font-family: 'Montserrat', sans-serif; width: 100%; }
  .link-forgot:hover { color: var(--gold); text-decoration: underline; }
  .lbl-es { display: block; text-transform: none; font-weight: 400; font-style: italic; letter-spacing: 0; color: rgba(200,164,98,0.5); margin-top: 3px; font-size: 0.7rem; }
  .btn-es { display: block; font-size: 0.72em; font-weight: 500; opacity: 0.85; margin-top: 2px; text-transform: none; letter-spacing: 0.3px; }
  .msg .es { display: block; font-style: italic; opacity: 0.85; margin-top: 4px; font-size: 0.88em; }
  @media (max-width: 480px) { .auth-card { padding: 40px 24px; } .brand-ar { font-size: 2rem; } }

  /* Password visibility toggle */
  .pwd-wrap { position: relative; }
  .pwd-wrap input { padding-right: 48px; }
  .pwd-toggle { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: var(--gold); padding: 0; }
  .pwd-toggle:hover { opacity: 0.75; }
  .pwd-toggle svg { pointer-events: none; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="brand-ar">دار الكلمة</div>
  <div class="brand-en">DAR AL-KALIMAH</div>
  <div class="divider"></div>

  <!-- SI DÉJÀ CONNECTÉ -->
  <div class="user-info" id="user-info">
    <div class="user-name" id="user-display-name"></div>
    <div class="user-email" id="user-display-email"></div>
    <button class="btn-notif" id="btn-notif-bell" type="button" onclick="activateNotifBell()">
      <i class="fa-solid fa-bell"></i>
      <span>Activer mes rappels<span class="btn-es">Activar mis recordatorios</span></span>
    </button>
    <button class="btn-main" onclick="goToApp()">▶ Continuer l'apprentissage</button>
    <button class="btn-secondary" onclick="logout()">Se déconnecter</button>
  </div>

  <!-- FORMULAIRES -->
  <div id="auth-forms">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Connexion</button>
      <button class="tab" onclick="switchTab('register')">Inscription</button>
    </div>

    <!-- CONNEXION -->
    <div id="panel-login" class="form-panel active">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="ton@email.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="login-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
          <button type="button" class="pwd-toggle" onclick="togglePwd(this)" aria-label="Afficher le mot de passe">
            <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button class="btn-main" onclick="login()">Se connecter</button>
      <div id="login-msg" class="msg"></div>
      <button type="button" class="link-forgot" onclick="showResetPanel()">
        Mot de passe oublié ?
        <span class="lbl-es">¿Has olvidado tu contraseña?</span>
      </button>
    </div>

    <!-- MOT DE PASSE OUBLIÉ -->
    <div id="panel-reset" class="form-panel">
      <div class="form-group">
        <label>Entre ton adresse e-mail<span class="lbl-es">Introduce tu correo electrónico</span></label>
        <input type="email" id="reset-email" placeholder="ton@email.com" onkeydown="if(event.key==='Enter')resetPassword()">
      </div>
      <button class="btn-main" id="btn-reset" onclick="resetPassword()">
        Envoyer le lien
        <span class="btn-es">Enviar el enlace</span>
      </button>
      <div id="reset-msg" class="msg"></div>
      <button type="button" class="link-forgot" onclick="showLoginPanel()">
        ← Retour à la connexion
        <span class="lbl-es">← Volver al inicio de sesión</span>
      </button>
    </div>

    <!-- INSCRIPTION -->
    <div id="panel-register" class="form-panel">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" id="reg-name" placeholder="Ton prénom">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="ton@email.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="reg-password" placeholder="Minimum 6 caractères" onkeydown="if(event.key==='Enter')register()">
          <button type="button" class="pwd-toggle" onclick="togglePwd(this)" aria-label="Afficher le mot de passe">
            <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button class="btn-main" onclick="register()">Créer mon compte</button>
      <div id="reg-msg" class="msg"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signOut, deleteUser, onAuthStateChanged, browserLocalPersistence, setPersistence, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBz5vRQUf4N7Px0YR4csyOlk72s1eOLLHQ",
  authDomain: "dar-al-kalimah.firebaseapp.com",
  projectId: "dar-al-kalimah",
  storageBucket: "dar-al-kalimah.firebasestorage.app",
  messagingSenderId: "472629258",
  appId: "1:472629258:web:29b755d38efe89421f1ff3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// OneSignal (bouton cloche "Activer mes rappels" sur l'ecran "Bonjour ...") : meme
// pattern deferred que notifications.html, meme App ID. Ne bloque jamais l'ecran de
// connexion en l'attendant -- getOneSignalAuth() se resout avec l'instance des qu'elle
// est prete, ou avec null apres un delai raisonnable si le SDK ne repond jamais.
const DAK_ONESIGNAL_APP_ID = "45f20a47-8afe-4b34-b847-8493041430bf";
let _resolveOneSignalAuth;
const oneSignalReadyAuth = new Promise((resolve) => { _resolveOneSignalAuth = resolve; });
window.OneSignalDeferred = window.OneSignalDeferred || [];
window.OneSignalDeferred.push(async function (OneSignal) {
  try {
    await OneSignal.init({
      appId: DAK_ONESIGNAL_APP_ID,
      serviceWorkerPath: "sw.js",
      serviceWorkerParam: { scope: "/" }
    });
    _resolveOneSignalAuth(OneSignal);
  } catch (e) {
    console.error("auth.html — erreur init OneSignal:", e);
    _resolveOneSignalAuth(null);
  }
});
function getOneSignalAuth(timeoutMs = 8000) {
  return Promise.race([
    oneSignalReadyAuth,
    new Promise((resolve) => setTimeout(() => resolve(null), timeoutMs))
  ]);
}

// Persistance locale — l'élève reste connecté même après fermeture du navigateur
await setPersistence(auth, browserLocalPersistence);

// Redirection post-connexion, dans l'ordre :
// 1) test de positionnement tant qu'il n'a pas été validé ;
// 2) étape notifications si jamais proposée (statut absent ou 'not_asked'), ou si
//    "later" et le délai de 7 jours est dépassé (eleves/{uid}.notifications) ;
// 3) sinon l'accueil.
// En cas d'erreur de lecture Firestore, on ne bloque jamais l'élève : index.html.
async function redirectAfterAuth(uid) {
  try {
    const snap = await getDoc(doc(db, 'eleves', uid));
    const data = snap.exists() ? snap.data() : {};
    if (data.testPositionnementFait !== true) {
      window.location.href = 'test-positionnement.html';
      return;
    }
    const notif = data.notifications;
    const laterDue = notif && notif.statut === 'later' && notif.dateRepropositionApres &&
      notif.dateRepropositionApres.toDate().getTime() <= Date.now();
    if (!notif || !notif.statut || notif.statut === 'not_asked' || laterDue) {
      window.location.href = 'notifications.html?flow=required';
      return;
    }
    window.location.href = 'index.html';
  } catch (e) {
    console.error('Erreur lecture profil élève:', e);
    window.location.href = 'index.html';
  }
}

// Vérifier si déjà connecté
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('auth-forms').style.display = 'none';
    document.getElementById('user-info').style.display = 'block';
    document.getElementById('user-display-name').textContent = '👋 Bonjour ' + (user.displayName || '');
    document.getElementById('user-display-email').textContent = user.email;
    initNotifBell(user.uid);
  }
});

// Etat initial du bouton cloche : refletee eleves/{uid}.notifications.statut deja
// enregistre (meme champ que notifications.html), pour ne jamais redemander si
// l'activation a deja ete faite depuis cet ecran ou depuis notifications.html.
async function initNotifBell(uid) {
  const btn = document.getElementById('btn-notif-bell');
  if (!btn) return;
  try {
    const snap = await getDoc(doc(db, 'eleves', uid));
    const notif = snap.exists() ? snap.data().notifications : null;
    if (notif && notif.statut === 'accepted') setNotifBellActive();
  } catch (e) {
    console.error('auth.html — lecture statut notifications impossible :', e);
  }
}

function setNotifBellActive() {
  const btn = document.getElementById('btn-notif-bell');
  if (!btn) return;
  btn.classList.add('is-active');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-bell"></i><span>Rappels activés<span class="btn-es">Recordatorios activados</span></span>';
}

// Meme logique que handleActivateClick() de notifications.html (y compris la
// reparation d'un abonnement fantome, cf. correctif du 11/09/2026), rejouee ici pour
// que l'activation se fasse en un clic sans quitter cet ecran.
window.activateNotifBell = async () => {
  const btn = document.getElementById('btn-notif-bell');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  const originalHTML = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-bell"></i><span>Vérification en cours…<span class="btn-es">Comprobando…</span></span>';
  try {
    const OneSignal = await getOneSignalAuth();
    if (!OneSignal) throw new Error('OneSignal indisponible (SDK non chargé)');
    await OneSignal.Notifications.requestPermission();
    const optedIn = OneSignal.User.PushSubscription.optedIn === true;
    const uid = auth.currentUser.uid;
    const ref = doc(db, 'eleves', uid);
    if (optedIn) {
      try {
        await Promise.race([
          OneSignal.login(uid),
          new Promise((resolve) => setTimeout(resolve, 5000))
        ]);
      } catch (eLogin) {
        console.error('auth.html — erreur OneSignal.login (on continue quand même) :', eLogin);
      }
      let subscriptionId = OneSignal.User.PushSubscription.id;
      let subscriptionToken = OneSignal.User.PushSubscription.token;
      const subscriptionDeadline = Date.now() + 5000;
      while ((!subscriptionId || !subscriptionToken) && Date.now() < subscriptionDeadline) {
        await new Promise((resolve) => setTimeout(resolve, 250));
        subscriptionId = OneSignal.User.PushSubscription.id;
        subscriptionToken = OneSignal.User.PushSubscription.token;
      }
      // Abonnement fantome (id present, token absent) : tentative de reparation
      // avant d'abandonner, meme correctif que notifications.html.
      if (subscriptionId && !subscriptionToken) {
        try {
          await OneSignal.User.PushSubscription.optOut();
          await OneSignal.User.PushSubscription.optIn();
          const repairDeadline = Date.now() + 5000;
          while (!OneSignal.User.PushSubscription.token && Date.now() < repairDeadline) {
            await new Promise((resolve) => setTimeout(resolve, 250));
          }
          subscriptionId = OneSignal.User.PushSubscription.id;
          subscriptionToken = OneSignal.User.PushSubscription.token;
        } catch (eRepair) {
          console.error('auth.html — réparation abonnement fantôme impossible :', eRepair);
        }
      }
      if (auth.currentUser.email === 'sunfertity2080@gmail.com') {
        try {
          await OneSignal.User.addTag('role', 'prof');
        } catch (eTag) {
          console.error('Erreur ajout tag role=prof :', eTag);
        }
      }
      if (!subscriptionId || !subscriptionToken) {
        throw new Error('Permission accordée mais abonnement push non confirmé côté OneSignal');
      }
      await setDoc(ref, { notifications: {
        statut: 'accepted',
        dateDernierChoix: serverTimestamp(),
        dateActivation: serverTimestamp(),
        dateDerniereVerification: serverTimestamp(),
        oneSignalSubscribed: true
      }}, { merge: true });
      setNotifBellActive();
    } else {
      await setDoc(ref, { notifications: {
        statut: 'denied',
        dateDernierChoix: serverTimestamp(),
        dateDerniereVerification: serverTimestamp(),
        oneSignalSubscribed: false
      }}, { merge: true });
      btn.disabled = false;
      btn.innerHTML = originalHTML;
    }
  } catch (e) {
    console.error('auth.html — erreur activation notifications:', e);
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  }
};

window.togglePwd = (btn) => {
  const input = btn.parentElement.querySelector('input');
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.setAttribute('aria-label', showing ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
  btn.querySelector('.icon-eye').style.display = showing ? '' : 'none';
  btn.querySelector('.icon-eye-off').style.display = showing ? 'none' : '';
};

window.switchTab = (tab) => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById(`panel-${tab}`).classList.add('active');
};

window.goToApp = () => { redirectAfterAuth(auth.currentUser.uid); };

// Ecran "mot de passe oublie" : un 3e panneau, atteint uniquement via le lien
// (pas un onglet) — on masque la barre d'onglets pendant qu'il est affiche.
window.showResetPanel = () => {
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-reset').classList.add('active');
  document.querySelector('.tabs').style.display = 'none';
};
window.showLoginPanel = () => {
  document.querySelector('.tabs').style.display = 'flex';
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('login')"]`).classList.add('active');
  document.getElementById('panel-login').classList.add('active');
  const msg = document.getElementById('reset-msg');
  msg.className = 'msg';
  msg.textContent = '';
  document.getElementById('reset-email').value = '';
};

window.login = async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const msg = document.getElementById('login-msg');
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    msg.className = 'msg success';
    msg.textContent = '✅ Connexion réussie ! Redirection...';
    setTimeout(() => redirectAfterAuth(cred.user.uid), 1200);
  } catch(e) {
    msg.className = 'msg error';
    msg.textContent = '❌ Email ou mot de passe incorrect.';
  }
};

window.register = async () => {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const msg = document.getElementById('reg-msg');
  if (!name) { msg.className='msg error'; msg.textContent='❌ Entre ton prénom.'; return; }
  if (password.length < 6) { msg.className='msg error'; msg.textContent='❌ Mot de passe trop court (6 caractères minimum).'; return; }

  try {
    // 1. Créer le compte Firebase Auth
    const cred = await createUserWithEmailAndPassword(auth, email, password);

    // 2. Vérifier (en tant qu'utilisateur connecté) si l'email est autorisé
    let autorise = false;
    try {
      const q = query(collection(db, 'emails_autorises'), where('email', '==', email));
      const snap = await getDocs(q);
      autorise = !snap.empty;
    } catch(e) {
      // Si erreur de lecture (règles restrictives), on bloque par sécurité
      autorise = false;
    }

    if (!autorise) {
      // Email non autorisé → supprimer le compte créé
      await deleteUser(cred.user);
      await signOut(auth);
      msg.className = 'msg error';
      msg.textContent = '❌ Ton email n\'est pas encore autorisé. Contacte Houda pour accéder à la plateforme.';
      return;
    }

    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, 'eleves', cred.user.uid), {
      nom: name,
      email: email,
      dateInscription: serverTimestamp(),
      dernierAcces: serverTimestamp(),
      testPositionnementFait: false
    });
    msg.className = 'msg success';
    msg.textContent = '✅ Compte créé ! Redirection...';
    setTimeout(() => window.location.href = 'test-positionnement.html', 1200);
  } catch(e) {
    msg.className = 'msg error';
    msg.textContent = e.code === 'auth/email-already-in-use'
      ? '❌ Email déjà utilisé. Connecte-toi.'
      : '❌ Erreur : ' + e.message;
  }
};

const RESET_MSG_OK = 'Si cette adresse correspond à un compte Dar Al-Kalimah, tu recevras un e-mail te permettant de choisir un nouveau mot de passe. Pense à vérifier tes courriers indésirables.<span class="es">Si esta dirección corresponde a una cuenta de Dar Al-Kalimah, recibirás un correo para elegir una nueva contraseña. Revisa también la carpeta de correo no deseado.</span>';

window.resetPassword = async () => {
  const email = document.getElementById('reset-email').value.trim();
  const msg = document.getElementById('reset-msg');
  const btn = document.getElementById('btn-reset');
  if (!email) {
    msg.className = 'msg error';
    msg.innerHTML = '❌ Entre ton adresse e-mail.<span class="es">❌ Introduce tu correo electrónico.</span>';
    return;
  }
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    await sendPasswordResetEmail(auth, email);
    msg.className = 'msg success';
    msg.innerHTML = RESET_MSG_OK;
  } catch (e) {
    if (e.code === 'auth/invalid-email') {
      msg.className = 'msg error';
      msg.innerHTML = '❌ Adresse email invalide.<span class="es">❌ Correo electrónico no válido.</span>';
    } else {
      // Ne jamais reveler si le compte existe ou non (auth/user-not-found ou
      // toute autre erreur technique) : meme message rassurant que le succes.
      msg.className = 'msg success';
      msg.innerHTML = RESET_MSG_OK;
    }
  } finally {
    btn.disabled = false;
  }
};

window.logout = async () => {
  await signOut(auth);
  document.getElementById('auth-forms').style.display = 'block';
  document.getElementById('user-info').style.display = 'none';
};
</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch((err) => console.error('SW registration failed:', err));
  // Cause exacte du "va et vient" constatee le 12/09/2026 : controllerchange se
  // declenche aussi bien lors de la PREMIERE prise de controle d'une page (aucun
  // controleur au chargement -> la page n'a alors RIEN a gagner a se recharger,
  // elle vient deja d'etre servie fraiche par le reseau) que lors d'une vraie MISE A
  // JOUR (un controleur deja actif se fait remplacer par une version plus recente,
  // la seule situation ou le reload sert a quelque chose). Le code precedent
  // rechargeait dans les deux cas -- reproduit avec des onglets neufs, memes
  // plusieurs minutes apres tout deploiement (donc pas seulement un residu de
  // deploiement recent) : hadControllerAtLoad distingue desormais les deux cas.
  const hadControllerAtLoad = !!navigator.serviceWorker.controller;
  // Garde-fou en sessionStorage (pas une simple variable JS) : une variable se
  // reinitialise a chaque rechargement, donc ne peut pas empecher une CASCADE de
  // rechargements successifs (chacun se croit "le premier") lors d'une vraie mise
  // a jour avec plusieurs evenements controllerchange rapproches.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadControllerAtLoad) return;
    const last = Number(sessionStorage.getItem('dakSwLastReload') || 0);
    const now = Date.now();
    if (now - last < 8000) return;
    sessionStorage.setItem('dakSwLastReload', String(now));
    window.location.reload();
  });
}
</script>
