<style>
  :root {
    --burgundy: #5D1828;
    --burgundy-dark: #3a0f19;
    --gold: #C8A462;
    --gold-light: #dfc28b;
    --white: #FFFFFF;
    --bg-beige: #FBF9F6;
    --text-dark: #2C3E50;
    --text-soft: #7d6a52;
    --success-green: #4CAF50;
    --error-red: #e05555;
    --shadow-card: 0 20px 50px rgba(93, 24, 40, 0.10);
    --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    --tap-size: 48px;
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

  body {
    background: var(--white);
    font-family: "Montserrat", sans-serif;
    color: var(--text-dark);
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(24px + var(--safe-top)) 16px calc(30px + var(--safe-bottom));
    display: flex;
    justify-content: center;
    visibility: hidden;
  }

  button { font: inherit; touch-action: manipulation; cursor: pointer; }

  .ar-text {
    font-family: "Amiri", serif;
    direction: rtl;
    unicode-bidi: isolate;
    line-height: 1.6;
    text-align: center;
  }

  .shell { width: 100%; max-width: 620px; display: flex; flex-direction: column; align-items: center; }

  .brand { text-align: center; margin-bottom: 30px; }
  .brand-ar { font-family: "Amiri", serif; color: var(--gold); font-size: 1.9rem; font-weight: bold; }
  .brand-fr { font-family: "Cinzel", serif; color: var(--burgundy); font-size: 0.74rem; letter-spacing: 4px; text-transform: uppercase; margin-top: 4px; font-weight: 600; }

  /* Bandeau titre — identité DAK, bordeaux dominant, or en simple filet */
  .brand-banner { margin-top: 16px; padding: 10px 4px; border-top: 1px solid var(--burgundy); border-bottom: 1px solid var(--gold); }
  .brand-banner-text { font-family: "Cinzel", serif; font-size: 0.78rem; letter-spacing: 3.5px; color: var(--burgundy); text-transform: uppercase; font-weight: 700; }

  .card {
    background: var(--white);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-card);
    border: 1.5px solid var(--gold);
    width: 100%;
    padding: 36px 28px;
    position: relative;
  }
  .card::before {
    content: ""; position: absolute; top: -1.5px; left: 24px; right: 24px; height: 3px;
    background: var(--gold); border-radius: 0 0 4px 4px;
  }

  .view { display: none; width: 100%; }
  .view.active { display: flex; flex-direction: column; align-items: center; }

  /* ---------- Sélecteur de langue ---------- */
  .lang-toggle { display: flex; gap: 6px; margin-bottom: 24px; }
  .lang-btn {
    border: 1px solid rgba(93,24,40,0.35); background: transparent; color: var(--text-soft);
    font-family: "Cinzel", serif; font-size: 0.68rem; letter-spacing: 1.5px; font-weight: 600;
    padding: 6px 16px; border-radius: 999px; transition: var(--transition-smooth); min-height: 32px;
  }
  .lang-btn.active { background: var(--burgundy); color: var(--white); border-color: var(--burgundy); }

  /* ---------- Écran d'accueil unique ---------- */
  .mode-sub { font-size: 0.96rem; color: var(--text-dark); text-align: center; margin-bottom: 28px; line-height: 1.6; font-weight: 500; }
  .btn-start { width: 100%; max-width: 320px; }

  /* ---------- Motivation : supprimée (parcours unique) ---------- */

  /* ---------- Progression ---------- */
  .progress-wrap { width: 100%; margin-bottom: 26px; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 0.74rem; margin-bottom: 7px; }
  .progress-labels span:first-child { color: var(--burgundy); font-weight: 700; }
  .progress-labels span:last-child { color: var(--burgundy); opacity: 0.75; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.68rem; }
  .progress-track { width: 100%; height: 6px; background: rgba(93,24,40,0.08); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--burgundy) 0%, var(--burgundy) 75%, var(--gold) 100%); border-radius: 999px; transition: width 0.4s ease; width: 0%; }
  .section-icon {
    display: flex; width: 46px; height: 46px; border-radius: 50%; align-items: center; justify-content: center;
    margin: 0 auto 10px; font-size: 1.2rem; background: var(--gold); color: var(--white);
  }
  .section-badge {
    display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--white); background: var(--burgundy); border: 1px solid var(--burgundy); padding: 5px 16px; border-radius: 999px; margin-bottom: 22px;
  }

  /* ---------- Question ---------- */
  #q-content { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .q-prompt-latin {
    font-family: "Cinzel", serif; color: var(--burgundy); font-size: 1.65rem; font-weight: 700; text-align: center;
    letter-spacing: 2.5px; margin-bottom: 8px;
  }
  .q-prompt-word { font-size: clamp(2.4rem, 9vw, 3.4rem); color: var(--burgundy); font-weight: 700; margin-bottom: 6px; }
  .q-prompt-phrase { font-size: clamp(1.5rem, 6vw, 2.1rem); color: var(--burgundy); font-weight: 700; line-height: 1.9; margin-bottom: 6px; }
  .q-audio-row { display: flex; justify-content: center; align-items: center; width: 100%; margin-top: 12px; }
  .q-audio-btn {
    width: var(--tap-size); height: var(--tap-size); border-radius: 50%;
    background: var(--white); border: 1.5px solid var(--gold); color: var(--burgundy);
    display: flex; justify-content: center; align-items: center; font-size: 1.2rem; margin: 0;
    transition: var(--transition-smooth);
  }
  .q-audio-btn:hover { background: var(--gold); color: var(--white); }
  .q-audio-btn.dak-playing { background: var(--gold); border-color: var(--gold); color: var(--white); }

  .q-instruction { font-size: 0.86rem; color: var(--text-dark); text-align: center; margin: 16px 0 22px; font-weight: 500; }

  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .opt-btn {
    background: var(--white); border: 1.5px solid rgba(93,24,40,0.28); border-radius: var(--radius-md);
    padding: 16px 10px; min-height: var(--tap-size);
    font-size: 1.08rem; font-weight: 600; color: var(--text-dark); transition: var(--transition-smooth);
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .opt-btn.opt-ar { font-family: "Amiri", serif; font-size: 1.7rem; font-weight: 700; color: var(--burgundy); direction: rtl; }
  .opt-btn:hover:not(:disabled) { border-color: var(--gold); box-shadow: 0 4px 14px rgba(200,164,98,0.18); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct { background: rgba(76,175,80,0.10); border-color: var(--success-green); color: #2d7a2d; }
  .opt-btn.wrong { background: rgba(224,85,85,0.08); border-color: var(--error-red); color: #b83b3b; }

  /* Micro-animation d'apparition des questions */
  @keyframes popIn { from { opacity: 0; transform: scale(0.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  #q-content, .options-grid { animation: popIn 0.32s ease; }

  /* Message d'encouragement entre deux séries de questions */
  .encouragement-msg {
    display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 70px 10px;
    font-family: "Cinzel", serif; color: var(--burgundy); font-size: 1.25rem; font-weight: 600; text-align: center;
    animation: popIn 0.4s ease; width: 100%;
  }
  .encouragement-msg i { color: var(--gold); font-size: 1.6rem; }

  /* ---------- Résultats ---------- */
  .result-message {
    font-family: "Cinzel", serif; font-size: 1.25rem; font-weight: 700; color: var(--burgundy); text-align: center;
    margin-bottom: 24px; line-height: 1.5;
  }

  .result-block { width: 100%; border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 12px; }
  .result-block-icon { font-size: 0.95rem; margin-right: 8px; }
  .result-block-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
  .result-block-text { font-size: 0.9rem; line-height: 1.55; color: var(--text-dark); }
  .result-block.acquired { background: rgba(76,175,80,0.06); border: 1px solid rgba(76,175,80,0.25); }
  .result-block.acquired .result-block-title { color: #2d7a2d; }
  .result-block.consolidate { background: var(--bg-beige); border: 1px solid rgba(200,164,98,0.35); margin-bottom: 24px; }
  .result-block.consolidate .result-block-title { color: var(--burgundy); }

  .scores-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-soft); margin-bottom: 12px; align-self: flex-start; }
  .breakdown { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 8px; }
  .breakdown-row { display: flex; align-items: center; gap: 12px; }
  .breakdown-label { flex: 0 0 110px; font-size: 0.84rem; color: var(--text-dark); font-weight: 500; }
  .breakdown-bar { flex: 1; height: 8px; background: rgba(200,164,98,0.15); border-radius: 999px; overflow: hidden; }
  .breakdown-bar-fill { height: 100%; background: var(--burgundy); border-radius: 999px; }
  .breakdown-score { flex: 0 0 46px; font-size: 0.84rem; color: var(--burgundy); font-weight: 700; text-align: right; }

  .total-row {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    padding: 16px 0 22px; margin-top: 10px; border-top: 1px solid rgba(200,164,98,0.25);
  }
  .total-label { font-family: "Cinzel", serif; font-size: 0.85rem; color: var(--burgundy); letter-spacing: 1px; font-weight: 700; }
  .total-score { font-family: "Cinzel", serif; font-size: 1.5rem; color: var(--burgundy); font-weight: 700; }
  .total-pct { font-size: 0.85rem; color: var(--gold); font-weight: 700; margin-left: 8px; }

  .recommendation-line {
    width: 100%; text-align: center; font-size: 0.94rem; color: var(--text-dark); line-height: 1.6;
    padding: 18px 8px; margin-bottom: 22px;
  }
  .recommendation-line strong { color: var(--burgundy); font-family: "Cinzel", serif; font-weight: 700; }

  /* ---------- Boutons génériques ---------- */
  .btn-main {
    width: 100%; padding: 16px; border: none; border-radius: 999px;
    background: var(--burgundy); color: var(--white); font-weight: 700; font-size: 0.96rem;
    letter-spacing: 0.5px; transition: var(--transition-smooth); min-height: var(--tap-size);
  }
  .btn-main:hover { background: var(--burgundy-dark); }
  .btn-row { display: flex; gap: 12px; width: 100%; margin-top: 4px; }

  .home-link { margin-top: 22px; color: var(--text-soft); font-size: 0.8rem; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .home-link:hover { color: var(--burgundy); }

  @media (max-width: 480px) {
    .card { padding: 26px 18px; border-radius: var(--radius-lg); }
    .options-grid { grid-template-columns: 1fr; }
    .breakdown-label { flex-basis: 96px; font-size: 0.78rem; }
    .opt-btn { min-height: 52px; }
  }
</style>

<script>
  /* Filet de securite : cette page ne depend jamais du systeme audio.
     Si audio-controller.js est absent/en echec, DAKAudio devient un stub
     inoffensif afin qu'aucun appel audio ne puisse casser la page. */
  if (typeof DAKAudio === "undefined") {
    window.DAKAudio = {
      play: function () {},
      playEffect: function () {},
      stopAll: function () {},
      unlock: function () { return Promise.resolve(false); },
      showToast: function () {}
    };
  }
</script>

<body>
  <div class="shell">

    <div class="brand">
      <div class="brand-ar ar-text">دار الكلمة</div>
      <div class="brand-fr">Dar Al-Kalimah</div>
      <div class="brand-banner"><div class="brand-banner-text" id="brand-banner-text">Test de positionnement</div></div>
    </div>

    <div class="card">

      <!-- VUE 1 : accueil unique -->
      <section class="view active" id="view-mode">
        <div class="lang-toggle">
          <button class="lang-btn active" id="btn-lang-fr" type="button">FR</button>
          <button class="lang-btn" id="btn-lang-es" type="button">ES</button>
        </div>
        <div class="mode-sub" id="mode-sub">Bienvenue ! Ce test dure environ 5 à 10 minutes et nous permet de déterminer le meilleur point de départ pour ton parcours.</div>
        <button class="btn-main btn-start" id="btn-start-test" type="button">Commencer le test</button>
      </section>

      <!-- VUE 2 : question -->
      <section class="view" id="view-question">
        <div class="progress-wrap">
          <div class="progress-labels">
            <span id="progress-current">Question 1 / 30</span>
            <span id="section-name-top"></span>
          </div>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <div class="section-icon" id="section-icon"><i class="fa-solid fa-font" id="section-icon-i"></i></div>
        <div class="section-badge" id="section-badge">Lettres</div>

        <div id="q-content"></div>

        <div class="q-instruction" id="q-instruction"></div>

        <div class="options-grid" id="options-grid"></div>
      </section>

      <!-- VUE 3 : résultats (structure et design INCHANGÉS — seuls les libellés sont i18n) -->
      <section class="view" id="view-results">
        <div class="result-message" id="result-message"></div>

        <div class="result-block acquired" id="result-acquired-block">
          <div class="result-block-title"><i class="fa-solid fa-circle-check result-block-icon"></i><span id="acquired-title-text">Ce qui est acquis</span></div>
          <div class="result-block-text" id="result-acquired-text"></div>
        </div>

        <div class="result-block consolidate" id="result-consolidate-block">
          <div class="result-block-title"><i class="fa-solid fa-seedling result-block-icon"></i><span id="consolidate-title-text">À consolider</span></div>
          <div class="result-block-text" id="result-consolidate-text"></div>
        </div>

        <div class="scores-title" id="scores-title-text">Détail des scores</div>
        <div class="breakdown" id="breakdown"></div>

        <div class="total-row">
          <span class="total-label" id="total-label-text">Score total</span>
          <span><span class="total-score" id="result-total-score">0 / 30</span><span class="total-pct" id="result-total-pct">(0 %)</span></span>
        </div>

        <div class="recommendation-line" id="recommendation-line"></div>

        <div class="btn-row">
          <button class="btn-main" id="btn-go-module" type="button">Commencer ce module</button>
        </div>
        <a class="home-link" href="modules.html"><i class="fa-solid fa-house"></i> <span id="home-link-text">Retour à l'accueil</span></a>
      </section>

    </div>
  </div>

<script>
(() => {
  "use strict";

  /* ============================================================
     BANQUE DE QUESTIONS — 30 questions évaluées, fixes.
     lettres/harakat : indépendantes de la langue (lettres arabes).
     mots/phrases : contenu correct/options fourni en fr ET es ;
     l'arabe et les chemins audio restent identiques dans les deux langues.

     Mot n°1 de la section "mots" : بَيْت/bayt remplacé par قِط/qitt
     car "audio/bayt.mp3" n'existe pas sur le disque (vérifié). "audio/qitt.mp3"
     existe réellement et est le chemin utilisé par la Banque (database.js, id 73).
     ============================================================ */
  const QUESTIONS = {
    lettres: [
      { latin: "ALIF",  correct: "ا", options: ["ا", "ب", "ت", "ث"] },
      { latin: "BA",    correct: "ب", options: ["ب", "ن", "ت", "ي"] },
      { latin: "TA",    correct: "ت", options: ["ت", "ث", "ب", "ن"] },
      { latin: "THA",   correct: "ث", options: ["ث", "ت", "ب", "ن"] },
      { latin: "JIM",   correct: "ج", options: ["ج", "ح", "خ", "د"] },
      { latin: "HA",    correct: "ح", options: ["ح", "ج", "خ", "ع"] },
      { latin: "DAL",   correct: "د", options: ["د", "ذ", "ر", "ز"] },
      { latin: "DHAL",  correct: "ذ", options: ["ذ", "د", "ز", "ر"] },
      { latin: "RA",    correct: "ر", options: ["ر", "ز", "د", "و"] },
      { latin: "SIN",   correct: "س", options: ["س", "ش", "ص", "ن"] },
      { latin: "SHIN",  correct: "ش", options: ["ش", "س", "ص", "ض"] },
      { latin: "AYN",   correct: "ع", options: ["ع", "غ", "ح", "خ"] }
    ],
    harakat: [
      { latin: "BA",  correct: "بَ", options: ["بَ", "بِ", "بُ", "تَ"] },
      { latin: "BI",  correct: "بِ", options: ["بِ", "بَ", "بُ", "نِ"] },
      { latin: "BOU", correct: "بُ", options: ["بُ", "بِ", "بَ", "تُ"] },
      { latin: "TA",  correct: "تَ", options: ["تَ", "تِ", "تُ", "ثَ"] },
      { latin: "TI",  correct: "تِ", options: ["تِ", "تَ", "تُ", "نِ"] },
      { latin: "SA",  correct: "سَ", options: ["سَ", "سِ", "سُ", "شَ"] },
      { latin: "MOU", correct: "مُ", options: ["مُ", "مِ", "مَ", "نُ"] },
      { latin: "LI",  correct: "لِ", options: ["لِ", "لَ", "لُ", "كِ"] }
    ],
    // audio: chemins réellement présents sur le disque et déjà utilisés par la Banque (database.js)
    mots: [
      { arabe: "قِط",   audio: "audio/qitt.mp3",
        fr: { correct: "Chat", options: ["Chien", "Chat", "Oiseau", "Poisson"] },
        es: { correct: "Gato", options: ["Perro", "Gato", "Pájaro", "Pez"] } },
      { arabe: "قَلَم",  audio: "audio/qalam.mp3",
        fr: { correct: "Stylo", options: ["Table", "Stylo", "Chaise", "Fenêtre"] },
        es: { correct: "Bolígrafo", options: ["Mesa", "Bolígrafo", "Silla", "Ventana"] } },
      { arabe: "كِتَاب", audio: "audio/kitab.mp3",
        fr: { correct: "Livre", options: ["Cahier", "Sac", "Livre", "Crayon"] },
        es: { correct: "Libro", options: ["Cuaderno", "Bolsa", "Libro", "Lápiz"] } },
      { arabe: "قَمَر",  audio: "audio/qamar.mp3",
        fr: { correct: "Lune", options: ["Soleil", "Étoile", "Ciel", "Lune"] },
        es: { correct: "Luna", options: ["Sol", "Estrella", "Cielo", "Luna"] } },
      { arabe: "بَحْر",  audio: "audio/bahr.mp3",
        fr: { correct: "Mer", options: ["Rivière", "Mer", "Lac", "Montagne"] },
        es: { correct: "Mar", options: ["Río", "Mar", "Lago", "Montaña"] } },
      { arabe: "وَلَد",  audio: "audio/walad.mp3",
        fr: { correct: "Garçon", options: ["Fille", "Garçon", "Homme", "Enfant (bébé)"] },
        es: { correct: "Niño", options: ["Niña", "Niño", "Hombre", "Bebé"] } }
    ],
    phrases: [
      { arabe: "هٰذَا بَيْتٌ",
        fr: { correct: "Ceci est une maison", options: ["Ceci est une maison", "Voici un livre", "C'est mon stylo", "Où est la maison ?"] },
        es: { correct: "Esto es una casa", options: ["Esto es una casa", "Aquí hay un libro", "Este es mi bolígrafo", "¿Dónde está la casa?"] } },
      { arabe: "الْوَلَدُ يَقْرَأُ",
        fr: { correct: "Le garçon lit", options: ["Le garçon écrit", "Le garçon lit", "Le garçon joue", "Le garçon dort"] },
        es: { correct: "El niño lee", options: ["El niño escribe", "El niño lee", "El niño juega", "El niño duerme"] } },
      { arabe: "أَيْنَ الْقَلَمُ؟",
        fr: { correct: "Où est le stylo ?", options: ["Où est le stylo ?", "Voici le stylo", "J'aime le stylo", "Le stylo est ici"] },
        es: { correct: "¿Dónde está el bolígrafo?", options: ["¿Dónde está el bolígrafo?", "Aquí está el bolígrafo", "Me gusta el bolígrafo", "El bolígrafo está aquí"] } },
      { arabe: "أَنَا أُحِبُّ الْقِرَاءَةَ",
        fr: { correct: "J'aime la lecture", options: ["J'aime écrire", "Je n'aime pas lire", "J'aime la lecture", "J'apprends à lire"] },
        es: { correct: "Me gusta la lectura", options: ["Me gusta escribir", "No me gusta leer", "Me gusta la lectura", "Estoy aprendiendo a leer"] } }
    ]
  };

  const SECTION_ORDER = ["lettres", "harakat", "mots", "phrases"];
  const SECTION_TOTAL = { lettres: 12, harakat: 8, mots: 6, phrases: 4 };
  const SECTION_ICON = { lettres: "fa-font", harakat: "fa-ear-listen", mots: "fa-book-open", phrases: "fa-comments" };

  // Grille de recommandation — logique du "maillon le plus faible" — INCHANGÉE.
  const MODULE_RULES = [
    { test: (s) => s.lettres < 8,  module: "Module 1", href: "module1.html" },
    { test: (s) => s.harakat < 5,  module: "Module 2", href: "module2.html" },
    { test: (s) => s.mots < 4,     module: "Module 3", href: "module3.html" },
    { test: (s) => s.phrases < 2,  module: "Module 6", href: "module6.html" },
    { test: () => true,            module: "Module 7", href: "module7.html" }
  ];

  // Seuil de maîtrise par épreuve (≥75 % = acquis, sinon à consolider) — INCHANGÉ.
  const MASTERY_RATIO = 0.75;

  /* ============================================================
     TEXTES — FR / ES. Parcours unique, basé sur le contenu/ton
     de l'ancienne version "Enfant" validée.
     ============================================================ */
  const TEXT = {
    fr: {
      brandBanner: "Test de positionnement",
      welcomeText: "Bienvenue ! Ce test dure environ 5 à 10 minutes et nous permet de déterminer le meilleur point de départ pour ton parcours.",
      startTest: "Commencer le test",
      listenAria: "Écouter",
      scoresDetail: "Détail des scores",
      scoreTotal: "Score total",
      acquiredTitle: "Ce qui est acquis",
      consolidateTitle: "À consolider",
      startModule: "Commencer ce module",
      backHome: "Retour à l'accueil",
      questionWord: "Question",
      sectionLabels: { lettres: "Lettres", harakat: "Harakāt", mots: "Mots", phrases: "Phrases" },
      instructions: {
        lettres: (l) => `Retrouve la lettre ${l}`,
        harakat: () => "Écoute bien… quelle est la bonne réponse ?",
        mots:    () => "Reconnais-tu ce mot ?",
        phrases: () => "Lis tranquillement cette phrase."
      },
      encouragements: ["Très bien, continue !", "Tu avances super bien.", "Encore quelques étapes !", "Bravo, tu progresses bien !"],
      opening: { high: "Mabrouk ! Tu as déjà de très bonnes bases.", mid: "Mabrouk ! Bien joué, tu progresses bien.", low: "Mabrouk ! Beau travail pour un début — chaque étape compte." },
      skillTexts: {
        acquired: { lettres: "tu reconnais très bien les lettres", harakat: "tu entends bien les harakāt (voyelles courtes)", mots: "tu lis déjà des mots complets", phrases: "tu comprends des phrases simples" },
        consolidate: { lettres: "reconnaître certaines lettres mérite encore un peu d'entraînement", harakat: "les harakāt méritent encore un peu de pratique", mots: "lire des mots complets mérite encore un peu d'entraînement", phrases: "la lecture de phrases mérite encore un peu de pratique pour gagner en fluidité" }
      },
      joinWord: " et ",
      who: "te",
      recommendationTemplate: (module) => `Pour continuer dans de bonnes conditions, nous te recommandons de commencer au <strong>${module}</strong>.`
    },
    es: {
      brandBanner: "Prueba de nivel",
      welcomeText: "¡Bienvenido(a)! Esta prueba dura entre 5 y 10 minutos y nos permite determinar el mejor punto de partida para tu recorrido.",
      startTest: "Empezar la prueba",
      listenAria: "Escuchar",
      scoresDetail: "Detalle de puntuaciones",
      scoreTotal: "Puntuación total",
      acquiredTitle: "Lo que ya dominas",
      consolidateTitle: "A reforzar",
      startModule: "Empezar este módulo",
      backHome: "Volver al inicio",
      questionWord: "Pregunta",
      sectionLabels: { lettres: "Letras", harakat: "Harakat", mots: "Palabras", phrases: "Frases" },
      instructions: {
        lettres: (l) => `Encuentra la letra ${l}`,
        harakat: () => "Escucha bien… ¿cuál es la respuesta correcta?",
        mots:    () => "¿Reconoces esta palabra?",
        phrases: () => "Lee tranquilamente esta frase."
      },
      encouragements: ["¡Muy bien, sigue así!", "Vas muy bien.", "¡Unos pasos más!", "¡Genial, estás progresando!"],
      opening: { high: "¡Mabrouk! Ya tienes muy buenas bases.", mid: "¡Mabrouk! Muy bien, estás progresando.", low: "¡Mabrouk! Buen trabajo para empezar — cada paso cuenta." },
      skillTexts: {
        acquired: { lettres: "reconoces muy bien las letras", harakat: "escuchas bien las harakat (vocales cortas)", mots: "ya lees palabras completas", phrases: "comprendes frases sencillas" },
        consolidate: { lettres: "reconocer algunas letras merece un poco más de práctica", harakat: "las harakat merecen un poco más de práctica", mots: "leer palabras completas merece un poco más de práctica", phrases: "la lectura de frases merece un poco más de práctica para ganar fluidez" }
      },
      joinWord: " y ",
      who: "te",
      recommendationTemplate: (module) => `Para continuar en las mejores condiciones, te recomendamos comenzar en <strong>${module}</strong>.`
    }
  };

  /* ============================================================
     ÉTAT — parcours unique (plus de notion de mode)
     ============================================================ */
  const state = {
    lang: "fr",           // 'fr' | 'es'
    order: [],             // liste ordonnée de {section, index}
    current: 0,
    answers: [],           // { section, correct: bool }
    startTime: null
  };

  SECTION_ORDER.forEach((section) => {
    QUESTIONS[section].forEach((_, i) => state.order.push({ section, index: i }));
  });

  const $ = (id) => document.getElementById(id);
  const views = {
    mode: $("view-mode"),
    question: $("view-question"),
    results: $("view-results")
  };

  function showView(name) {
    Object.values(views).forEach((v) => v.classList.remove("active"));
    views[name].classList.add("active");
  }

  // Mélange Fisher-Yates — recalculé à chaque affichage de question. INCHANGÉ.
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function joinList(list) {
    const t = TEXT[state.lang];
    if (list.length === 0) return "";
    if (list.length === 1) return capitalize(list[0]) + ".";
    const head = list.slice(0, -1).join(", ");
    return capitalize(head) + t.joinWord + list[list.length - 1] + ".";
  }

  /* ============================================================
     LANGUE — bascule complète de l'interface (accueil uniquement)
     ============================================================ */
  function applyStaticTexts() {
    const t = TEXT[state.lang];
    document.documentElement.lang = state.lang;
    $("brand-banner-text").textContent = t.brandBanner;
    $("mode-sub").textContent = t.welcomeText;
    $("btn-start-test").textContent = t.startTest;
    $("scores-title-text").textContent = t.scoresDetail;
    $("total-label-text").textContent = t.scoreTotal;
    $("acquired-title-text").textContent = t.acquiredTitle;
    $("consolidate-title-text").textContent = t.consolidateTitle;
    $("btn-go-module").textContent = t.startModule;
    $("home-link-text").textContent = t.backHome;
  }

  function setLang(lang) {
    state.lang = lang;
    $("btn-lang-fr").classList.toggle("active", lang === "fr");
    $("btn-lang-es").classList.toggle("active", lang === "es");
    applyStaticTexts();
  }

  $("btn-lang-fr").addEventListener("click", () => setLang("fr"));
  $("btn-lang-es").addEventListener("click", () => setLang("es"));
  setLang("fr");

  /* ============================================================
     VUE 1 — ACCUEIL UNIQUE
     ============================================================ */
  $("btn-start-test").addEventListener("click", () => {
    DAKAudio.unlock();
    startTest();
  });

  /* ============================================================
     VUE 2 — QUESTIONS
     ============================================================ */
  function startTest() {
    state.current = 0;
    state.answers = [];
    state.startTime = Date.now();
    showView("question");
    renderQuestion();
  }

  // Renvoie la question avec correct/options dans la langue active (mots/phrases) ;
  // lettres/harakat sont indépendantes de la langue et renvoyées telles quelles.
  function localizeQuestion(section, q) {
    if (section === "mots" || section === "phrases") {
      const loc = q[state.lang];
      return { arabe: q.arabe, audio: q.audio, correct: loc.correct, options: loc.options };
    }
    return q;
  }

  function renderQuestion() {
    DAKAudio.stopAll();
    const t = TEXT[state.lang];
    const { section, index } = state.order[state.current];
    const q = localizeQuestion(section, QUESTIONS[section][index]);

    $("progress-current").textContent = `${t.questionWord} ${state.current + 1} / 30`;
    $("section-name-top").textContent = t.sectionLabels[section];
    $("progress-fill").style.width = `${(state.current / 30) * 100}%`;
    $("section-badge").textContent = t.sectionLabels[section];
    $("section-icon-i").className = "fa-solid " + SECTION_ICON[section];
    $("q-instruction").textContent = t.instructions[section](q.latin);

    const content = $("q-content");
    const grid = $("options-grid");
    let optionClass = "opt-btn";

    if (section === "lettres" || section === "harakat") {
      content.innerHTML = `<div class="q-prompt-latin">${q.latin}</div>`;
      optionClass += " opt-ar";
    } else if (section === "mots") {
      content.innerHTML = `
        <div class="q-prompt-word ar-text">${q.arabe}</div>
        <div class="q-audio-row"><button class="q-audio-btn" id="q-audio-btn" type="button" aria-label="${t.listenAria}"><i class="fa-solid fa-volume-high"></i></button></div>`;
      $("q-audio-btn").addEventListener("click", (e) => DAKAudio.play(q.audio, e.currentTarget));
    } else if (section === "phrases") {
      content.innerHTML = `<div class="q-prompt-phrase ar-text">${q.arabe}</div>`;
    }

    // Mélange aléatoire des 4 propositions à chaque question — jamais de position fixe. INCHANGÉ.
    const shuffledOptions = shuffle(q.options);

    grid.innerHTML = "";
    shuffledOptions.forEach((opt) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = optionClass;
      btn.textContent = opt;
      btn.addEventListener("click", () => handleAnswer(opt === q.correct, btn, q.correct));
      grid.appendChild(btn);
    });
  }

  // Petite pause encourageante entre deux séries de questions.
  // Ne révèle jamais si les réponses précédentes étaient correctes.
  function showEncouragement(next) {
    const t = TEXT[state.lang];
    const msg = t.encouragements[Math.floor(Math.random() * t.encouragements.length)];
    $("q-content").innerHTML = `<div class="encouragement-msg"><i class="fa-solid fa-star"></i><span>${msg}</span></div>`;
    $("q-instruction").textContent = "";
    $("options-grid").innerHTML = "";
    setTimeout(next, 1200);
  }

  // Garde anti-double-clic : un seul clic pris en compte par question,
  // tous les boutons désactivés pendant la transition. INCHANGÉ.
  let answering = false;
  function handleAnswer(isCorrect, btnEl, correctText) {
    if (answering) return;
    answering = true;

    const { section } = state.order[state.current];
    state.answers.push({ section, correct: isCorrect });

    const allBtns = document.querySelectorAll("#options-grid .opt-btn");
    allBtns.forEach((b) => {
      b.disabled = true;
      if (b.textContent === correctText) b.classList.add("correct");
    });
    if (!isCorrect) btnEl.classList.add("wrong");

    setTimeout(() => {
      answering = false;
      if (state.current < 29) {
        const prevSection = state.order[state.current].section;
        state.current++;
        const nextSection = state.order[state.current].section;
        if (nextSection !== prevSection) {
          showEncouragement(renderQuestion);
        } else {
          renderQuestion();
        }
      } else {
        finishTest();
      }
    }, 900);
  }

  /* ============================================================
     VUE 3 — RÉSULTATS (structure/design INCHANGÉS, texte i18n)
     ============================================================ */
  function buildOpeningMessage(pct) {
    const o = TEXT[state.lang].opening;
    if (pct >= 80) return o.high;
    if (pct >= 50) return o.mid;
    return o.low;
  }

  function buildSkillLists(scores) {
    const texts = TEXT[state.lang].skillTexts;
    const acquired = [];
    const consolidate = [];
    SECTION_ORDER.forEach((section) => {
      const ratio = scores[section] / SECTION_TOTAL[section];
      if (ratio >= MASTERY_RATIO) acquired.push(texts.acquired[section]);
      else consolidate.push(texts.consolidate[section]);
    });
    return { acquired, consolidate };
  }

  function finishTest() {
    DAKAudio.stopAll();
    const t = TEXT[state.lang];

    const scores = { lettres: 0, harakat: 0, mots: 0, phrases: 0 };
    state.answers.forEach((a) => { if (a.correct) scores[a.section]++; });

    const total = scores.lettres + scores.harakat + scores.mots + scores.phrases;
    const pct = Math.round((total / 30) * 100);

    const rule = MODULE_RULES.find((r) => r.test(scores));
    const { acquired, consolidate } = buildSkillLists(scores);

    // A. Message positif
    $("result-message").textContent = buildOpeningMessage(pct);

    // B. Ce qui est acquis
    const acquiredBlock = $("result-acquired-block");
    if (acquired.length > 0) {
      acquiredBlock.style.display = "";
      $("result-acquired-text").textContent = joinList(acquired);
    } else {
      acquiredBlock.style.display = "none";
    }

    // C. Ce qu'il reste à consolider
    const consolidateBlock = $("result-consolidate-block");
    if (consolidate.length > 0) {
      consolidateBlock.style.display = "";
      $("result-consolidate-text").textContent = joinList(consolidate);
    } else {
      consolidateBlock.style.display = "none";
    }

    // Détail des scores — structure INCHANGÉE, libellés i18n
    const breakdown = $("breakdown");
    breakdown.innerHTML = "";
    SECTION_ORDER.forEach((section) => {
      const score = scores[section];
      const outOf = SECTION_TOTAL[section];
      const row = document.createElement("div");
      row.className = "breakdown-row";
      row.innerHTML = `
        <div class="breakdown-label">${t.sectionLabels[section]}</div>
        <div class="breakdown-bar"><div class="breakdown-bar-fill" style="width:${(score/outOf)*100}%"></div></div>
        <div class="breakdown-score">${score} / ${outOf}</div>`;
      breakdown.appendChild(row);
    });

    $("result-total-score").textContent = `${total} / 30`;
    $("result-total-pct").textContent = `(${pct} %)`;

    // D. Recommandation — en dernier, intégrée dans une phrase, jamais le message principal. INCHANGÉ dans sa logique.
    const moduleLabel = state.lang === "es" ? rule.module.replace("Module", "Módulo") : rule.module;
    $("recommendation-line").innerHTML = t.recommendationTemplate(moduleLabel);
    $("btn-go-module").onclick = () => { window.location.href = rule.href; };

    // Confettis + son Mabrouk — déclenchés ensemble, brefs, non bloquants. Page de résultats non redessinée par ailleurs.
    if (typeof confetti === "function") {
      confetti({ particleCount: 60, spread: 60, startVelocity: 32, ticks: 160, origin: { y: 0.55 }, colors: ["#C8A462", "#5D1828", "#dfc28b"] });
    }
    DAKAudio.playEffect("mabruk.mp3");

    showView("results");
    saveResult(scores, total, pct, rule.module);
  }

  /* ============================================================
     FIREBASE — enregistrement du résultat.
     Même config que le reste du site (auth.html / tracker.js), sans y toucher.
     Champs alignés sur la demande de finalisation : testNiveauFait, niveauDepart,
     dateTest, langue + les scores existants. L'ancien champ "mode" (Enfant/Adulte)
     est retiré car le parcours est désormais unique ; "date"/"moduleRecommande"
     sont renommés dateTest/niveauDepart pour les PROCHAINS enregistrements
     uniquement — aucun document déjà existant n'est modifié ni supprimé.
     ============================================================ */
  async function saveResult(scores, total, pct, moduleRecommande) {
    try {
      const { getApps, initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
      const { getAuth } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
      const { getFirestore, doc, setDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");

      const cfg = {
        apiKey: "AIzaSyBz5vRQUf4N7Px0YR4csyOlk72s1eOLLHQ",
        authDomain: "dar-al-kalimah.firebaseapp.com",
        projectId: "dar-al-kalimah",
        storageBucket: "dar-al-kalimah.firebasestorage.app",
        messagingSenderId: "472629258",
        appId: "1:472629258:web:29b755d38efe89421f1ff3"
      };
      const app = getApps().length ? getApps()[0] : initializeApp(cfg);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const user = auth.currentUser;
      if (!user) return;

      const dureeSecondes = Math.round((Date.now() - state.startTime) / 1000);

      await setDoc(doc(db, "eleves", user.uid), {
        testPositionnement: {
          testNiveauFait: true,
          langue: state.lang,
          lettres: scores.lettres,
          harakat: scores.harakat,
          mots: scores.mots,
          phrases: scores.phrases,
          scoreTotal: total,
          pourcentage: pct,
          niveauDepart: moduleRecommande,
          dureeSecondes: dureeSecondes,
          dateTest: serverTimestamp()
        }
      }, { merge: true });

      if (window.DAK_enregistrerScore) {
        window.DAK_enregistrerScore({ module: "Test de positionnement", quiz: "Positionnement", score: total, total: 30 });
      }
    } catch (e) {
      console.error("Erreur enregistrement test de positionnement:", e);
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) DAKAudio.stopAll();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch((err) => console.error('SW registration failed:', err));
  let dakSwRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (dakSwRefreshing) return;
    dakSwRefreshing = true;
    window.location.reload();
  });
}
</script>
