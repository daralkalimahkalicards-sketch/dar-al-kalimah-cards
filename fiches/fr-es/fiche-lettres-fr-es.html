<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dar Al-Kalimah - Fiche des lettres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bordeaux:#5D1828; --bordeaux-dark:#3a0f19; --gold:#C8A462; --gold-light:#dfc28b;
  --ink:#2b1a1e; --muted:#6f5a5f; --white:#ffffff;
  --radius-xl:28px; --radius-lg:22px; --radius-md:18px; --radius-sm:12px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Montserrat',sans-serif;color:var(--ink);background:#fff;
  line-height:1.55;padding:calc(18px + var(--safe-top)) 16px calc(40px + var(--safe-bottom));
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(circle at 12% 18%, rgba(200,164,98,0.13), transparent 26%),
    radial-gradient(circle at 88% 12%, rgba(93,24,40,0.08), transparent 28%),
    radial-gradient(circle at 50% 92%, rgba(200,164,98,0.10), transparent 34%);
}
.ar{font-family:'Amiri',serif;direction:rtl;unicode-bidi:isolate;
  font-feature-settings:"liga" 1,"calt" 1,"mark" 1,"mkmk" 1;}
.wrap{max-width:920px;margin:0 auto}

/* ---------- En-tête ---------- */
.hero{
  position:relative;background:linear-gradient(160deg,var(--bordeaux),var(--bordeaux-dark));
  border-radius:var(--radius-xl);padding:30px 26px 28px;color:#fff;text-align:center;
  box-shadow:0 18px 40px rgba(58,15,25,0.22);
}
.hero::before{content:"";position:absolute;inset:10px;border:1px solid rgba(200,164,98,0.32);
  border-radius:20px;pointer-events:none}
.brand-ar{font-size:2.3rem;color:var(--gold);line-height:1.5}
.brand{font-family:'Cinzel',serif;letter-spacing:.22em;font-size:.72rem;color:var(--gold-light);text-transform:uppercase}
.hero h1{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(1.45rem,4.6vw,2.15rem);margin:14px 0 6px;letter-spacing:.04em}
.hero p{color:rgba(255,255,255,.86);font-size:.95rem;max-width:560px;margin:0 auto}
.lang{
  position:relative;z-index:2;display:inline-flex;margin-top:18px;padding:4px;border-radius:999px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(200,164,98,0.32);backdrop-filter:blur(8px);
}
.lang button{
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.12em;
  border:0;background:transparent;color:var(--gold-light);padding:9px 22px;border-radius:999px;cursor:pointer;
  transition:background .2s,color .2s;
}
.lang button.on{background:linear-gradient(90deg,var(--gold-light),var(--gold));color:var(--bordeaux-dark)}

/* ---------- Devise ---------- */
.motto{
  margin:20px 0;padding:16px 20px;border-radius:var(--radius-md);background:#fff;
  border:1px solid rgba(200,164,98,0.45);display:flex;gap:14px;align-items:center;
  box-shadow:0 8px 22px rgba(93,24,40,0.06);font-weight:600;color:var(--bordeaux);
}
.motto i{color:var(--gold);font-size:1.3rem}

/* ---------- Cartes ---------- */
.card{
  position:relative;background:#fff;border-radius:var(--radius-lg);padding:26px 22px 22px;margin-bottom:20px;
  border:1px solid rgba(200,164,98,0.35);box-shadow:0 10px 28px rgba(93,24,40,0.07);
}
.card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(200,164,98,0.16);
  border-radius:16px;pointer-events:none}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.num{
  flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--bordeaux);color:var(--gold);font-family:'Cinzel',serif;font-weight:700;
}
.card h2{font-family:'Cinzel',serif;font-size:clamp(1.02rem,3.4vw,1.25rem);color:var(--bordeaux);letter-spacing:.03em;line-height:1.3}
.intro{color:var(--muted);font-size:.93rem;margin:4px 0 16px}

/* ---------- Lignes de lettres ---------- */
.row{
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.6fr);gap:14px;align-items:center;
  padding:12px 0;border-top:1px dashed rgba(200,164,98,0.45);
}
.row:first-of-type{border-top:0}
.id{display:flex;align-items:center;gap:14px;min-width:0}
.big{
  flex:none;width:74px;height:74px;border-radius:var(--radius-md);display:grid;place-items:center;
  background:var(--bordeaux);color:#fff;font-size:2.7rem;line-height:1;padding-bottom:10px;
  box-shadow:inset 0 0 0 1px rgba(200,164,98,0.5);
}
.clue{font-weight:600;font-size:.93rem;color:var(--ink)}
.clue small{display:block;font-weight:500;color:var(--muted);font-size:.82rem;margin-top:2px}
.tag{
  display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 10px;border-radius:999px;
  font-size:.72rem;font-weight:600;color:var(--bordeaux);background:rgba(200,164,98,0.16);
  border:1px solid rgba(200,164,98,0.45);
}
.tag i{color:var(--gold)}
.forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;direction:rtl}
.form{
  direction:ltr;background:#fff;border:1px solid rgba(200,164,98,0.5);border-radius:var(--radius-sm);
  text-align:center;padding:6px 4px 4px;
}
.form b{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.form span{display:block;font-size:2.3rem;line-height:1.7;color:var(--bordeaux)}

/* Ligne d'écriture + schémas */
.form{position:relative;z-index:0;overflow:hidden}
.bl{display:inline-block;width:0;height:0;position:relative;vertical-align:baseline}
.bl::after{content:"";position:absolute;z-index:-1;left:-200px;width:400px;top:0;border-top:1.5px dashed rgba(200,164,98,.8)}
.sch{flex:none;width:52px;height:44px}
.sch .ln{stroke:var(--gold);stroke-width:1.4;stroke-dasharray:3 3}
.sch .st{fill:none;stroke:var(--bordeaux);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sch .dt{fill:var(--gold)}
/* Exemple + son */
.ex{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 14px;
  border-radius:var(--radius-sm);background:rgba(200,164,98,0.09);font-size:.86rem}
.ex b{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-right:8px}
.ex .ar{font-size:1.75rem;line-height:1.2;color:var(--bordeaux);margin-right:8px}
.ex > span{display:inline-block;line-height:1.5}
.ex .ar{vertical-align:middle}
.ex em{font-style:normal;font-weight:700;color:var(--bordeaux)}
/* Indicateur de points */
.pts{flex:none;display:inline-flex;flex-direction:column;align-items:center;gap:4px;width:40px}
.pts .bar{width:32px;height:11px;border:2px solid var(--bordeaux);border-top:0;border-radius:0 0 14px 14px}
.pts .bar.head{position:relative}
.pts .bar.head::after{content:"";position:absolute;right:-3px;top:-9px;width:11px;height:11px;border:2px solid var(--bordeaux);border-radius:50%;background:#fff}
.pts .bar.teeth{border-top:0;background:
  linear-gradient(var(--bordeaux),var(--bordeaux)) 33% 0/2px 7px no-repeat,
  linear-gradient(var(--bordeaux),var(--bordeaux)) 66% 0/2px 7px no-repeat}
.pts .d{display:flex;gap:3px;min-height:6px}
.pts .d i{width:6px;height:6px;border-radius:50%;background:var(--gold)}

.note{
  margin-top:14px;padding:12px 14px;border-radius:var(--radius-sm);background:rgba(200,164,98,0.10);
  border-left:3px solid var(--gold);font-size:.9rem;color:var(--ink);display:flex;gap:10px;
}
.note i{color:var(--gold);margin-top:3px}
.note .ar{font-size:1.5rem;line-height:1;color:var(--bordeaux);padding:0 2px}

/* Comparaisons */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.duo > div{border:1px solid rgba(200,164,98,0.5);border-radius:var(--radius-md);text-align:center;padding:10px 8px 12px;background:#fff}
.duo > div > .ar{display:block;font-size:3rem;line-height:1.7;color:var(--bordeaux)}
.duo p .ar{font-size:1.5rem;line-height:1;color:var(--bordeaux)}
.duo p{font-size:.86rem;font-weight:600}
.duo small{display:block;color:var(--muted);font-weight:500;font-size:.8rem}

/* Mémo */
.memo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.memo > div{
  display:flex;align-items:center;gap:10px;border:1px solid rgba(200,164,98,0.5);border-radius:var(--radius-md);
  padding:10px 12px;background:#fff;
}
.memo .txt{flex:1;font-size:.8rem;font-weight:600;line-height:1.3}
.memo .ar{font-size:2.3rem;line-height:1.3;color:var(--bordeaux);padding-bottom:8px}

/* Pyramide */
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px}
.pyr span{
  font-size:2.1rem;line-height:1.7;color:var(--bordeaux);border:1px solid rgba(200,164,98,0.5);
  border-radius:999px;padding:0 26px;background:#fff;min-width:90px;text-align:center;
}
.pyr span:last-child{background:var(--bordeaux);color:#fff;border-color:var(--gold)}
.pyr i{color:var(--gold);font-size:.8rem}

footer{text-align:center;margin-top:26px;color:var(--muted);font-size:.8rem}
footer .ar{display:block;font-size:1.6rem;color:var(--bordeaux)}
footer b{font-family:'Cinzel',serif;color:var(--bordeaux);letter-spacing:.12em}

@media (max-width:768px){
  .row{grid-template-columns:1fr}
  .memo{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){
  body{padding-left:12px;padding-right:12px}
  .hero{padding:26px 18px 24px}
  .card{padding:22px 16px 18px}
  .big{width:64px;height:64px;font-size:2.3rem}
  .form span{font-size:2rem}
  .memo{grid-template-columns:1fr}
}
@media (max-width:360px){
  .brand-ar{font-size:1.9rem}
  .big{width:56px;height:56px;font-size:2rem}
  .form span{font-size:1.75rem}
  .duo > div > .ar{font-size:2.4rem}
}
@media print{
  body{padding:0}
  body::before,.lang{display:none}
  .hero,.big,.num,.pyr span:last-child{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hero,.card,.motto{box-shadow:none}
  .card,.row,.memo > div,.duo{break-inside:avoid}
}

/* ---------- Boutons d'écoute (lettre + mot d'exemple) ---------- */
.snd-btn{
  flex:none;display:inline-grid;place-items:center;width:40px;height:40px;padding:0;
  border:1.5px solid var(--gold);border-radius:999px;background:#fff;color:var(--gold);
  font-size:1rem;line-height:1;cursor:pointer;vertical-align:middle;
  -webkit-tap-highlight-color:transparent;transition:background .2s,color .2s,transform .1s;
}
.snd-btn.sm{width:34px;height:34px;font-size:.85rem;margin-right:8px}
.snd-btn:active{transform:scale(.94)}
.snd-btn:focus-visible{outline:2px solid var(--bordeaux);outline-offset:2px}
.snd-btn.dak-playing{background:var(--gold);color:#fff}
.dak-toast{
  position:fixed;left:50%;bottom:calc(24px + var(--safe-bottom));transform:translate(-50%,12px);
  max-width:calc(100vw - 32px);padding:10px 18px;border-radius:999px;background:var(--bordeaux);color:#fff;
  border:1px solid var(--gold);font-size:.85rem;font-weight:600;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;
}
.dak-toast.show{opacity:1;transform:translate(-50%,0)}
@media print{
  .snd-btn,.dak-toast{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="brand-ar ar">دَارُ الْكَلِمَة</div>
    <div class="brand">Dar Al-Kalimah · Kalicards</div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
    <div class="lang" role="group" aria-label="Langue / Idioma">
      <button type="button" data-lang="fr" class="on">FR</button>
      <button type="button" data-lang="es">ES</button>
    </div>
  </header>

  <div class="motto"><i class="fa-solid fa-lightbulb"></i><span data-i18n="motto"></span></div>

  <main id="cards"></main>

  <footer>
    <span class="ar">دَارُ الْكَلِمَة</span>
    <b>DAR AL-KALIMAH</b><br>
    <span data-i18n="footer"></span>
  </footer>
</div>

<script>
/* ===================== TEXTES FR / ES ===================== */
const T = {
  fr:{
    title:"Fiche des lettres",
    subtitle:"Reconnaître chaque lettre au début, au milieu et à la fin du mot",
    motto:"Ne te complique pas la vie : regarde les points, la tête, les dents. C'est tout.",
    footer:"Méthode Kalicards · 15 minutes par jour, lettre par lettre.",
    deb:"Début", mil:"Milieu", fin:"Fin",
    noLeft:"ne s'accroche pas à gauche", ex:"Exemple", snd:"Le son",
    listenL:"Écouter la lettre", listenW:"Écouter le mot", noAudio:"Audio non disponible pour le moment."
  },
  es:{
    title:"Ficha de las letras",
    subtitle:"Reconocer cada letra al inicio, en medio y al final de la palabra",
    motto:"No te compliques la vida: mira los puntos, la cabeza, los dientes. Nada más.",
    footer:"Método Kalicards · 15 minutos al día, letra por letra.",
    deb:"Inicio", mil:"Medio", fin:"Final",
    noLeft:"no se une por la izquierda", ex:"Ejemplo", snd:"El sonido",
    listenL:"Escuchar la letra", listenW:"Escuchar la palabra", noAudio:"Audio no disponible por el momento."
  }
};
const A = s => `<span class="ar">${s}</span>`;

/* ===================== CONTENU ===================== */
/* row : l = lettre seule, f = [début, milieu, fin], p = [nb points, 'up'|'down', 'head'|'teeth'|''], solo = ne s'accroche pas à gauche */
const CARDS = [
  {
    h:{fr:"Même forme, seuls les points changent", es:"Misma forma, solo cambian los puntos"},
    intro:{fr:"Cinq lettres qui se ressemblent. Tu comptes les points et tu regardes s'ils sont en haut ou en bas.",
           es:"Cinco letras que se parecen. Cuentas los puntos y miras si están arriba o abajo."},
    rows:[
      {l:"ب", f:["بـ","ـبـ","ـب"], p:[1,"down",""], c:{fr:"1 point en bas", es:"1 punto abajo"}},
      {l:"ت", f:["تـ","ـتـ","ـت"], p:[2,"up",""],   c:{fr:"2 points en haut", es:"2 puntos arriba"}},
      {l:"ث", f:["ثـ","ـثـ","ـث"], p:[3,"up",""],   c:{fr:"3 points en haut", es:"3 puntos arriba"}, s:{fr:"On sort un peu la langue.", es:"Se saca un poco la lengua."}},
      {l:"ن", f:["نـ","ـنـ","ـن"], p:[1,"up",""],   c:{fr:"1 point en haut", es:"1 punto arriba"}},
      {l:"ي", f:["يـ","ـيـ","ـي"], p:[2,"down",""], c:{fr:"2 points en bas", es:"2 puntos abajo"}, s:{fr:"La seule de tout l'alphabet.", es:"La única de todo el alfabeto."}}
    ],
    note:{fr:"Au début et au milieu, c'est la même chose : la lettre reste ouverte pour que la suivante s'accroche. À la fin, elle se ferme. "+A("ن")+" et "+A("ي")+" changent de forme à la fin.",
          es:"Al inicio y en medio es lo mismo: la letra queda abierta para que la siguiente se enganche. Al final, se cierra. "+A("ن")+" y "+A("ي")+" cambian de forma al final."}
  },
  {
    h:{fr:"Les lettres qui ont une tête", es:"Las letras que tienen cabeza"},
    intro:{fr:"La tête, c'est la petite boucle. Tu la vois ? Alors tu comptes les points.",
           es:"La cabeza es el pequeño lazo. ¿La ves? Entonces cuentas los puntos."},
    rows:[
      {l:"ف", f:["فـ","ـفـ","ـف"], g:"fa", c:{fr:"Une tête + 1 point", es:"Una cabeza + 1 punto"}},
      {l:"ق", f:["قـ","ـقـ","ـق"], g:"qaf", c:{fr:"Une tête + 2 points", es:"Una cabeza + 2 puntos"}, s:{fr:"Le son sort du fond de la gorge.", es:"El sonido sale del fondo de la garganta."}},
      {l:"م", f:["مـ","ـمـ","ـم"], g:"mim", c:{fr:"Une tête ronde posée sur la ligne, pas de point", es:"Una cabeza redonda sobre la línea, sin punto"}, s:{fr:"Au début et au milieu, elle reste sur la ligne. À la fin, la queue tombe tout droit.", es:"Al inicio y en medio, se queda sobre la línea. Al final, la cola cae recta."}},
      {l:"و", f:["و","ـو","ـو"],   g:"waw", solo:true, c:{fr:"Seule la boucle est sur la ligne", es:"Solo el lazo está sobre la línea"}, s:{fr:"Tout le reste descend en dessous.", es:"Todo lo demás baja por debajo."}}
    ],
    note:{fr:"Pas de tête et 2 points en haut : c'est "+A("ت")+". Une tête et 2 points en haut : c'est "+A("ق")+".",
          es:"Sin cabeza y 2 puntos arriba: es "+A("ت")+". Con cabeza y 2 puntos arriba: es "+A("ق")+"."}
  },
  {
    h:{fr:"Avec ou sans point", es:"Con o sin punto"},
    intro:{fr:"Même dessin, un seul point fait la différence.", es:"Mismo dibujo, un solo punto marca la diferencia."},
    rows:[
      {l:"ع", f:["عـ","ـعـ","ـع"], c:{fr:"Pas de point", es:"Sin punto"}},
      {l:"غ", f:["غـ","ـغـ","ـغ"], c:{fr:"1 point en haut", es:"1 punto arriba"}}
    ],
    note:{fr:"Au milieu, la lettre se ferme. À la fin : attachée elle reste fermée "+A("ـع")+", non attachée elle revient à sa forme initiale "+A("ع")+".",
          es:"En medio, la letra se cierra. Al final: unida sigue cerrada "+A("ـع")+", sin unir vuelve a su forma inicial "+A("ع")+"."}
  },
  {
    h:{fr:"La même famille, trois lettres", es:"La misma familia, tres letras"},
    intro:{fr:"La même règle s'applique aux trois. Regarde où est le point.", es:"La misma regla se aplica a las tres. Mira dónde está el punto."},
    rows:[
      {l:"ج", f:["جـ","ـجـ","ـج"], c:{fr:"1 point en bas", es:"1 punto abajo"}},
      {l:"ح", f:["حـ","ـحـ","ـح"], c:{fr:"Pas de point", es:"Sin punto"}},
      {l:"خ", f:["خـ","ـخـ","ـخ"], c:{fr:"1 point en haut", es:"1 punto arriba"}}
    ],
    duo:[
      {a:"ـعـ", t:{fr:"Fermée", es:"Cerrada"}, s:{fr:"au milieu, on la ferme", es:"en medio, se cierra"}},
      {a:"ـحـ", t:{fr:"Ouverte", es:"Abierta"}, s:{fr:"au milieu, on la laisse ouverte", es:"en medio, se deja abierta"}}
    ]
  },
  {
    h:{fr:"Les grandes lettres", es:"Las letras altas"},
    intro:{fr:"Trois lettres hautes qu'on confond souvent.", es:"Tres letras altas que se confunden a menudo."},
    rows:[
      {l:"ك", f:["كـ","ـكـ","ـك"], c:{fr:"Elle change de forme", es:"Cambia de forma"}, s:{fr:"La forme qu'on voit partout n'est que celle de la fin.", es:"La forma que se ve en todas partes es solo la del final."}},
      {l:"ل", f:["لـ","ـلـ","ـل"], c:{fr:"S'accroche à droite et à gauche", es:"Se une por la derecha y por la izquierda"}, s:{fr:"Elle a ses petites mains des deux côtés.", es:"Tiene sus manitas a los dos lados."}},
      {l:"ا", f:["ا","ـا","ـا"], solo:true, c:{fr:"Un bâton droit", es:"Un palo recto"}, s:{fr:"Avec une fatha, on lit « a ».", es:"Con una fatha, se lee « a »."}}
    ],
    note:{fr:A("ل")+" suivie de "+A("ا")+" s'écrivent ensemble : "+A("لا")+".",
          es:A("ل")+" seguida de "+A("ا")+" se escriben juntas: "+A("لا")+"."}
  },
  {
    h:{fr:"Avec ou sans dents", es:"Con o sin dientes"},
    intro:{fr:"Trois petites dents, ou une forme pleine et lisse.", es:"Tres dientecitos, o una forma llena y lisa."},
    rows:[
      {l:"س", f:["سـ","ـسـ","ـس"], p:[0,"up","teeth"], c:{fr:"3 petites dents, pas de point", es:"3 dientecitos, sin punto"}},
      {l:"ش", f:["شـ","ـشـ","ـش"], p:[3,"up","teeth"], c:{fr:"3 petites dents + 3 points", es:"3 dientecitos + 3 puntos"}},
      {l:"ص", f:["صـ","ـصـ","ـص"], c:{fr:"Pas de dents, pas de point", es:"Sin dientes, sin punto"}, s:{fr:"Sa forme est grosse : le son remplit la bouche.", es:"Su forma es gruesa: el sonido llena la boca."}},
      {l:"ض", f:["ضـ","ـضـ","ـض"], c:{fr:"La même, avec 1 point", es:"La misma, con 1 punto"}},

/* Lecteur unique réutilisé (même logique que audio-controller.js) : lecture déclenchée par le clic,
   un clic coupe toujours le son en cours, état visuel .dak-playing, pas de faux message sur
   AbortError / NotAllowedError. */
const player = new Audio();
player.preload = "none";
player.playsInline = true;
let currentBtn = null, playToken = 0, toastTimer = null;

function releaseBtn(){ if (currentBtn) currentBtn.classList.remove("dak-playing"); currentBtn = null; }
function showToast(){
  let t = document.getElementById("dak-toast");
  if (!t){ t = document.createElement("div"); t.id = "dak-toast"; t.className = "dak-toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = T[lang].noAudio;
  clearTimeout(toastTimer);
  t.classList.add("show");
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}
function playSound(src, btn){
  const myToken = ++playToken;
  player.pause();
  player.currentTime = 0;
  if (currentBtn && currentBtn !== btn) currentBtn.classList.remove("dak-playing");
  if (!src){ releaseBtn(); showToast(); return; }
  currentBtn = btn || null;
  if (currentBtn) currentBtn.classList.add("dak-playing");
  player.src = src;
  player.load();
  const p = player.play();
  if (p !== undefined) p.catch(err => {
    if (myToken !== playToken) return;
    releaseBtn();
    if (err && (err.name === "AbortError" || err.name === "NotAllowedError")) return;
    showToast();
  });
}
player.addEventListener("ended", releaseBtn);
document.addEventListener("visibilitychange", () => { if (document.hidden){ player.pause(); player.currentTime = 0; releaseBtn(); } });

const soundBtn = (file, label, small) => file
  ? `<button type="button" class="snd-btn${small ? " sm" : ""}" data-src="${AUDIO_BASE}${file}" aria-label="${label}"><i class="fa-solid fa-volume-high" aria-hidden="true"></i></button>`
  : "";

/* ===================== RENDU ===================== */
let lang = "fr";
try { const s = localStorage.getItem("dak_fiche_lettres_lang"); if (s === "fr" || s === "es") lang = s; } catch(_) {}

function pts(p){
  if (!p) return "";
  const dots = `<span class="d">${"<i></i>".repeat(p[0])}</span>`;
  const bar  = `<span class="bar ${p[2] || ""}"></span>`;
  return `<span class="pts" aria-hidden="true">${p[1] === "up" ? dots + bar : bar + dots}</span>`;
}

function render(){
  const L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = L[el.dataset.i18n]; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));

  document.getElementById("cards").innerHTML = CARDS.map((c, i) => {
    let html = `<section class="card"><div class="card-head"><div class="num">${i + 1}</div><h2>${c.h[lang]}</h2></div>`;
    html += `<p class="intro">${c.intro[lang]}</p>`;

    if (c.rows) html += c.rows.map(r => `
      <div class="row">
        <div class="id">
          <div class="big ar">${r.l}</div>
          ${soundBtn(LETTER_AUDIO[r.l], L.listenL + " " + r.l)}
          ${r.g ? SCH[r.g] : pts(r.p)}
          <div class="clue">${r.c[lang]}${r.s ? `<small>${r.s[lang]}</small>` : ""}
            ${r.solo ? `<span class="tag"><i class="fa-solid fa-link-slash"></i>${L.noLeft}</span>` : ""}
          </div>
        </div>
        <div class="forms">
          <div class="form"><b>${L.deb}</b><span class="ar">${r.f[0]}<i class="bl"></i></span></div>
          <div class="form"><b>${L.mil}</b><span class="ar">${r.f[1]}<i class="bl"></i></span></div>
          <div class="form"><b>${L.fin}</b><span class="ar">${r.f[2]}<i class="bl"></i></span></div>
        </div>
        ${EX[r.l] ? `<div class="ex"><span><b>${L.ex}</b><span class="ar">${EX[r.l].w}</span>${soundBtn(WORD_AUDIO[r.l], L.listenW + " " + EX[r.l].w, true)}${EX[r.l].m[lang]}</span><span><b>${L.snd}</b>${EX[r.l].s[lang]}</span></div>` : ""}
      </div>`).join("");

    if (c.duo) html += `<div class="duo">${c.duo.map(d =>
      `<div><span class="ar">${d.a}</span><p>${d.t[lang]}<small>${d.s[lang]}</small></p></div>`).join("")}</div>`;

    if (c.memo) html += `<div class="memo">${c.memo.map(m =>
      `<div>${m.g ? SCH[m.g] : pts(m.p)}<span class="txt">${m.t[lang]}</span><span class="ar">${m.l}</span></div>`).join("")}</div>`;

    if (c.pyr) html += `<div class="pyr">${c.pyr.map((w, k) =>
      (k ? `<i class="fa-solid fa-chevron-down"></i>` : "") + `<span class="ar">${w}</span>`).join("")}</div>`;

    if (c.note) html += `<div class="note"><i class="fa-solid fa-feather-pointed"></i><div>${c.note[lang]}</div></div>`;
    return html + `</section>`;
  }).join("");
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("dak_fiche_lettres_lang", lang); } catch(_) {}
  render();
}));
document.getElementById("cards").addEventListener("click", e => {
  const b = e.target.closest(".snd-btn");
  if (b) playSound(b.dataset.src, b);
});
render();
