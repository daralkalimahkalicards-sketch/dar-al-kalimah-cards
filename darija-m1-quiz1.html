    <style>
        :root {
            --burgundy: #5D1828;
            --burgundy-dark: #3a0f19;
            --gold: #C8A462;
            --gold-light: #dfc28b;
            --white: #FFFFFF;
            --bg-beige: #FAF6F0;
            --success-green: #e8f5e9;
            --success-border: #4CAF50;
            --error-red: #ffebee;
            --error-border: #f44336;
            --shadow-soft: 0 15px 35px rgba(93, 24, 40, 0.08);
            --shadow-hover: 0 8px 20px rgba(200, 164, 98, 0.2);
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-beige);
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, var(--bg-beige) 80%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', system-ui, sans-serif;
            padding: 20px;
            overflow-x: hidden;
            color: var(--burgundy);
            position: relative;
        }

        button, a, input, .option-card {
            touch-action: manipulation;
        }

        .ar-text {
            font-family: "Amiri", serif;
            line-height: 1.2;
            direction: rtl;
            text-rendering: optimizeLegibility;
            unicode-bidi: isolate;
        }

        .serif-text { font-family: "Cinzel", "Georgia", serif; }

        .view {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: floatIn 0.5s ease-out forwards;
        }

        .hidden { display: none !important; }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-house {
            position: absolute;
            top: 25px;
            right: 25px;
            color: var(--gold);
            font-size: 1.6rem;
            text-decoration: none;
            transition: transform 0.3s ease, color 0.3s ease;
            z-index: 10;
            padding: 5px;
        }

        .btn-house:hover,
        .btn-house:focus-visible {
            transform: scale(1.1);
            color: var(--gold-light);
            outline: none;
        }

        .btn-main,
        .btn-secondary {
            border: 2px solid var(--burgundy);
            padding: 16px 45px;
            font-size: 1.05rem;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(93, 24, 40, 0.25);
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--burgundy), var(--burgundy-dark));
            color: var(--white);
        }

        .btn-main:hover,
        .btn-main:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(93, 24, 40, 0.35);
            border-color: var(--gold);
            outline: none;
        }

        .btn-main:active { transform: translateY(1px); }

        .btn-secondary {
            background: var(--bg-beige);
            color: var(--burgundy);
            border-color: var(--gold);
            box-shadow: 0 4px 15px rgba(200, 164, 98, 0.2);
        }

        .btn-secondary:hover,
        .btn-secondary:focus-visible {
            background: var(--gold);
            color: var(--white);
            outline: none;
        }

        .menu-container {
            position: relative;
            text-align: center;
            background: var(--burgundy);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(93, 24, 40, 0.25);
            max-width: 600px;
            width: 100%;
        }

        .menu-container .brand-ar {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 5px;
        }

        .menu-container .app-title {
            font-size: 1.6rem;
            color: #d09470;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .menu-container .divider {
            width: 60px;
            height: 2px;
            background-color: var(--gold);
            margin: 25px auto;
            border-radius: 2px;
            opacity: 0.5;
        }

        .menu-container .subtitle-group { margin-bottom: 30px; }

        .menu-container .subtitle {
            font-size: 1.05rem;
            font-weight: 500;
            margin-bottom: 5px;
            color: var(--white);
        }

        .menu-container .subtitle.es {
            font-size: 0.95rem;
            opacity: 0.9;
            color: var(--gold-light);
            font-style: italic;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 35px;
        }

        .menu-container .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .menu-container .input-group input {
            width: 100%;
            max-width: 350px;
            padding: 15px;
            font-size: 1.1rem;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            border: 2px solid var(--gold);
            border-radius: 12px;
            background-color: var(--white);
            color: var(--burgundy);
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .menu-container .input-group input:focus {
            border-color: var(--gold-light);
            box-shadow: 0 0 0 4px rgba(200, 164, 98, 0.3);
        }

        .menu-container .btn-main.start-btn {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            width: 100%;
            max-width: 350px;
            box-shadow: none;
        }

        .menu-container .btn-main.start-btn:hover,
        .menu-container .btn-main.start-btn:focus-visible {
            background-color: rgba(200, 164, 98, 0.1);
            border-color: var(--gold-light);
            color: var(--gold-light);
            transform: translateY(-3px);
        }

        .quiz-container {
            text-align: center;
            background: var(--white);
            padding: 50px 40px;
            border-radius: 24px;
            border: 1px solid var(--gold);
            box-shadow: inset 0 0 0 5px var(--white), inset 0 0 0 6px var(--gold-light), var(--shadow-soft);
            max-width: 600px;
            width: 100%;
        }

        .quiz-header {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .progress-text {
            font-weight: 700;
            color: var(--burgundy);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .score-live {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--success-border);
            background: var(--success-green);
            border: 1px solid rgba(76, 175, 80, 0.3);
            padding: 4px 12px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            transition: transform 0.2s ease;
        }

        .score-live.bump { transform: scale(1.2); }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--white);
            border: 1px solid var(--gold-light);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--gold);
            width: 0%;
            transition: width 0.4s ease;
        }

        .instruction-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: var(--burgundy);
        }

        .instruction-text small {
            opacity: 0.8;
            font-weight: 500;
            display: block;
            margin-top: 5px;
            font-style: italic;
        }

        .audio-section {
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
        }

        .btn-audio.big-audio {
            width: 80px;
            height: 80px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--bg-beige), #fff);
            border: 3px solid var(--gold);
            color: var(--burgundy);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(200, 164, 98, 0.3);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }

        .btn-audio.big-audio:hover,
        .btn-audio.big-audio:focus-visible {
            transform: scale(1.1) translateY(-3px);
            background: var(--gold);
            box-shadow: 0 12px 30px rgba(200, 164, 98, 0.5);
            color: var(--white);
        }

        .btn-audio.big-audio:active { transform: scale(0.95); }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .option-card {
            background: var(--white);
            border: 2px solid var(--gold-light);
            border-radius: 18px;
            aspect-ratio: 1.8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.2rem;
            color: var(--burgundy);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            user-select: none;
        }

        .option-card:hover,
        .option-card:focus-visible {
            transform: translateY(-3px);
            border-color: var(--gold);
            box-shadow: var(--shadow-hover);
            outline: none;
        }

        .option-card:active { transform: scale(0.95); }

        .option-card.correct {
            border: 3px solid var(--success-border) !important;
            background-color: var(--success-green);
            color: var(--success-border);
            pointer-events: none;
        }

        .option-card.wrong {
            border: 3px solid var(--error-border) !important;
            background-color: var(--error-red);
            animation: gentleShake 0.4s;
            pointer-events: none;
            opacity: 0.7;
        }

        .option-card.disabled { pointer-events: none; }

        @keyframes gentleShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .diploma-paper {
            background: linear-gradient(145deg, #ffffff, #fcfcfc);
            border: 8px double var(--gold);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            position: relative;
            margin-bottom: 30px;
        }

        .cert-ar {
            font-size: 4.5rem;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 10px;
        }

        .cert-title {
            color: var(--burgundy);
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .cert-messages { margin-bottom: 25px; }

        .cert-msg { font-weight: 600; color: #444; }

        .cert-msg.es {
            font-size: 0.9rem;
            color: #777;
            margin-top: 5px;
        }

        .cert-name {
            font-size: 3rem;
            color: var(--burgundy);
            border-bottom: 1px solid var(--gold-light);
            padding-bottom: 10px;
            margin-bottom: 25px;
            word-break: break-word;
        }

        .cert-score-box {
            background-color: var(--bg-beige);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 15px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .score-label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--burgundy);
        }

        .cert-date {
            font-size: 0.95rem;
            color: #888;
            font-weight: 500;
        }

        .cert-icon {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            background: var(--bg-beige);
            border-radius: 50%;
            padding: 5px;
        }

        .cert-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .menu-container,
            .quiz-container { padding: 40px 20px; }

            .option-card { font-size: 2.8rem; }
            .diploma-paper { padding: 30px 20px; }
        }

        @media (max-width: 480px) {
            .menu-container .brand-ar { font-size: 3rem; }
            .menu-container .app-title { font-size: 1.3rem; }
            .btn-audio.big-audio { width: 65px; height: 65px; font-size: 2rem; }
            .option-card { font-size: 2.4rem; aspect-ratio: 1.5; }
            .cert-ar { font-size: 3.5rem; }
            .cert-title { font-size: 1.5rem; }
            .cert-name { font-size: 2.5rem; }
            .cert-actions { flex-direction: column; width: 100%; max-width: 300px; }
            .btn-main, .btn-secondary { width: 100%; text-align: center; }
        }

        @media (max-width: 360px) {
            .option-card { font-size: 2rem; }
        }

        @media print {
            body * { visibility: hidden; }
            #view-certificate, #view-certificate * { visibility: visible; }
            #view-certificate {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                background: white;
            }
            .no-print { display: none !important; }
            .diploma-paper { border: 10px double var(--gold); box-shadow: none; max-width: 100%; }
        }
    

        .question-box { margin-bottom: 30px; }
        .question-ar { font-size: 2.6rem; font-weight: bold; color: var(--burgundy); line-height: 1.5; }
        .question-ph { font-size: 1.05rem; font-weight: 600; margin-top: 4px; }
        .question-sit { font-size: 1.15rem; font-weight: 600; line-height: 1.5; }
        .question-sit.es { font-size: 1rem; font-style: italic; opacity: .8; font-weight: 500; margin-top: 6px; }
        .options-grid .option-card { aspect-ratio: auto; min-height: 110px; flex-direction: column; padding: 12px 10px; font-size: 1rem; text-align: center; line-height: 1.35; }
        .option-card .opt-ar { font-family: "Amiri", serif; font-size: 1.75rem; font-weight: bold; direction: rtl; line-height: 1.4; }
        .option-card .opt-ph { font-size: .85rem; font-weight: 600; margin-top: 2px; }
        .option-card .opt-fr { font-size: 1rem; font-weight: 600; }
        .option-card .opt-es { font-size: .88rem; font-style: italic; opacity: .8; margin-top: 4px; }
        .n3 { color: var(--gold); font-weight: 700; }
        .cert-actions .btn-main, .cert-actions .btn-secondary { padding: 14px 28px; }
        @media (max-width: 480px) { .options-grid { grid-template-columns: 1fr; } .options-grid .option-card { min-height: 0; } .question-ar { font-size: 2.2rem; } }

    .lang-toggle { display:inline-flex; border:1px solid var(--gold, #C8A462); border-radius:999px; overflow:hidden; z-index:11; }
    .lang-toggle button { background:transparent; border:0; color:var(--gold, #C8A462); font:700 .8rem 'Montserrat', sans-serif; padding:7px 13px; cursor:pointer; letter-spacing:1px; }
    .lang-toggle button.on { background:var(--gold, #C8A462); color:var(--burgundy, #5D1828); }
    .lang-abs { position:absolute; top:22px; left:22px; }
    .lang-light button { color:var(--burgundy, #5D1828); }
    .lang-light button.on { color:#fff; background:var(--burgundy, #5D1828); }
    .lang-light { border-color:var(--burgundy, #5D1828); }
.flag-ma{width:1.7em;height:1.7em;vertical-align:-0.5em;margin-right:.5em;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))} .header-la .flag-ma{width:1.6em;height:1.6em;vertical-align:-0.45em}
        .progress-info .lang-toggle button { padding:5px 11px; }
  </style>
</head>

        };
        const AppEngine = {
            state: { playerName: "Participant", questions: [], currentIndex: 0, score: 0, isProcessing: false, config: { delayNextCard: 1500 } },
            dom: {
                views: { welcome: document.getElementById('view-welcome'), quiz: document.getElementById('view-quiz'), certificate: document.getElementById('view-certificate') },
                inputs: { name: document.getElementById('player-name') },
                buttons: { startQuiz: document.getElementById('btn-start-quiz'), printCert: document.getElementById('btn-print-cert'), restartQuiz: document.getElementById('btn-restart-quiz') },
                ui: { progressText: document.getElementById('progress-text'), progressFill: document.getElementById('progress-fill'), progressBarA11y: document.getElementById('progress-bar-accessibility'),
                      scoreLive: document.getElementById('score-live'), optionsGrid: document.getElementById('options-grid'), question: document.getElementById('question-box'),
                      certName: document.getElementById('cert-name'), certScore: document.getElementById('cert-score'), certDate: document.getElementById('cert-date') }
            },
            shuffle(array) { const arr = [...array]; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
            buildQuestionsPayload() {
                this.state.questions = this.shuffle(QUIZ.qs).map(q => ({ q, options: this.shuffle(q.a.map((a, i) => ({ a, ok: i === 0 }))) }));
            },
            startQuiz() {
                const nameVal = this.dom.inputs.name.value.trim();
                this.state.playerName = nameVal !== "" ? nameVal : "Participant";
                this.state.score = 0; this.state.currentIndex = 0; this.state.isProcessing = false;
                this.buildQuestionsPayload(); this.switchView("quiz"); this.updateScoreLiveUI(); this.renderQuestion();
            },
            restartQuiz() { this.switchView("welcome"); this.dom.inputs.name.value = ""; this.dom.inputs.name.focus(); },
            endQuiz() {
                this.switchView("certificate");
                this.dom.ui.progressFill.style.width = "100%";
                this.dom.ui.certName.textContent = this.state.playerName;
                this.dom.ui.certScore.textContent = `${this.state.score} / ${this.state.questions.length}`;
                const dateStr = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
                this.dom.ui.certDate.textContent = LANG === 'fr' ? `Fait le ${dateStr}` : `Hecho el ${new Date().toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" })}`;
                try { localStorage.setItem('dak-darija-m1-quiz' + QUIZ.n, this.state.score + '/' + this.state.questions.length); } catch (e) {}
                this.triggerSuccessEffects();
            },
            optionHTML(a) {
                if (a.ar !== undefined) return '<span class="opt-ar">' + esc(a.ar) + '</span><span class="opt-ph">' + ph(a.lt) + '</span>';
                return '<span class="opt-fr">' + esc(a[LANG]) + '</span>';
            },
            renderQuestion() {
                this.state.isProcessing = false;
                const item = this.state.questions[this.state.currentIndex], q = item.q;
                const total = this.state.questions.length, pct = Math.round((this.state.currentIndex / total) * 100);
                this.dom.ui.progressText.textContent = `${this.state.currentIndex + 1} / ${total}`;
                this.dom.ui.progressFill.style.width = `${pct}%`;
                this.dom.ui.progressBarA11y.setAttribute("aria-valuenow", String(pct));
                let h = '';
                if (q.s) h = '<div class="question-sit">' + esc(q.s[LANG]) + '</div>';
                else h = (q.p ? '<div class="question-sit" style="font-size:1rem">' + esc(q.p[LANG]) + '</div>' : '') +
                         '<div class="question-ar ar-text" dir="rtl">' + esc(q.q.ar) + '</div><div class="question-ph">' + ph(q.q.lt) + '</div>';
                this.dom.ui.question.innerHTML = h;
                this.dom.ui.optionsGrid.innerHTML = "";
                item.options.forEach((o, idx) => {
                    const btn = document.createElement("button");
                    btn.type = "button"; btn.className = "option-card"; btn.innerHTML = this.optionHTML(o.a);
                    btn.setAttribute("aria-label", `Option ${idx + 1}`);
                    btn.addEventListener("click", () => this.handleAnswer(o, btn, item));
                    this.dom.ui.optionsGrid.appendChild(btn);
                });
            },
            handleAnswer(o, cardElement, item) {
                if (this.state.isProcessing) return;
                this.state.isProcessing = true;
                const allCards = Array.from(this.dom.ui.optionsGrid.children);
                allCards.forEach(c => { c.disabled = true; c.classList.add("disabled"); });
                if (o.ok) { this.state.score++; cardElement.classList.add("correct"); this.updateScoreLiveUI(); }
                else {
                    cardElement.classList.add("wrong");
                    if (navigator.vibrate) navigator.vibrate(200);
                    allCards[item.options.findIndex(x => x.ok)].classList.add("correct");
                }
                setTimeout(() => { this.state.currentIndex++; if (this.state.currentIndex < this.state.questions.length) this.renderQuestion(); else this.endQuiz(); }, this.state.config.delayNextCard);
            },
            switchView(viewName) { Object.values(this.dom.views).forEach(v => v.classList.add("hidden")); this.dom.views[viewName].classList.remove("hidden"); window.scrollTo(0, 0); },
            updateScoreLiveUI() { const el = this.dom.ui.scoreLive; el.textContent = `✓ ${this.state.score}`; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); setTimeout(() => el.classList.remove("bump"), 200); },
            triggerSuccessEffects() {
                const end = Date.now() + 3000;
                (function frame() {
                    if (typeof confetti === "function") {
                        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ["#C8A462", "#5D1828"] });
                        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ["#C8A462", "#5D1828"] });
                    }
                    if (Date.now() < end) requestAnimationFrame(frame);
                })();
                AudioController.playEffect("./mabruk.mp3");
            },
            bindEvents() {
                this.dom.buttons.startQuiz.addEventListener("click", () => this.startQuiz());
                this.dom.buttons.printCert.addEventListener("click", () => window.print());
                this.dom.buttons.restartQuiz.addEventListener("click", () => this.restartQuiz());
                this.dom.inputs.name.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); this.startQuiz(); } });
            },
            init() { AudioController.init(); this.bindEvents(); }
        };
        window.onLang = function(){
            const v = AppEngine.dom.views.quiz;
            if (v && !v.classList.contains('hidden') && !AppEngine.state.isProcessing && AppEngine.state.questions.length) AppEngine.renderQuestion();
        };
        document.addEventListener("DOMContentLoaded", () => AppEngine.init());
    </script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch((err) => console.error('SW registration failed:', err));
  let dakSwRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (dakSwRefreshing) return;
    dakSwRefreshing = true;
    window.location.reload();
  });
}
</script>
</body>
