<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dar Al-Kalimah - Kalijeux : Associe l'image au mot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<style>
  :root{
    --bordeaux:#5D1828; --bordeaux-dark:#3a0f19; --gold:#C8A462; --gold-light:#dfc28b;
    --radius-xl:28px; --radius-lg:22px; --radius-md:18px; --radius-sm:12px;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; font-family:'Montserrat',sans-serif;
    background:#f6f1ea;
    padding-top:var(--safe-top); padding-bottom:var(--safe-bottom);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:
      radial-gradient(circle at 12% 18%, rgba(200,164,98,0.13), transparent 26%),
      radial-gradient(circle at 88% 12%, rgba(93,24,40,0.08), transparent 28%),
      radial-gradient(circle at 50% 92%, rgba(200,164,98,0.10), transparent 34%);
  }
  .quiz-container{
    position:relative; width:100%; max-width:560px; background:#fff;
    border-radius:var(--radius-xl); box-shadow:0 20px 50px rgba(58,15,25,0.18);
    overflow:hidden; padding:26px;
  }
  .quiz-container::before{ content:""; position:absolute; inset:14px; border-radius:20px; border:1px solid rgba(200,164,98,0.16); pointer-events:none; }

  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .btn-house{
    width:42px; height:42px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    background:var(--bordeaux); color:var(--gold); border:1px solid rgba(200,164,98,0.32); cursor:pointer;
  }
  h1{ font-family:'Cinzel',serif; font-size:1rem; color:var(--bordeaux-dark); text-align:center; flex:1; margin:0 8px; }
  #scoreBadge{ font-weight:700; color:var(--bordeaux); font-size:0.85rem; min-width:42px; text-align:center; }

  .progress-bar{ height:8px; background:#f0e6d8; border-radius:999px; overflow:hidden; margin-bottom:20px; }
  .progress-bar-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--gold-light), var(--gold)); border-radius:999px; transition:width .4s ease; }

  .hidden{ display:none !important; }

  /* ---- Ecran de selection de categorie ---- */
  #view-modules{ padding:4px 2px 2px; }
  #view-modules p{ color:#6b5a4a; font-size:.88rem; line-height:1.5; text-align:center; margin:0 0 10px; }
  .main-lang-toggle{ display:flex; justify-content:center; gap:8px; margin:0 0 14px; }
  .lang-btn{
    border:1px solid rgba(200,164,98,0.4); background:#fff; color:var(--bordeaux-dark);
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:.72rem; letter-spacing:.5px;
    border-radius:999px; padding:7px 16px; cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .lang-btn.active{ background:var(--bordeaux); color:var(--gold); border-color:var(--bordeaux); }
  .intro-icon{
    width:64px; height:64px; margin:0 auto 14px; border-radius:999px;
    background:linear-gradient(145deg, var(--bordeaux), var(--bordeaux-dark));
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(93,24,40,0.25);
  }
  .intro-logo{ font-family:'Cinzel',serif; font-weight:700; font-size:1.05rem; letter-spacing:0.06em; color:var(--gold); }
  .rules-list{ list-style:none; padding:0; margin:14px 0 4px; text-align:left; }
  .rules-list li{ display:flex; align-items:flex-start; gap:12px; font-size:.85rem; color:#4a3338; margin-bottom:10px; line-height:1.45; }
  .step-num{
    display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; border-radius:999px;
    background:var(--bordeaux); color:#fff; font-size:.68rem; font-weight:700; flex-shrink:0; margin-top:1px;
  }
  .module-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:6px; }
  .module-card{
    background:#fff; border:1px solid rgba(200,164,98,0.3); border-radius:var(--radius-md);
    padding:14px 8px; text-align:center; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .module-card:active{ transform:scale(0.96); }
  .module-card:hover{ border-color:var(--gold); box-shadow:0 6px 16px rgba(93,24,40,0.10); }
  .module-card .module-emoji{ font-size:1.8rem; display:block; margin-bottom:6px; }
  .module-card .module-label{ display:block; font-size:.76rem; font-weight:600; color:var(--bordeaux-dark); line-height:1.25; }
  .module-card .module-count{ display:block; font-size:.65rem; color:#8a7a68; margin-top:3px; }
  .module-card.module-all{
    grid-column:1 / -1; background:linear-gradient(90deg, var(--gold), var(--gold-light)); border:none;
    box-shadow:0 8px 20px rgba(200,164,98,0.35);
  }
  .module-card.module-all .module-label{ font-size:.85rem; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none;
    color:var(--bordeaux); font-family:'Montserrat',sans-serif; font-size:.78rem; font-weight:600;
    cursor:pointer; margin-bottom:10px; padding:4px 0;
  }
  .selected-module-line{ font-size:.82rem; color:var(--bordeaux); font-weight:600; text-align:center; margin:0 0 4px; }

  /* ---- Ecran de depart ---- */
  #view-start{ text-align:center; padding:20px 6px 6px; }
  #playerName{
    width:100%; padding:14px; border-radius:var(--radius-md); border:1px solid rgba(93,24,40,0.2);
    font-family:'Montserrat',sans-serif; font-size:1rem; text-align:center; margin:14px 0;
  }
  .btn-gold{
    background:linear-gradient(90deg, var(--gold), var(--gold-light)); color:var(--bordeaux-dark);
    border:none; border-radius:999px; padding:14px 28px; font-weight:700; font-size:1rem; cursor:pointer;
    font-family:'Montserrat',sans-serif; box-shadow:0 8px 20px rgba(200,164,98,0.35);
  }
  .btn-gold:disabled{ opacity:.5; cursor:not-allowed; }

  /* ---- Ecran de jeu ---- */
  .word-card{
    background:#fdfaf5; border:1px solid rgba(200,164,98,0.24); border-radius:var(--radius-lg);
    padding:26px 16px; display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:20px;
  }
  .center-target{
    display:flex; align-items:center; justify-content:center;
    min-width:140px; min-height:100px; padding:10px 18px;
    border:2px dashed var(--gold); border-radius:var(--radius-lg); background:rgba(200,164,98,0.08);
  }
  .center-target.word-mode{
    direction:rtl; unicode-bidi:isolate; font-family:'Amiri',serif;
    font-feature-settings:"liga" 1,"calt" 1,"mark" 1,"mkmk" 1;
    font-size:clamp(2.2rem, 10vw, 3.2rem); color:var(--bordeaux-dark);
  }
  .center-target.image-mode{ font-size:clamp(3rem, 14vw, 4.5rem); }
  .center-target.drop-hover{ background:rgba(200,164,98,0.22); border-style:solid; }
  .center-target.correct{ border-color:#2e7d32; border-style:solid; background:rgba(46,125,50,0.08); }
  .center-target.wrong{ border-color:#c0392b; }

  .audio-btn{
    width:44px; height:44px; border-radius:999px; border:1px solid rgba(200,164,98,0.35);
    background:var(--bordeaux); color:var(--gold); font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .audio-btn.no-audio{ opacity:.35; cursor:default; }

  .tiles-row{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap; min-height:96px; }
  .drag-tile{
    touch-action:none; user-select:none; -webkit-user-select:none;
    width:78px; height:78px; background:#ffffff; border:1px solid rgba(200,164,98,0.3);
    border-radius:var(--radius-sm); box-shadow:0 6px 16px rgba(93,24,40,0.10);
    display:flex; align-items:center; justify-content:center;
    font-family:'Amiri',serif; font-size:2rem; color:var(--bordeaux-dark);
    cursor:grab; position:relative; transition:transform .15s ease, box-shadow .15s ease;
  }
  .drag-tile.emoji-tile{ font-family:inherit; font-size:2.4rem; }
  .drag-tile.word-tile{
    direction:rtl; unicode-bidi:isolate; font-feature-settings:"liga" 1,"calt" 1,"mark" 1,"mkmk" 1;
    font-size:1.5rem; padding:4px;
  }
  .drag-tile.dragging{ cursor:grabbing; z-index:50; box-shadow:0 14px 30px rgba(93,24,40,0.28); transform:scale(1.06); }
  .drag-tile.used{ opacity:0; pointer-events:none; }

  .feedback-msg{ text-align:center; font-weight:700; min-height:22px; font-size:.9rem; margin-top:2px; }
  .feedback-msg.ok{ color:#2e7d32; }
  .feedback-msg.ko{ color:#c0392b; }

  /* ---- Panneau de revelation ---- */
  .reveal-panel{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:4px; text-align:center; }
  .reveal-emoji{ font-size:3.4rem; }
  .reveal-word{
    direction:rtl; unicode-bidi:isolate; font-family:'Amiri',serif;
    font-feature-settings:"liga" 1,"calt" 1,"mark" 1,"mkmk" 1;
    font-size:clamp(1.8rem, 8vw, 2.4rem); color:var(--bordeaux-dark);
  }
  .reveal-translation{ font-family:'Montserrat',sans-serif; font-size:1.1rem; font-weight:700; color:var(--bordeaux); }
  .lang-toggle{ display:flex; gap:8px; }

  /* ---- Certificat ---- */
  .diploma-paper{
    position:relative; text-align:center; padding:34px 20px; border:1px solid var(--gold);
    border-radius:var(--radius-lg); background:#fffdf9;
  }
  .diploma-paper::before{ content:""; position:absolute; inset:12px; border:1px solid rgba(200,164,98,0.20); border-radius:14px; pointer-events:none; }
  .diploma-paper i.fa-award{ color:var(--gold); font-size:2.4rem; margin-bottom:6px; }
  .diploma-paper h2{ font-family:'Cinzel',serif; color:var(--bordeaux-dark); margin:6px 0; }
  .diploma-paper .cert-name{ font-family:'Amiri',serif; font-size:1.6rem; color:var(--bordeaux); margin:10px 0; }
  .diploma-paper .cert-score{ font-weight:700; color:var(--gold); font-size:1.2rem; }
  .diploma-paper .cert-module{ color:var(--bordeaux); font-size:.85rem; font-weight:600; margin-top:4px; }
  .diploma-paper .cert-date{ color:#8a7a68; font-size:.85rem; margin-top:6px; }

  @media (max-width:768px){ .quiz-container{ max-width:500px; } }
  @media (max-width:480px){
    .drag-tile{ width:68px; height:68px; font-size:1.7rem; }
    .drag-tile.emoji-tile{ font-size:2.1rem; }
    .drag-tile.word-tile{ font-size:1.3rem; }
    .module-card .module-label{ font-size:.7rem; }
  }
  @media (max-width:360px){
    .drag-tile{ width:60px; height:60px; font-size:1.5rem; }
    .drag-tile.emoji-tile{ font-size:1.9rem; }
    .tiles-row{ gap:10px; }
    .module-card{ padding:10px 6px; }
  }
  @media print{ .btn-house, .audio-btn, header{ display:none !important; } }
</style>
</head>
<body>

<div class="quiz-container">

  <header>
    <span id="scoreBadge">0/0</span>
    <h1 id="appTitleEl">Kalijeux – Associe l'image au mot</h1>
    <button class="btn-house" id="homeBtn" aria-label="Accueil"><i class="fa-solid fa-house"></i></button>
  </header>

  <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>

  <section id="view-modules">
    <div class="lang-toggle main-lang-toggle" id="mainLangToggle">
      <button class="lang-btn" id="mainLangFrBtn">FR</button>
      <button class="lang-btn" id="mainLangEsBtn">ES</button>
    </div>
    <div class="intro-icon"><span class="intro-logo">DAK</span></div>
    <p id="modulesIntroText">Choisis une catégorie, ou lance le mode toutes catégories mélangées.</p>
    <div class="module-grid" id="moduleGrid"></div>
  </section>

  <section id="view-start" class="hidden">

    <p class="selected-module-line" id="selectedModuleName"></p>

      <li><span class="step-num">3</span><span id="step3Text">Fais glisser la bonne réponse dessus.</span></li>
    </ul>
    <input type="text" id="playerName" placeholder="Ton prénom">
    <button class="btn-gold" id="startBtn">Commencer</button>
  </section>

  <main id="view-quiz" class="hidden">
    <div class="word-card" id="wordCard">
      <div class="center-target" id="centerTarget"></div>
      <button class="audio-btn" id="playWordBtn" aria-label="Écouter le mot"><i class="fa-solid fa-volume-high"></i></button>
    </div>
    <div class="tiles-row" id="tilesRow"></div>
    <div class="feedback-msg" id="feedbackMsg"></div>
    <div class="reveal-panel hidden" id="revealPanel">
      <div class="reveal-emoji" id="revealEmoji"></div>
      <div class="reveal-word ar-text" id="revealWord"></div>
      <div class="reveal-translation" id="revealTranslation"></div>
      <div class="lang-toggle">
        <button class="lang-btn" id="langFrBtn">FR</button>
        <button class="lang-btn" id="langEsBtn">ES</button>
      </div>
      <button class="btn-gold" id="nextBtn"><span id="nextBtnText">Suivant</span> <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </main>

  <section id="view-certificate" class="hidden">
    <div class="diploma-paper">
      <i class="fa-solid fa-award"></i>
      <h2>Mabrouk !</h2>
      <div class="cert-name" id="certName"></div>
      <div class="cert-score" id="certScore"></div>
      <div class="cert-module" id="certModule"></div>
      <div class="cert-date" id="certDate"></div>
      <button class="btn-gold" id="replayBtn" style="margin-top:20px;">Rejouer</button>
    </div>
  </section>

</div>

<script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
document.title = DATA.meta.pageTitle;

const DOM = {
  appTitleEl: document.getElementById('appTitleEl'),
  viewModules: document.getElementById('view-modules'),
  viewStart: document.getElementById('view-start'),
  viewQuiz: document.getElementById('view-quiz'),
  viewCert: document.getElementById('view-certificate'),
  moduleGrid: document.getElementById('moduleGrid'),
  modulesIntroText: document.getElementById('modulesIntroText'),
  mainLangFrBtn: document.getElementById('mainLangFrBtn'),
  mainLangEsBtn: document.getElementById('mainLangEsBtn'),
  backToModulesLink: document.getElementById('backToModulesLink'),
  backToModulesText: document.getElementById('backToModulesText'),
  selectedModuleName: document.getElementById('selectedModuleName'),
  step1Text: document.getElementById('step1Text'),
  step2Text: document.getElementById('step2Text'),
  step3Text: document.getElementById('step3Text'),
  playerName: document.getElementById('playerName'),
  startBtn: document.getElementById('startBtn'),
  homeBtn: document.getElementById('homeBtn'),
  progressFill: document.getElementById('progressFill'),
  scoreBadge: document.getElementById('scoreBadge'),
  wordCard: document.getElementById('wordCard'),
  centerTarget: document.getElementById('centerTarget'),
  playWordBtn: document.getElementById('playWordBtn'),
  tilesRow: document.getElementById('tilesRow'),
  feedbackMsg: document.getElementById('feedbackMsg'),
  revealPanel: document.getElementById('revealPanel'),
  revealEmoji: document.getElementById('revealEmoji'),
  revealWord: document.getElementById('revealWord'),
  revealTranslation: document.getElementById('revealTranslation'),
  langFrBtn: document.getElementById('langFrBtn'),
  langEsBtn: document.getElementById('langEsBtn'),
  nextBtn: document.getElementById('nextBtn'),
  nextBtnText: document.getElementById('nextBtnText'),
  certName: document.getElementById('certName'),
  certScore: document.getElementById('certScore'),
  certModule: document.getElementById('certModule'),
  certDate: document.getElementById('certDate'),
  replayBtn: document.getElementById('replayBtn')
};

const AudioController = {
  player: new Audio(), effectPlayer: new Audio(), isUnlocked: false,
  init() {
    this.player.preload = "none"; this.effectPlayer.preload = "none";
    this.player.playsInline = true; this.effectPlayer.playsInline = true;
    this.player.volume = 1; this.effectPlayer.volume = 1;
  },
  async unlock() {
    if (this.isUnlocked) return true;
    try {
      const s = DATA.meta.silentUnlockAudio;
      this.player.pause(); this.effectPlayer.pause();
      this.player.currentTime = 0; this.effectPlayer.currentTime = 0;
      this.player.src = s; this.effectPlayer.src = s;
      this.player.muted = true; this.effectPlayer.muted = true;
      await this.player.play().catch(() => {});
      this.player.pause(); this.player.currentTime = 0;
      await this.effectPlayer.play().catch(() => {});
      this.effectPlayer.pause(); this.effectPlayer.currentTime = 0;
      this.player.muted = false; this.effectPlayer.muted = false;
      this.player.removeAttribute("src"); this.effectPlayer.removeAttribute("src");
      this.player.load(); this.effectPlayer.load();
      this.isUnlocked = true; return true;
    } catch(_) { this.player.muted = false; this.effectPlayer.muted = false; return false; }
  },
  async playMain(src) {
    if (!src) return;
    try { this.player.pause(); this.player.currentTime = 0; this.player.src = src; this.player.load(); await this.player.play(); } catch(_) {}
  },
  async playEffect(src) {
    if (!src) return;
    try { this.effectPlayer.pause(); this.effectPlayer.currentTime = 0; this.effectPlayer.src = src; this.effectPlayer.load(); await this.effectPlayer.play(); } catch(_) {}
  },
  stopAll() {
    this.player.pause(); this.effectPlayer.pause();
    this.player.currentTime = 0; this.effectPlayer.currentTime = 0;
  }
};
AudioController.init();

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const App = {
  state: {
    isStarting: false,
    hasFinished: false,
    hasPlayedSuccess: false,
    pendingTimer: null,
    questionToken: 0,
    questions: [],
    index: 0,
    score: 0,
    playerName: '',
    selectedCategory: null,
    selectedCategoryLabel: '',
    roundAnswered: false,
    language: 'fr'
  },
  clearTimer(){
    if (this.state.pendingTimer) { clearTimeout(this.state.pendingTimer); this.state.pendingTimer = null; }
  },
  t(key){
    return DATA.ui[this.state.language][key];
  },
  formatDate(){
    const ui = DATA.ui[this.state.language];
    return new Date().toLocaleDateString(ui.dateLocale, { day:'numeric', month:'long', year:'numeric' });
  },
  syncLangButtons(){
    const isFr = this.state.language === 'fr';
    DOM.mainLangFrBtn.classList.toggle('active', isFr);
    DOM.mainLangEsBtn.classList.toggle('active', !isFr);
    DOM.langFrBtn.classList.toggle('active', isFr);
    DOM.langEsBtn.classList.toggle('active', !isFr);
  },
  setLanguage(lang){
    this.state.language = lang;
    this.applyLanguage();
  },
  getCategoryLabel(key){
    if (key === 'all') return this.t('modeAllLabel');
    const labels = this.state.language === 'es' ? DATA.categoryLabelsEs : DATA.categoryLabelsFr;
    return labels[key] || key;
  },
  applyLanguage(){
    const ui = DATA.ui[this.state.language];
    this.syncLangButtons();
    DOM.appTitleEl.textContent = ui.appTitle;
    DOM.modulesIntroText.textContent = ui.modulesIntro;
    DOM.backToModulesText.textContent = ui.backToModules;
    DOM.step1Text.textContent = ui.step1;
    DOM.step2Text.textContent = ui.step2;
    DOM.step3Text.textContent = ui.step3;
    DOM.playerName.placeholder = ui.playerNamePlaceholder;
    DOM.startBtn.textContent = ui.startBtn;
    DOM.nextBtnText.textContent = ui.nextBtn;
    DOM.replayBtn.textContent = ui.replayBtn;
    DOM.homeBtn.setAttribute('aria-label', ui.homeAria);
    if (this.state.selectedCategory) {
      this.state.selectedCategoryLabel = this.getCategoryLabel(this.state.selectedCategory);
      DOM.selectedModuleName.textContent = this.state.selectedCategoryLabel;
    }
    this.renderModuleGrid();
    this.updateRevealTranslation(this.currentRoundTarget());
  },
  currentRoundTarget(){
    const q = this.state.questions[this.state.index];
    return q ? q.target : null;
  },
  renderModuleGrid(){
    const keys = Object.keys(DATA.wordsByCategory);
    let totalCount = 0;
    DOM.moduleGrid.innerHTML = '';
    keys.forEach(k => {
      const words = DATA.wordsByCategory[k];
      totalCount += words.length;
      const label = this.getCategoryLabel(k);
      const emoji = DATA.categoryEmoji[k] || '🔸';
      const card = document.createElement('div');
      card.className = 'module-card';
      card.innerHTML = `<span class="module-emoji">${emoji}</span><span class="module-label">${label}</span><span class="module-count">${words.length} ${this.t('wordsSuffix')}</span>`;
      card.addEventListener('click', () => this.selectCategory(k));
      DOM.moduleGrid.appendChild(card);
    });
    const allCard = document.createElement('div');
    allCard.className = 'module-card module-all';
    allCard.innerHTML = `<span class="module-emoji">🔀</span><span class="module-label">${this.t('modeAllLabel')}</span><span class="module-count">${totalCount} ${this.t('wordsSuffixRandom')}</span>`;
    allCard.addEventListener('click', () => this.selectCategory('all'));
    DOM.moduleGrid.appendChild(allCard);
  },
  selectCategory(key){
    this.state.selectedCategory = key;
    this.state.selectedCategoryLabel = this.getCategoryLabel(key);
    DOM.selectedModuleName.textContent = this.state.selectedCategoryLabel;
    DOM.viewModules.classList.add('hidden');
    DOM.viewStart.classList.remove('hidden');
  },
  showModules(){
    DOM.viewStart.classList.add('hidden');
    DOM.viewModules.classList.remove('hidden');
  },
  buildQuestions(){
    const catKeys = Object.keys(DATA.wordsByCategory);
    const selected = this.state.selectedCategory;
    const rounds = [];
    for (let r = 0; r < DATA.settings.roundCount; r++) {
      const cat = selected === 'all' ? catKeys[Math.floor(Math.random() * catKeys.length)] : selected;
      const picks = shuffle(DATA.wordsByCategory[cat]).slice(0, 4);
      const targetIndex = Math.floor(Math.random() * picks.length);
      const mode = Math.random() < 0.5 ? 'word' : 'image';
      rounds.push({ picks, targetIndex, target: picks[targetIndex], mode, category: cat });
    }
    return rounds;
  },
  async startQuiz(){
    if (this.state.isStarting) return;
    if (!this.state.selectedCategory) return;
    this.state.isStarting = true;
    await AudioController.unlock();
    this.state.playerName = DOM.playerName.value.trim() || 'Ami(e)';
    this.state.questions = this.buildQuestions();
    this.state.index = 0;
    this.state.score = 0;
    this.state.hasFinished = false;
    this.state.hasPlayedSuccess = false;
    DOM.viewStart.classList.add('hidden');
    DOM.viewCert.classList.add('hidden');
    DOM.viewQuiz.classList.remove('hidden');
    this.renderRound();
    this.state.isStarting = false;
  },
  updateProgressAndScore(){
    const total = this.state.questions.length;
    DOM.progressFill.style.width = `${(this.state.index / total) * 100}%`;
    DOM.scoreBadge.textContent = `${this.state.score}/${total}`;
  },
  renderRound(){
    this.state.questionToken += 1;
    const token = this.state.questionToken;
    this.state.roundAnswered = false;
    DOM.feedbackMsg.textContent = '';
    DOM.feedbackMsg.className = 'feedback-msg';
    DOM.revealPanel.classList.add('hidden');
    DOM.tilesRow.classList.remove('hidden');
    DOM.centerTarget.classList.remove('correct', 'wrong', 'drop-hover');
    this.updateProgressAndScore();

    const round = this.state.questions[this.state.index];
    if (!round) { this.endQuiz(); return; }

    DOM.centerTarget.className = 'center-target ' + (round.mode === 'word' ? 'word-mode' : 'image-mode');
    DOM.centerTarget.textContent = round.mode === 'word' ? round.target.arabe : round.target.image;

    DOM.tilesRow.innerHTML = '';
    round.picks.forEach((card) => {
      const tile = document.createElement('div');
      const showImage = round.mode === 'word';
      tile.className = 'drag-tile ' + (showImage ? 'emoji-tile' : 'word-tile ar-text');
      tile.textContent = showImage ? card.image : card.arabe;
      tile.dataset.id = card.id;
      this.attachDrag(tile, round.target.id, token);
      DOM.tilesRow.appendChild(tile);
    });

    DOM.playWordBtn.classList.toggle('no-audio', !round.target.audio);
    DOM.playWordBtn.onclick = () => AudioController.playMain(round.target.audio);
  },
  attachDrag(tile, correctId, token){
    let startX, startY, origX, origY, dragging = false;

    const onPointerDown = (e) => {
      if (this.state.questionToken !== token) return;
      tile.setPointerCapture(e.pointerId);
      dragging = true;
      tile.classList.add('dragging');
      const rect = tile.getBoundingClientRect();
      origX = rect.left; origY = rect.top;
      tile.style.position = 'fixed';
      tile.style.left = origX + 'px';
      tile.style.top = origY + 'px';
      tile.style.width = rect.width + 'px';
      tile.style.height = rect.height + 'px';
      startX = e.clientX; startY = e.clientY;
    };
    const onPointerMove = (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      tile.style.left = (origX + dx) + 'px';
      tile.style.top = (origY + dy) + 'px';
      if (this.isOverlapping(tile, DOM.centerTarget)) {
        DOM.centerTarget.classList.add('drop-hover');
      } else {
        DOM.centerTarget.classList.remove('drop-hover');
      }
    };
    const onPointerUp = (e) => {
      if (!dragging) return;
      dragging = false;
      tile.classList.remove('dragging');
      DOM.centerTarget.classList.remove('drop-hover');
      if (this.isOverlapping(tile, DOM.centerTarget)) {
        this.handleDrop(tile, correctId, token);
      } else {
        tile.style.position = '';
        tile.style.left = ''; tile.style.top = '';
        tile.style.width = ''; tile.style.height = '';
      }
    };
    tile.addEventListener('pointerdown', onPointerDown);
    tile.addEventListener('pointermove', onPointerMove);
    tile.addEventListener('pointerup', onPointerUp);
    tile.addEventListener('pointercancel', onPointerUp);
  },
  isOverlapping(tile, target){
    const t = tile.getBoundingClientRect();
    const b = target.getBoundingClientRect();
    const tCenterX = t.left + t.width / 2, tCenterY = t.top + t.height / 2;
    return tCenterX > b.left && tCenterX < b.right && tCenterY > b.top && tCenterY < b.bottom;
  },
  handleDrop(tile, correctId, token){
    if (this.state.questionToken !== token) return;
    if (this.state.roundAnswered) return;
    const isCorrect = String(tile.dataset.id) === String(correctId);
    tile.style.position = ''; tile.style.left = ''; tile.style.top = '';
    tile.style.width = ''; tile.style.height = '';

    if (isCorrect) {
      this.state.roundAnswered = true;
      tile.classList.add('used');
      DOM.centerTarget.classList.add('correct');
      DOM.feedbackMsg.textContent = this.t('correctFeedback');
      DOM.feedbackMsg.className = 'feedback-msg ok';
      this.state.score += 1;
      this.updateProgressAndScore();
      this.clearTimer();
      const round = this.state.questions[this.state.index];
      this.state.pendingTimer = setTimeout(() => {
        if (this.state.questionToken !== token) return;
        this.showReveal(round.target);
      }, DATA.settings.delayNextCard);
    } else {
      DOM.centerTarget.classList.add('wrong');
      DOM.feedbackMsg.textContent = this.t('wrongFeedback');
      DOM.feedbackMsg.className = 'feedback-msg ko';
      setTimeout(() => DOM.centerTarget.classList.remove('wrong'), 500);
    }
  },
  showReveal(target){
    DOM.feedbackMsg.textContent = '';
    DOM.tilesRow.classList.add('hidden');
    DOM.revealEmoji.textContent = target.image;
    DOM.revealWord.textContent = target.arabe;
    DOM.revealPanel.classList.remove('hidden');
    this.updateRevealTranslation(target);
  },
  updateRevealTranslation(target){
    this.syncLangButtons();
    if (!target) return;
    DOM.revealTranslation.textContent = this.state.language === 'es' ? target.es : target.fr;
  },
  advanceAfterReveal(){
    DOM.revealPanel.classList.add('hidden');
    DOM.tilesRow.classList.remove('hidden');
    this.state.index += 1;
    this.renderRound();
  },
  endQuiz(){
    if (this.state.hasFinished) return;
    this.clearTimer();
    this.state.hasFinished = true;
    this.state.questionToken += 1;
    AudioController.stopAll();

    DOM.viewQuiz.classList.add('hidden');
    DOM.viewCert.classList.remove('hidden');
    DOM.certName.textContent = this.state.playerName;
    DOM.certScore.textContent = `${this.state.score} / ${this.state.questions.length}`;
    DOM.certModule.textContent = this.state.selectedCategoryLabel;
    DOM.certDate.textContent = `${this.t('certDatePrefix')} ${this.formatDate()}`;

    const end = Date.now() + 3000;
    (function frame(){
      if (typeof confetti === "function") {
        confetti({ particleCount:5, angle:60, spread:55, origin:{x:0}, colors:["#C8A462","#5D1828","#dfc28b"] });
        confetti({ particleCount:5, angle:120, spread:55, origin:{x:1}, colors:["#C8A462","#5D1828","#dfc28b"] });
      }
      if (Date.now() < end) requestAnimationFrame(frame);
    })();

    if (this.state.hasPlayedSuccess) return;
    this.state.hasPlayedSuccess = true;
    AudioController.playEffect(DATA.meta.successAudio);
  }
};

App.applyLanguage();

DOM.startBtn.addEventListener('click', () => App.startQuiz());
DOM.playerName.addEventListener('keydown', (e) => { if (e.key === 'Enter') App.startQuiz(); });
DOM.homeBtn.addEventListener('click', () => { window.location.href = DATA.meta.homeHref; });
DOM.backToModulesLink.addEventListener('click', () => App.showModules());
DOM.replayBtn.addEventListener('click', () => {
  DOM.viewCert.classList.add('hidden');
  DOM.viewStart.classList.remove('hidden');
});
DOM.nextBtn.addEventListener('click', () => App.advanceAfterReveal());
DOM.mainLangFrBtn.addEventListener('click', () => App.setLanguage('fr'));
DOM.mainLangEsBtn.addEventListener('click', () => App.setLanguage('es'));
DOM.langFrBtn.addEventListener('click', () => App.setLanguage('fr'));
DOM.langEsBtn.addEventListener('click', () => App.setLanguage('es'));
</script>
</body>
</html>
