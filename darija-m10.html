<script>
var LANG = (function(){ try { return localStorage.getItem('dak-lang') === 'es' ? 'es' : 'fr'; } catch (e) { return 'fr'; } })();
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-fr]').forEach(function(el){ el.innerHTML = el.getAttribute('data-' + LANG); });
  document.querySelectorAll('[data-ph-fr]').forEach(function(el){ el.setAttribute('placeholder', el.getAttribute('data-ph-' + LANG)); });
  document.querySelectorAll('.lang-toggle button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l') === LANG); });
  if (typeof window.onLang === 'function') window.onLang();
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.lang-toggle button'); if (!b) return;
  e.stopPropagation(); LANG = b.getAttribute('data-l');
  try { localStorage.setItem('dak-lang', LANG); } catch (e2) {}
  applyLang();
}, true);
document.addEventListener('DOMContentLoaded', applyLang);
</script>
