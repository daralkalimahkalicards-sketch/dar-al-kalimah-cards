<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dar Al-Kalimah - Jeu de mémoire : Mots &amp; images</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --bordeaux:#5D1828;
    --bordeaux-dark:#3a0f19;
    --gold:#C8A462;
    --gold-light:#dfc28b;
    --white:#FFFFFF;
    --radius-xl:28px;
    --radius-lg:22px;
    --radius-md:18px;
    --radius-sm:12px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    height:100dvh; height:100svh;
    background:#FFFFFF;
    font-family:'Montserrat', system-ui, sans-serif;
    color:var(--bordeaux);
    display:flex; justify-content:center;
    padding:12px 14px calc(10px + var(--safe-bottom));
    padding-top:calc(12px + var(--safe-top));
    overflow:hidden;
    position:relative;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:
      radial-gradient(circle at 12% 18%, rgba(200,164,98,0.13), transparent 26%),
      radial-gradient(circle at 88% 12%, rgba(93,24,40,0.08), transparent 28%),
      radial-gradient(circle at 50% 92%, rgba(200,164,98,0.10), transparent 34%);
  }
  .ar-text{
    font-family:'Amiri','Traditional Arabic',serif;
    direction:rtl; unicode-bidi:isolate;
    font-feature-settings:"liga" 1,"calt" 1,"mark" 1,"mkmk" 1;
  }

  #app{ width:100%; max-width:640px; height:100%; display:flex; flex-direction:column; min-height:0; }

  .top-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex:0 0 auto; }
  .lang-toggle{ display:flex; background:rgba(93,24,40,0.06); border:1px solid rgba(200,164,98,0.4); border-radius:999px; padding:3px; }
  .lang-toggle button{
    border:none; background:transparent; color:var(--bordeaux); font-family:'Montserrat',sans-serif;
    font-weight:700; font-size:0.82rem; padding:6px 14px; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .lang-toggle button.active{ background:var(--bordeaux); color:var(--gold); }
  .btn-house{
    width:42px; height:42px; border-radius:999px; border:1px solid rgba(200,164,98,0.5);
    background:rgba(93,24,40,0.06); color:var(--bordeaux); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1.1rem; transition:.2s;
  }
  .btn-house i{ color:var(--bordeaux); }
  .btn-house:hover{ background:var(--bordeaux); }
  .btn-house:hover i{ color:var(--gold); }

  .view{ display:none; flex:1; min-height:0; flex-direction:column; align-items:center; text-align:center; }
  .view.active{ display:flex; }
  #view-intro.active, #view-end.active{ overflow-y:auto; }

  .app-title{ font-family:'Cinzel',serif; color:var(--bordeaux); font-size:clamp(1.25rem,5vw,1.8rem); margin:0 0 8px; }
  .app-subtitle{ color:#6b4b53; font-size:0.96rem; margin:0 0 22px; line-height:1.5; }

  .intro-container{
    width:100%; background:#fff; border:1px solid rgba(200,164,98,0.3);
    border-radius:var(--radius-xl); padding:34px 26px; box-shadow:0 20px 50px rgba(93,24,40,0.08);
    position:relative;
  }
  .intro-container::before{
    content:""; position:absolute; inset:12px; border-radius:20px;
    border:1px solid rgba(200,164,98,0.18); pointer-events:none;
  }
  .intro-icon{
    width:74px; height:74px; margin:0 auto 18px; border-radius:999px;
    background:linear-gradient(145deg, var(--bordeaux), var(--bordeaux-dark));
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(93,24,40,0.25);
  }
  .intro-logo{ font-family:'Cinzel',serif; font-weight:700; font-size:1.3rem; letter-spacing:0.06em; color:var(--gold); }

  .rules-list{ list-style:none; padding:0; margin:0 0 26px; text-align:left; }
  .rules-list li{ display:flex; align-items:flex-start; gap:12px; font-size:0.92rem; color:#4a3338; margin-bottom:12px; line-height:1.5; }
  .step-num{
    display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; border-radius:999px;
    background:var(--bordeaux); color:#fff; font-size:0.7rem; font-weight:700; flex-shrink:0; margin-top:1px;
  }

  .btn-primary{
    background:linear-gradient(145deg, var(--bordeaux), var(--bordeaux-dark)); color:var(--gold);
    border:none; border-radius:999px; padding:15px 38px; font-family:'Montserrat',sans-serif; font-weight:700;
    font-size:1rem; letter-spacing:0.03em; cursor:pointer; box-shadow:0 10px 24px rgba(93,24,40,0.25);
    transition:transform .2s;
  }
  .btn-primary:active{ transform:scale(0.97); }
  .btn-secondary{
    background:#fff; color:var(--bordeaux); border:2px solid var(--gold); border-radius:999px;
    padding:13px 34px; font-family:'Montserrat',sans-serif; font-weight:700; font-size:0.96rem;
    cursor:pointer; margin-top:12px;
  }

  .stat-row{ display:flex; gap:10px; width:100%; margin-bottom:10px; flex:0 0 auto; }
  .stat-chip{
    flex:1; background:#fff; border:1px solid rgba(200,164,98,0.4); border-radius:999px;
    padding:9px 14px; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:0.85rem; color:var(--bordeaux);
  }
  .stat-chip i{ color:var(--gold); }

  .memory-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); grid-auto-rows:1fr; gap:6px;
    width:100%; height:100%; flex:1; min-height:0; margin:0 auto;
  }
  @media (min-width:480px){
    .memory-grid{ grid-template-columns:repeat(7, 1fr); gap:8px; }
  }
  .mcard{ position:relative; width:100%; height:100%; min-height:0; cursor:pointer; perspective:900px; }
  .mcard-inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.2,.8,.3,1);
    transform-style:preserve-3d;
  }
  .mcard.flipped .mcard-inner, .mcard.matched .mcard-inner{ transform:rotateY(180deg); }
  .mcard-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; padding:3px;
  }
  .mcard-front{
    background:linear-gradient(145deg, var(--bordeaux), var(--bordeaux-dark));
    border:1px solid rgba(200,164,98,0.45); box-shadow:0 6px 14px rgba(93,24,40,0.18);
  }
  .mcard-front span{ font-family:'Cinzel',serif; font-weight:700; font-size:clamp(0.5rem, 2.4vh, 0.85rem); letter-spacing:0.08em; color:var(--gold); }
  .mcard-back{
    background:#ffffff; border:2px solid var(--gold); transform:rotateY(180deg);
    flex-direction:column; gap:2px;
  }
  .mcard.matched .mcard-back{ box-shadow:0 0 0 3px rgba(200,164,98,0.55) inset; }
  .mcard-check{
    position:absolute; top:4px; right:4px; color:var(--gold); font-size:0.7rem;
    opacity:0; transition:opacity .2s;
  }
  .mcard.matched .mcard-check{ opacity:1; }
  .mcard-word{ font-size:clamp(0.55rem, min(4.4vw, 6vh), 1.5rem); color:var(--bordeaux); line-height:1.15; overflow-wrap:break-word; }
  .mcard-icon{ font-size:clamp(0.9rem, min(7vw, 6vh), 2.1rem); color:var(--gold); }

  #view-end .intro-container{ padding:40px 26px; }
  .intro-icon.success{ background:linear-gradient(145deg, var(--gold), var(--gold-light)); }
  .intro-icon.success i{ color:var(--bordeaux); font-size:2rem; }
  .end-detail{ color:#6b4b53; font-size:0.98rem; margin-bottom:26px; }

  @media (max-width:480px){
    .intro-container{ padding:26px 18px; }
    .app-title{ font-size:1.2rem; }
  }
  @media (max-width:360px){
    .memory-grid{ gap:5px; }
    .stat-chip{ font-size:0.76rem; padding:8px 10px; }
  }
  @media print{ body{ display:none; } }
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div class="lang-toggle" id="lang-toggle">
      <button data-lang="fr" class="active">FR</button>
      <button data-lang="es">ES</button>
    </div>
    <button class="btn-house" onclick="goHome()" aria-label="Retour à l'accueil"><i class="fa-solid fa-house"></i></button>
  </div>

  <section id="view-intro" class="view active">
    <div class="intro-container">
      <div class="intro-icon"><span class="intro-logo">DAK</span></div>
      <h1 class="app-title" id="intro-title"></h1>
      <p class="app-subtitle" id="intro-subtitle"></p>
      <ul class="rules-list">
        <li><span class="step-num">1</span><span id="step1-text"></span></li>
        <li><span class="step-num">2</span><span id="step2-text"></span></li>
        <li><span class="step-num">3</span><span id="step3-text"></span></li>
      </ul>
      <button id="btn-start" class="btn-primary"></button>
    </div>
  </section>

  <section id="view-game" class="view">
    <div class="stat-row">
      <div class="stat-chip"><i class="fa-solid fa-layer-group"></i><span id="pairs-label"></span></div>
      <div class="stat-chip"><i class="fa-solid fa-arrows-rotate"></i><span id="moves-label"></span></div>
    </div>
    <div class="memory-grid" id="memory-grid"></div>
  </section>

  <section id="view-end" class="view">
    <div class="intro-container">
      <div class="intro-icon success"><i class="fa-solid fa-star"></i></div>
      <h1 class="app-title" id="end-title"></h1>
      <p class="end-detail" id="end-detail"></p>
      <button id="btn-restart" class="btn-primary"></button>
      <br>
      <button id="btn-home2" class="btn-secondary" onclick="goHome()"></button>
    </div>
  </section>
</div>

<script>
const HOME_HREF = "kalijeux.html";
const SUCCESS_AUDIO = "mabruk.mp3";
const SILENT_UNLOCK = "data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTAAAAA=";

const WORDS = [
  {id:1,  word:"البَيْت",       fr:"la maison", es:"la casa", icon:"fa-solid fa-house",     audio:"audio/qamariyya/al-bayt.mp3"},
  {id:2,  word:"بَاب",          fr:"porte",   es:"puerta",   icon:"fa-solid fa-door-closed", audio:"audio/module3/bab.mp3"},
  {id:3,  word:"شَمْس",         fr:"soleil",  es:"sol",      icon:"fa-solid fa-sun",         audio:"audio/shams.mp3"},
  {id:4,  word:"قَمَر",         fr:"lune",    es:"luna",     icon:"fa-solid fa-moon",        audio:"audio/qamar.mp3"},
  {id:5,  word:"مَاء",          fr:"eau",     es:"agua",     icon:"fa-solid fa-droplet",     audio:"audio/ma.mp3"},
  {id:6,  word:"نَار",          fr:"feu",     es:"fuego",    icon:"fa-solid fa-fire",        audio:"audio/module3/nar.mp3"},
  {id:7,  word:"كِتَاب",        fr:"livre",   es:"libro",    icon:"fa-solid fa-book",        audio:"audio/kitab.mp3"},
  {id:8,  word:"قَلَم",         fr:"stylo",   es:"bolígrafo",icon:"fa-solid fa-pen",         audio:"audio/qalam.mp3"},
  {id:9,  word:"الشَّجَرَة",    fr:"l'arbre", es:"el árbol", icon:"fa-solid fa-tree",        audio:"audio/shamsiyya/ash-shajara.mp3"},
  {id:10, word:"سَمَك",         fr:"poisson", es:"pescado",  icon:"fa-solid fa-fish",        audio:"audio/samak.mp3"},
  {id:11, word:"عُصْفُور",      fr:"oiseau",  es:"pájaro",   icon:"fa-solid fa-dove",        audio:"audio/module3/usfur.mp3"},
  {id:12, word:"قِط",           fr:"chat",    es:"gato",     icon:"fa-solid fa-cat",         audio:"audio/qitt.mp3"},
  {id:13, word:"السَّيَّارَة",  fr:"la voiture", es:"el coche", icon:"fa-solid fa-car-side", audio:"audio/shadda/sayyara.mp3"},
  {id:14, word:"نَجْم",         fr:"étoile",  es:"estrella", icon:"fa-solid fa-star",        audio:"audio/najm.mp3"}
];

const UI_TEXT = {
  fr:{
    introTitle:"Jeu de mémoire — Mots & images",
    introSubtitle:"Retrouve les paires : un mot arabe et son image.",
    step1:"Retourne deux cartes à la fois.",
    step2:"Si le mot et l'image correspondent, la paire reste face visible.",
    step3:"Retrouve les 14 paires avec le moins de coups possible !",
    start:"Commencer",
    pairsLabel:(f,t)=>`Paires : ${f} / ${t}`,
    movesLabel:(m)=>`Coups : ${m}`,
    endTitle:"Mabrouk !",
    endDetail:(m)=>`Toutes les paires trouvées en ${m} coups.`,
    restart:"Rejouer",
    home:"Accueil"
  },
  es:{
    introTitle:"Juego de memoria — Palabras e imágenes",
    introSubtitle:"Encuentra las parejas: una palabra árabe y su imagen.",
    step1:"Voltea dos cartas a la vez.",
    step2:"Si la palabra y la imagen coinciden, la pareja queda boca arriba.",
    step3:"¡Encuentra las 14 parejas con el menor número de intentos!",
    start:"Empezar",
    pairsLabel:(f,t)=>`Parejas: ${f} / ${t}`,
    movesLabel:(m)=>`Intentos: ${m}`,
    endTitle:"¡Mabrouk!",
    endDetail:(m)=>`Todas las parejas encontradas en ${m} intentos.`,
    restart:"Jugar de nuevo",
    home:"Inicio"
  }
};

const AudioController = {
  player:new Audio(), effectPlayer:new Audio(), isUnlocked:false,
  init(){
    this.player.preload="none"; this.effectPlayer.preload="none";
    this.player.playsInline=true; this.effectPlayer.playsInline=true;
    this.player.volume=1; this.effectPlayer.volume=1;
  },
  async unlock(){
    if(this.isUnlocked) return true;
    try{
      const s = SILENT_UNLOCK;
      this.player.pause(); this.effectPlayer.pause();
      this.player.currentTime=0; this.effectPlayer.currentTime=0;
      this.player.src=s; this.effectPlayer.src=s;
      this.player.muted=true; this.effectPlayer.muted=true;
      await Promise.race([this.player.play().catch(() => {}), new Promise(r => setTimeout(r, 1200))]);
      this.player.pause(); this.player.currentTime=0;
      await Promise.race([this.effectPlayer.play().catch(() => {}), new Promise(r => setTimeout(r, 1200))]);
      this.effectPlayer.pause(); this.effectPlayer.currentTime=0;
      this.player.muted=false; this.effectPlayer.muted=false;
      this.player.removeAttribute("src"); this.effectPlayer.removeAttribute("src");
      this.player.load(); this.effectPlayer.load();
      this.isUnlocked=true; return true;
    }catch(_){ this.player.muted=false; this.effectPlayer.muted=false; return false; }
  },
  async playEffect(src){
    if(!src) return;
    try{ this.effectPlayer.pause(); this.effectPlayer.currentTime=0; this.effectPlayer.src=src; this.effectPlayer.load(); await this.effectPlayer.play(); }catch(_){}
  },
  stopAll(){
    this.player.pause(); this.effectPlayer.pause();
    this.player.currentTime=0; this.effectPlayer.currentTime=0;
  }
};
AudioController.init();

const state = {
  lang:'fr',
  cards:[],
  flipped:[],
  matchedIdx:new Set(),
  moves:0,
  lock:false,
  isStarting:false,
  hasFinished:false,
  hasPlayedSuccess:false
};

const DOM = {
  intro: document.getElementById('view-intro'),
  game: document.getElementById('view-game'),
  end: document.getElementById('view-end'),
  grid: document.getElementById('memory-grid'),
  pairsLabel: document.getElementById('pairs-label'),
  movesLabel: document.getElementById('moves-label')
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildDeck(){
  const deck = [];
  WORDS.forEach(W=>{
    deck.push({pairId:W.id, kind:'word', word:W.word, audio:W.audio});
    deck.push({pairId:W.id, kind:'icon', icon:W.icon, audio:W.audio});
  });
  return shuffle(deck);
}

function switchView(name){
  [DOM.intro, DOM.game, DOM.end].forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
}

function setLang(lang){
  state.lang = lang;
  document.querySelectorAll('#lang-toggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  refreshUITexts();
}

function refreshUITexts(){
  const t = UI_TEXT[state.lang];
  document.getElementById('intro-title').textContent = t.introTitle;
  document.getElementById('intro-subtitle').textContent = t.introSubtitle;
  document.getElementById('step1-text').textContent = t.step1;
  document.getElementById('step2-text').textContent = t.step2;
  document.getElementById('step3-text').textContent = t.step3;
  document.getElementById('btn-start').textContent = t.start;
  document.getElementById('btn-restart').textContent = t.restart;
  document.getElementById('btn-home2').textContent = t.home;
  document.getElementById('end-title').textContent = t.endTitle;
  DOM.pairsLabel.textContent = t.pairsLabel(state.matchedIdx.size/2, WORDS.length);
  DOM.movesLabel.textContent = t.movesLabel(state.moves);
  if(state.hasFinished){
    document.getElementById('end-detail').textContent = t.endDetail(state.moves);
  }
}

function renderGrid(){
  DOM.grid.innerHTML = '';
  state.cards.forEach((c, idx)=>{
    const el = document.createElement('div');
    el.className = 'mcard';
    el.dataset.idx = idx;

    const inner = document.createElement('div');
    inner.className = 'mcard-inner';

    const front = document.createElement('div');
    front.className = 'mcard-face mcard-front';
    front.innerHTML = '<span>DAK</span>';

    const back = document.createElement('div');
    back.className = 'mcard-face mcard-back';
    const check = document.createElement('i');
    check.className = 'fa-solid fa-circle-check mcard-check';
    back.appendChild(check);
    if(c.kind === 'word'){
      const span = document.createElement('span');
      span.className = 'ar-text mcard-word';
      span.textContent = c.word;
      back.appendChild(span);
    }else{
      const icon = document.createElement('i');
      icon.className = c.icon + ' mcard-icon';
      back.appendChild(icon);
    }

    inner.appendChild(front);
    inner.appendChild(back);
    el.appendChild(inner);
    el.addEventListener('click', ()=>onCardClick(idx));
    DOM.grid.appendChild(el);
  });
}

function cardEl(idx){ return DOM.grid.querySelector('.mcard[data-idx="'+idx+'"]'); }

function onCardClick(idx){
  if(state.lock) return;
  if(state.flipped.includes(idx) || state.matchedIdx.has(idx)) return;
  if(state.flipped.length >= 2) return;

  const card = state.cards[idx];
  cardEl(idx).classList.add('flipped');
  state.flipped.push(idx);

  AudioController.playEffect(card.audio);

  if(state.flipped.length === 2){
    state.moves++;
    refreshUITexts();
    state.lock = true;
    const [i1, i2] = state.flipped;
    const c1 = state.cards[i1], c2 = state.cards[i2];
    const isMatch = c1.pairId === c2.pairId && c1.kind !== c2.kind;

    if(isMatch){
      setTimeout(()=>{
        state.matchedIdx.add(i1); state.matchedIdx.add(i2);
        cardEl(i1).classList.add('matched');
        cardEl(i2).classList.add('matched');
        state.flipped = [];
        state.lock = false;
        refreshUITexts();
        checkEnd();
      }, 500);
    }else{
      setTimeout(()=>{
        cardEl(i1).classList.remove('flipped');
        cardEl(i2).classList.remove('flipped');
        state.flipped = [];
        state.lock = false;
      }, 900);
    }
  }
}

function checkEnd(){
  if(state.matchedIdx.size === state.cards.length){
    endGame();
  }
}

function endGame(){
  if(state.hasFinished) return;
  state.hasFinished = true;
  AudioController.stopAll();

  switchView('end');
  document.getElementById('end-detail').textContent = UI_TEXT[state.lang].endDetail(state.moves);

  const end = Date.now() + 2600;
  (function frame(){
    if(typeof confetti === 'function'){
      confetti({ particleCount:5, angle:60,  spread:55, origin:{x:0}, colors:['#C8A462','#5D1828','#dfc28b'] });
      confetti({ particleCount:5, angle:120, spread:55, origin:{x:1}, colors:['#C8A462','#5D1828','#dfc28b'] });
    }
    if(Date.now() < end) requestAnimationFrame(frame);
  })();

  if(state.hasPlayedSuccess) return;
  state.hasPlayedSuccess = true;
  AudioController.playEffect(SUCCESS_AUDIO);
}

function startGame(){
  state.cards = buildDeck();
  state.flipped = [];
  state.matchedIdx = new Set();
  state.moves = 0;
  state.lock = false;
  state.hasFinished = false;
  state.hasPlayedSuccess = false;
  renderGrid();
  refreshUITexts();
  switchView('game');
}

function goHome(){
  window.location.href = HOME_HREF;
}

document.getElementById('btn-start').addEventListener('click', async ()=>{
  if(state.isStarting) return;
  state.isStarting = true;
  await AudioController.unlock();
  startGame();
  state.isStarting = false;
});
document.getElementById('btn-restart').addEventListener('click', startGame);
document.querySelectorAll('#lang-toggle button').forEach(b=>{
  b.addEventListener('click', ()=> setLang(b.dataset.lang));
});

refreshUITexts();
</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="onesignal-init.js" type="module"></script>
</body>
</html>
